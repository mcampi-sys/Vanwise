  function openSheet(cfg) {
    const back = document.createElement('div');
    back.className = 'sheet-backdrop';
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(cfg.title)}">
      <div class="sheet-head"><h2>${esc(cfg.title)}</h2>
        <button class="btn btn-ghost btn-sm" data-close>Close</button></div>
      <div class="sheet-body">${cfg.body}</div>
      ${cfg.confirm ? `<div class="sheet-foot">
        ${cfg.danger ? `<button class="btn btn-danger" data-danger>${esc(cfg.danger)}</button>` : ''}
        <button class="btn btn-primary" data-confirm>${esc(cfg.confirm)}</button></div>` : ''}
    </div>`;
    document.body.appendChild(back);
    sheetStack.push(back);
    const close = () => closeSheet(back);
    back.addEventListener('click', e => { if (e.target === back) close(); });
    $('[data-close]', back).addEventListener('click', close);
    const cbtn = $('[data-confirm]', back);
    if (cbtn) cbtn.addEventListener('click', () => { if (cfg.onConfirm && cfg.onConfirm() === false) return; close(); });
    const dbtn = $('[data-danger]', back);
    if (dbtn) dbtn.addEventListener('click', () => { if (cfg.onDanger) cfg.onDanger(); close(); });
    if (cfg.onOpen) cfg.onOpen(back);
    return back;
  }
  function closeSheet(back) {
    const b = back || sheetStack[sheetStack.length - 1]; if (!b) return;
    b.remove(); sheetStack = sheetStack.filter(x => x !== b);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) closeSheet(); });

  /* chip group helper inside sheets */
  function chipGroup(name, options, selected, multi) {
    return `<div class="chips" data-chipgroup="${name}" data-multi="${multi ? 1 : 0}">` +
      options.map(o => {
        const v = o.v || o.id || o, l = o.l || o.label || o;
        const on = multi ? (selected || []).includes(v) : selected === v;
        return `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="${on}">${esc(l)}</button>`;
      }).join('') + '</div>';
  }
  function chipValue(root, name) {
    const g = $(`[data-chipgroup="${name}"]`, root); if (!g) return null;
    const on = $$('.chip[aria-pressed="true"]', g).map(b => b.dataset.v);
    return g.dataset.multi === '1' ? on : (on[0] || null);
  }
  document.addEventListener('click', e => {
    const ct = e.target.closest('[data-ctype]');
    if (ct) {
      const t = ct.dataset.ctype;
      const sheet = ct.closest('.sheet');
      const room = ((($('#ncRoom', sheet) || {}).value) || '').trim();
      const statBtn = $('[data-nstat] button[data-v="stat"]', sheet);
      const stat = !!statBtn && statBtn.getAttribute('aria-pressed') === 'true';
      closeSheet();
      setTimeout(() => startConsult(t, room, stat), 60);
      return;
    }
    const chip = e.target.closest('.chip[data-v]'); if (!chip) return;
    const g = chip.closest('[data-chipgroup]'); if (!g) return;
    const multi = g.dataset.multi === '1';
    const on = chip.getAttribute('aria-pressed') === 'true';
    if (!multi) {
      /* single-select: tapping the one already chosen keeps it, it does not clear it */
      $$('.chip', g).forEach(c => c.setAttribute('aria-pressed', 'false'));
      chip.setAttribute('aria-pressed', 'true');
    } else {
      chip.setAttribute('aria-pressed', String(!on));
    }
    if (g.dataset.onchange) syncConsultBranch(chip.closest('.sheet'), g.dataset.onchange === 'consult' ? 'access' : g.dataset.onchange);
    if (g.dataset.onchange === 'algo') { /* live */ }
  });
  document.addEventListener('change', e => {
    const chk = e.target.closest('.check input[type=checkbox]');
    if (chk) chk.closest('.check').dataset.on = String(chk.checked);
  });

  /* ---------------- consult capture ---------------- */
  function timeField(id, label, ts) {
    return `<div class="field"><label for="${id}">${esc(label)}</label>
      <div class="split"><input type="time" id="${id}" class="grow" value="${ts ? fmtClock24(ts) : ''}">
      <button type="button" class="btn btn-sm btn-gold" data-now="${id}">Now</button></div></div>`;
  }
  function checkBox(id, label, on) {
    return `<label class="check" style="margin-bottom:8px" data-on="${!!on}">
      <input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${esc(label)}</label>`;
  }
  function devChips(name, ids, sel) {
    const opts = ids.map(i => {
      const d = VW.opts.devices.find(x => x.id === i);
      return { v: i, l: d ? d.label : i };
    });
    return chipGroup(name, opts, sel, false);
  }
  function multiCheck(prefix, items, selected) {
    return items.map((x, i) => checkBox(prefix + i, x, (selected || []).indexOf(x) >= 0)).join('');
  }
  function readMulti(root, prefix, items) {
    return items.filter((x, i) => (($('#' + prefix + i, root) || {}).checked));
  }

  function removalBlock(d) {
    return `<div class="section-label">If the device was removed</div>
      ${checkBox('rmDone', 'Device removed', d.removed)}
      <div data-block="removal" ${d.removed ? '' : 'hidden'}>
        <div class="inline-2">
          <div class="field"><label for="rmInit">Initial measurement (cm)</label>
            <input type="number" step="0.1" id="rmInit" value="${esc(d.removalInit || '')}" placeholder="at insertion"></div>
          <div class="field"><label for="rmLast">Measurement on removal (cm)</label>
            <input type="number" step="0.1" id="rmLast" value="${esc(d.removalLast || '')}" placeholder="what came out"></div>
        </div>
        ${checkBox('rmTip', 'Tip intact, catheter complete', d.tipIntact)}
        <div class="help">Compare the two numbers. If what came out is shorter than what went in, the catheter is not complete — do not discard it, escalate immediately.</div>
      </div>`;
  }
  function readRemoval(root) {
    return {
      removed: (($('#rmDone', root) || {}).checked) || false,
      removalInit: ($('#rmInit', root) || {}).value || '',
      removalLast: ($('#rmLast', root) || {}).value || '',
      tipIntact: (($('#rmTip', root) || {}).checked) || false
    };
  }

  /* ---- branch: Access ---- */
  function bodyAccess(ev) {
    const d = ev.access || {};
    return `
      <div class="field"><label class="field-label">Device placed</label>
        ${devChips('aDevice', VW.consult.accessDevices, d.device || 'piv').replace('data-chipgroup', 'data-onchange="access" data-chipgroup')}</div>

      <div data-block="pivsize">
        <div class="field"><label class="field-label">Gauge</label>
          ${chipGroup('aGauge', VW.opts.gauges.map(g => ({ v: g, l: g + ' G' })), d.gauge || null, false)}</div>
        <div class="field"><label class="field-label">Length (inches)</label>
          ${chipGroup('aLength', VW.opts.lengths.map(l => ({ v: l, l: l + '"' })), d.length || null, false)}</div>
      </div>
      <div data-block="cvsize" hidden>
        <div class="field"><label class="field-label">French size</label>
          ${chipGroup('aFr', ['3 Fr', '4 Fr', '5 Fr', '6 Fr'].map(x => ({ v: x, l: x })), d.fr || null, false)}</div>
        <div class="field"><label class="field-label">Lumens</label>
          ${chipGroup('aLumens', ['1', '2', '3'].map(x => ({ v: x, l: x })), d.lumens || null, false)}</div>
        <div class="inline-2">
          <div class="field"><label for="aInserted">Inserted length (cm)</label>
            <input type="number" step="0.1" id="aInserted" value="${esc(d.inserted || '')}"></div>
          <div class="field"><label for="aCirc">Arm circumference (cm)</label>
            <input type="number" step="0.1" id="aCirc" value="${esc(d.circ || '')}"></div>
        </div>
      </div>

      <div class="inline-2">
        <div class="field"><label class="field-label">Side</label>
          ${chipGroup('aSide', VW.opts.sides.map(x => ({ v: x, l: x })), d.side || null, false)}</div>
        <div class="field"><label for="aSite">Site</label>
          <select id="aSite"><option value="">—</option>${VW.opts.sites.map(x => `<option ${d.site === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      </div>

      <div class="field"><label class="field-label">Dressing</label>
        ${chipGroup('aDressing', VW.opts.dressings.map(x => ({ v: x, l: x })), d.dressing || null, false)}</div>

      <div class="field"><label class="field-label">Attempts</label>
        ${chipGroup('aAttempts', ['1', '2'].map(x => ({ v: x, l: x })), d.attempts || '1', false)}
        <div class="help">One person attempts no more than two. Four attempts total, then notify the physician (M03 10 448).</div></div>

      ${checkBox('aUnsucc', 'Unsuccessful', d.unsuccessful)}
      <div class="field"><label for="aArea">Areas attempted</label>
        <input type="text" id="aArea" value="${esc(d.area || '')}" placeholder="e.g. R forearm, L hand"></div>

      <hr>
      <div class="section-label" style="margin-top:0">Handover</div>
      ${checkBox('aSecond', '2nd assessment by RN', d.secondRN)}
      ${checkBox('aEscalated', 'Escalated', d.escalated)}
      ${checkBox('aMD', 'Notified MD', d.notifiedMD)}
      ${checkBox('aRN', 'Notified RN', d.notifiedRN)}`;
  }
  function readAccess(root) {
    const device = chipValue(root, 'aDevice') || 'piv';
    return {
      device: device,
      gauge: chipValue(root, 'aGauge'), length: chipValue(root, 'aLength'),
      fr: chipValue(root, 'aFr'), lumens: chipValue(root, 'aLumens'),
      inserted: ($('#aInserted', root) || {}).value || '',
      circ: ($('#aCirc', root) || {}).value || '',
      side: chipValue(root, 'aSide'), site: ($('#aSite', root) || {}).value || '',
      dressing: chipValue(root, 'aDressing'), attempts: chipValue(root, 'aAttempts'),
      us: device === 'usgpiv',
      unsuccessful: (($('#aUnsucc', root) || {}).checked) || false,
      area: ($('#aArea', root) || {}).value || '',
      secondRN: (($('#aSecond', root) || {}).checked) || false,
      escalated: (($('#aEscalated', root) || {}).checked) || false,
      notifiedMD: (($('#aMD', root) || {}).checked) || false,
      notifiedRN: (($('#aRN', root) || {}).checked) || false
    };
  }

  /* ---- branch: Troubleshooting ---- */
  function bodyTrouble(ev) {
    const d = ev.trouble || {};
    return `
      <div class="field"><label class="field-label">Device</label>
        ${devChips('tDevice', VW.consult.troubleDevices, d.device || 'picc').replace('data-chipgroup', 'data-onchange="trouble" data-chipgroup')}</div>

      <div data-block="midwarn" hidden>
        <div class="callout warn">${I.warn}<div><b>Midlines are not de-clotted.</b>
          Lee Health M03 10 605: a clotted midline is removed. Do not instil a thrombolytic — record the removal below.</div></div>
      </div>
      <div data-block="hdwarn" hidden>
        <div class="callout warn">${I.warn}<div><b>Restricted device.</b>
          Dialysis, apheresis and CRRT catheters are de-clotted only by the personnel named in M03 10 357 — dialysis staff for dialysis catheters, IR for apheresis, ICU RNs for CRRT in the ICU.</div></div>
      </div>

      <div class="field"><label for="tProblem">What is it doing?</label>
        <select id="tProblem"><option value="">—</option>
        ${VW.consult.problems.map(x => `<option ${d.problem === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>

      <div class="section-label">Step 1 — mechanical causes ruled out</div>
      ${multiCheck('tMech', VW.consult.mechanical, d.mechanical)}

      <div class="section-label">Step 2 — signs of thrombosis</div>
      ${checkBox('tThrombus', 'Arm, shoulder, neck or facial swelling, pain or collateral veins', d.thrombosis)}
      <div data-block="thrombwarn" ${d.thrombosis ? '' : 'hidden'}>
        <div class="callout warn">${I.stop}<div>Stop. This is an imaging and escalation problem, not a clearing problem. Measure arm circumference against baseline and escalate for ultrasound.</div></div>
      </div>

      <div class="section-label">Step 3 — thrombolytic</div>
      <div class="help" style="margin-top:0;margin-bottom:10px">Requires an order. Dose, volume and dwell per M03 10 028 Alteplase (t-PA) for Central Line Catheter Occlusions – Adult. Alteplase is a high alert medication.</div>
      ${timeField('tIn', 'tPA instilled', d.tpaIn)}
      ${timeField('tOut', 'tPA withdrawn', d.tpaOut)}
      ${checkBox('tDose2', 'Second dose given', d.dose2)}

      <div class="section-label">Step 4 — imaging and outcome</div>
      ${checkBox('tXray', 'Chest x-ray obtained', d.xray)}
      <div class="field"><label for="tOutcome">Outcome</label>
        <select id="tOutcome"><option value="">—</option>
        ${VW.consult.outcomes.map(x => `<option ${d.outcome === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>

      ${removalBlock(d)}`;
  }
  function readTrouble(root) {
    const dayKey = S.current ? S.current.date : dateKey();
    const tin = ($('#tIn', root) || {}).value, tout = ($('#tOut', root) || {}).value;
    return Object.assign({
      device: chipValue(root, 'tDevice'),
      problem: ($('#tProblem', root) || {}).value || '',
      mechanical: readMulti(root, 'tMech', VW.consult.mechanical),
      thrombosis: (($('#tThrombus', root) || {}).checked) || false,
      tpaIn: tin ? timeToTs(dayKey, tin) : null,
      tpaOut: tout ? timeToTs(dayKey, tout) : null,
      dose2: (($('#tDose2', root) || {}).checked) || false,
      xray: (($('#tXray', root) || {}).checked) || false,
      outcome: ($('#tOutcome', root) || {}).value || ''
    }, readRemoval(root));
  }

  /* ---- branch: Clearing a device for use ---- */
  function bodyClearing(ev) {
    const d = ev.clearing || {};
    return `
      <div class="callout tip">${I.ok}<div>Lee Health M03 10 711 Appendix C. A line placed inside the system clears without a chest x-ray only if all three criteria below are met.</div></div>

      <div class="field"><label class="field-label">Device</label>
        ${devChips('clDevice', VW.consult.clearingDevices, d.device || 'picc')}</div>

      <div class="field"><label class="field-label">Where was it placed?</label>
        ${chipGroup('clOrigin', [{ v: 'ours', l: 'Ours — Lee Health' }, { v: 'outside', l: 'Not ours — outside' }], d.origin || null, false)
        .replace('data-chipgroup', 'data-onchange="clearing" data-chipgroup')}</div>

      <div data-block="outsidewarn" ${d.origin === 'outside' ? '' : 'hidden'}>
        <div class="callout warn">${I.warn}<div>Placed outside Lee Health — proceed with a chest x-ray for tip confirmation. The criteria below do not substitute.</div></div>
      </div>

      <div class="section-label">The three criteria</div>
      ${checkBox('clTip', 'Tip location confirmed prior to initial use (CXR or ECG tip confirmation)', d.tipConfirmed)}
      ${checkBox('clLen', 'No change in external catheter length', d.lengthUnchanged)}
      ${checkBox('clFlush', 'Flushes and aspirates without resistance', d.flushes)}

      <div class="inline-2">
        <div class="field"><label for="clExp">Exposed length (cm)</label>
          <input type="number" step="0.1" id="clExp" value="${esc(d.exposure || '')}"></div>
        <div class="field"><label for="clCirc">Circumference (cm)</label>
          <input type="number" step="0.1" id="clCirc" value="${esc(d.circ || '')}"></div>
      </div>

      <div class="section-label">Imaging</div>
      ${checkBox('clXray', 'Chest x-ray obtained', d.xray)}
      <div class="field"><label for="clTipLoc">Tip location reported</label>
        <select id="clTipLoc"><option value="">—</option>
        ${VW.consult.tipLocations.map(x => `<option ${d.tipLocation === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>

      <div class="section-label">Outcome</div>
      ${checkBox('clCleared', 'Cleared for use', d.cleared)}
      ${checkBox('clCharted', 'Clearance charted and primary nurse notified', d.charted)}
      ${timeField('clEnd', 'Time ended', d.end)}`;
  }
  function readClearing(root) {
    const dayKey = S.current ? S.current.date : dateKey();
    const endV = ($('#clEnd', root) || {}).value;
    return {
      device: chipValue(root, 'clDevice'),
      origin: chipValue(root, 'clOrigin'),
      tipConfirmed: (($('#clTip', root) || {}).checked) || false,
      lengthUnchanged: (($('#clLen', root) || {}).checked) || false,
      flushes: (($('#clFlush', root) || {}).checked) || false,
      exposure: ($('#clExp', root) || {}).value || '',
      circ: ($('#clCirc', root) || {}).value || '',
      xray: (($('#clXray', root) || {}).checked) || false,
      tipLocation: ($('#clTipLoc', root) || {}).value || '',
      cleared: (($('#clCleared', root) || {}).checked) || false,
      charted: (($('#clCharted', root) || {}).checked) || false,
      end: endV ? timeToTs(dayKey, endV) : null
    };
  }

  /* ---- branch: Access / de-access ---- */
  function bodyDeaccess(ev) {
    const d = ev.deaccess || {};
    return `
      <div class="field"><label class="field-label">Which one?</label>
        <div class="stat-toggle" data-mode>
          <button type="button" class="calm" data-v="access" aria-pressed="${d.mode !== 'deaccess'}">Access</button>
          <button type="button" class="calm" data-v="deaccess" aria-pressed="${d.mode === 'deaccess'}">De-access</button>
        </div></div>

      <div class="field"><label class="field-label">Device</label>
        ${devChips('dDevice', VW.consult.deaccessDevices, d.device || 'port')}</div>

      <div data-block="accessOnly" ${d.mode === 'deaccess' ? 'hidden' : ''}>
        <div class="field"><label class="field-label">Needle / catheter used</label>
          ${chipGroup('dNeedle', ['19 G Huber', '20 G Huber', '22 G Huber', '16 G Insyte', '14 G Insyte'].map(x => ({ v: x, l: x })), d.needle || null, false)}
          <div class="help">A PowerFlow apheresis port takes a 16 or 14 G Insyte Autoguard at about 30°, never a Huber needle.</div></div>
      </div>

      ${checkBox('dBlood', 'Blood return present', d.bloodReturn)}
      <div data-block="nobloodwarn" ${d.bloodReturn ? 'hidden' : ''}>
        <div class="callout warn">${I.warn}<div>No blood return — do not use the device until patency is established. Treat as a withdrawal occlusion and troubleshoot.</div></div>
      </div>
      ${checkBox('dFlush', 'Flushed', d.flush)}
      ${checkBox('dDraw', 'Blood drawn', d.draw)}
      ${checkBox('dDressing', 'Dressing applied', d.dressing)}

      ${removalBlock(d)}`;
  }
  function readDeaccess(root) {
    const modeBtn = $('[data-mode] button[aria-pressed="true"]', root);
    return Object.assign({
      mode: modeBtn ? modeBtn.dataset.v : 'access',
      device: chipValue(root, 'dDevice'),
      needle: chipValue(root, 'dNeedle'),
      bloodReturn: (($('#dBlood', root) || {}).checked) || false,
      flush: (($('#dFlush', root) || {}).checked) || false,
      draw: (($('#dDraw', root) || {}).checked) || false,
      dressing: (($('#dDressing', root) || {}).checked) || false
    }, readRemoval(root));
  }

  /* ---- branch: Dressing change ---- */
  function bodyDressing(ev) {
    const d = ev.dressing || {};
    return `
      <div class="field"><label class="field-label">Device</label>
        ${devChips('drDevice', ['piv', 'midline', 'picc', 'cvc', 'port', 'apheresis'], d.device || 'picc')}</div>
      <div class="field"><label class="field-label">Dressing applied</label>
        ${chipGroup('drType', VW.opts.dressings.map(x => ({ v: x, l: x })), d.type || null, false)}</div>
      <div class="inline-2">
        <div class="field"><label for="drExp">Exposed length (cm)</label>
          <input type="number" step="0.1" id="drExp" value="${esc(d.exposure || '')}"></div>
        <div class="field"><label for="drCirc">Circumference (cm)</label>
          <input type="number" step="0.1" id="drCirc" value="${esc(d.circ || '')}"></div>
      </div>
      ${checkBox('drChg', 'CHG disc or gel dressing applied', d.chg)}
      ${checkBox('drSecure', 'Securement device changed', d.securement)}
      <div class="field"><label for="drPhleb">Phlebitis scale</label>
        <select id="drPhleb"><option value="">—</option>${VW.opts.phlebitis.map((x, i) => `<option value="${i}" ${String(d.phleb) === String(i) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="field"><label for="drInf">Infiltration scale</label>
        <select id="drInf"><option value="">—</option>${VW.opts.infiltration.map((x, i) => `<option value="${i}" ${String(d.inf) === String(i) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>`;
  }
  function readDressing(root) {
    return {
      device: chipValue(root, 'drDevice'),
      type: chipValue(root, 'drType'),
      exposure: ($('#drExp', root) || {}).value || '',
      circ: ($('#drCirc', root) || {}).value || '',
      chg: (($('#drChg', root) || {}).checked) || false,
      securement: (($('#drSecure', root) || {}).checked) || false,
      phleb: ($('#drPhleb', root) || {}).value || '',
      inf: ($('#drInf', root) || {}).value || ''
    };
  }

  const CONSULT_BRANCH = {
    access:   { body: bodyAccess,   read: readAccess,   key: 'access' },
    trouble:  { body: bodyTrouble,  read: readTrouble,  key: 'trouble' },
    clearing: { body: bodyClearing, read: readClearing, key: 'clearing' },
    deaccess: { body: bodyDeaccess, read: readDeaccess, key: 'deaccess' },
    dressing: { body: bodyDressing, read: readDressing, key: 'dressing' }
  };

  /* step 1 — which kind of consult. Nothing else is asked yet:
     the type is banked, the clock starts, and the detail fields
     only appear when he ticks it off as finished. */
  function openConsult(existing) {
    if (existing) return openConsultForm(existing.ctype || 'access', existing);
    openSheet({
      title: 'New consult',
      body: `
        <div class="field"><label for="ncRoom">Room / unit</label>
          <input type="text" id="ncRoom" placeholder="e.g. 4W-12" autocomplete="off"
            autocapitalize="characters" enterkeyhint="done"></div>
        <div class="field">
          <label class="field-label">Priority</label>
          <div class="stat-toggle" data-nstat>
            <button type="button" data-v="stat" aria-pressed="false">STAT</button>
            <button type="button" class="calm" data-v="routine" aria-pressed="true">Routine</button>
          </div>
        </div>
        <div class="section-label">What kind?</div>
        <div class="hub">` + VW.consult.types.map(t =>
        `<button class="hub-card ${t.tone}" data-ctype="${t.id}">
          <span class="hub-ico">${I[t.icon] || I.plus}</span>
          <b>${esc(t.label)}</b><span>${esc(t.hint)}</span></button>`).join('') + `</div>
        <div class="help" style="margin-top:12px">Tapping a type starts it. It sits in Consults and on the Shift page with the room and the clock running. Tick it off when you finish and Veinwise stamps the time, then asks for the details.</div>`,
      onOpen: back => {
        $$('[data-nstat] button', back).forEach(btn => btn.addEventListener('click', () => {
          $$('[data-nstat] button', back).forEach(x => x.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
        }));
      }
    });
  }

  /* an open consult is a real event, just not filled in yet */
  function startConsult(type, room, stat) {
    const sh = S.current; if (!sh) return;
    const now = Date.now();
    sh.events.push({
      id: uid(), kind: 'consult', ctype: type, pending: true,
      started: now, at: now, stat: !!stat, room: room || ''
    });
    sh.events.sort((a, b) => a.at - b.at);
    save(true);
    const t = VW.consult.types.find(x => x.id === type);
    toast((room ? room + ' · ' : '') + (t ? t.label : 'Consult') + ' started');
    render();
  }

  /* the tick: stamp the finish time, then let the details out */
  function finishConsult(id) {
    const sh = S.current; if (!sh) return;
    const ev = sh.events.find(x => x.id === id); if (!ev) return;
    ev.at = Date.now();
    ev.finished = ev.at;
    save(true);
    openConsultForm(ev.ctype || 'access', ev);
  }

  function dropConsult(id) {
    const sh = S.current; if (!sh) return;
    sh.events = sh.events.filter(x => x.id !== id);
    save(true); toast('Discarded'); render();
  }

  /* step 2 — the branch */
  function openConsultForm(type, existing) {
    const branch = CONSULT_BRANCH[type] || CONSULT_BRANCH.access;
    const t = VW.consult.types.find(x => x.id === type);
    const ev = existing || {};
    const fresh = !!ev.pending;              /* just ticked off, filling it in for the first time */
    const dayKey = S.current ? S.current.date : dateKey();
    const now = ev.at || Date.now();

    openSheet({
      title: (existing && !fresh ? 'Edit — ' : '') + (t ? t.label : 'Consult'),
      body: `
        ${fresh ? `<div class="callout tip" style="margin-bottom:12px"><b>Stamped ${fmtClock(now)}</b>
          ${ev.started && (now - ev.started) >= 60000 ? 'Started ' + fmtClock(ev.started) + ', ' + Math.round((now - ev.started) / 60000) + ' min.' : ''}
          Fill in what you did. Anything you leave blank stays blank.</div>` : ''}
        <div class="field">
          <label class="field-label">Priority</label>
          <div class="stat-toggle" data-stat>
            <button type="button" data-v="stat" aria-pressed="${!!ev.stat}">STAT</button>
            <button type="button" class="calm" data-v="routine" aria-pressed="${!ev.stat}">Routine</button>
          </div>
        </div>
        <div class="inline-2">
          ${timeField('cTime', 'Time', now)}
          <div class="field"><label for="cRoom">Room / unit</label>
            <input type="text" id="cRoom" placeholder="e.g. 4W-12" value="${esc(ev.room || '')}"></div>
        </div>
        ${branch.body(ev)}
        <hr>
        ${checkBox('cFlag', 'Flag this interaction (avoid list)', ev.flag)}
        <div class="field" style="margin-top:12px"><label for="cNote">Note</label>
          <textarea id="cNote" placeholder="Anything worth remembering">${esc(ev.note || '')}</textarea></div>`,
      confirm: fresh ? 'Log it' : (existing ? 'Save changes' : 'Log consult'),
      danger: existing ? (fresh ? 'Discard' : 'Delete') : null,
      onDanger: () => removeEvent(existing.id),
      onOpen: back => {
        const root = $('.sheet', back);
        syncConsultBranch(root, type);
        $$('[data-stat] button, [data-mode] button', root).forEach(btn => btn.addEventListener('click', () => {
          const grp = btn.closest('[data-stat],[data-mode]');
          $$('button', grp).forEach(x => x.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          syncConsultBranch(root, type);
        }));
        $$('[data-now]', root).forEach(btn => btn.addEventListener('click', () => {
          const f = $('#' + btn.dataset.now, root); if (f) f.value = fmtClock24(Date.now());
        }));
        $$('.check input[type=checkbox]', root).forEach(cb => cb.addEventListener('change', () => syncConsultBranch(root, type)));
      },
      onConfirm: () => {
        const root = $('.sheet', sheetStack[sheetStack.length - 1]);
        const timeVal = ($('#cTime', root) || {}).value || fmtClock24(Date.now());
        const rec = {
          id: existing ? existing.id : uid(),
          kind: 'consult',
          ctype: type,
          pending: false,
          started: ev.started || null,
          at: timeToTs(dayKey, timeVal),
          stat: $('[data-stat] button[data-v="stat"]', root).getAttribute('aria-pressed') === 'true',
          room: ($('#cRoom', root) || {}).value || '',
          note: ($('#cNote', root) || {}).value || '',
          flag: (($('#cFlag', root) || {}).checked) || false
        };
        rec[branch.key] = branch.read(root);
        rec.device = rec[branch.key].device || null;
        if (rec.flag && rec.room) {
          S.flags.unshift({ id: uid(), label: rec.room, note: rec.note || '', date: dayKey });
          S.flags = S.flags.slice(0, 60);
        }
        putEvent(rec, !!existing);
      }
    });
  }

  /* show and hide the bits of a branch that depend on other answers */
  function syncConsultBranch(root, type) {
    if (!root) return;
    const show = (sel, on) => { const el = $(`[data-block="${sel}"]`, root); if (el) el.hidden = !on; };
    if (type === 'access') {
      const dev = chipValue(root, 'aDevice');
      show('pivsize', dev === 'piv' || dev === 'usgpiv');
      show('cvsize', dev === 'midline' || dev === 'picc');
    }
    if (type === 'trouble') {
      const dev = chipValue(root, 'tDevice');
      show('midwarn', dev === 'midline');
      show('hdwarn', dev === 'apheresis');
      show('thrombwarn', (($('#tThrombus', root) || {}).checked));
      show('removal', (($('#rmDone', root) || {}).checked));
    }
    if (type === 'clearing') {
      show('outsidewarn', chipValue(root, 'clOrigin') === 'outside');
    }
    if (type === 'deaccess') {
      const modeBtn = $('[data-mode] button[aria-pressed="true"]', root);
      const mode = modeBtn ? modeBtn.dataset.v : 'access';
      show('accessOnly', mode === 'access');
      show('nobloodwarn', !(($('#dBlood', root) || {}).checked));
      show('removal', (($('#rmDone', root) || {}).checked));
    }
  }

  /* ---------------- MET / code form ---------------- */
  function openMet(existing) {

  function requireShift() {
    if (S.current) return true;
    openSheet({
      title: 'Start a shift first',
      body: '<p>Entries are filed inside a shift so the counters, productivity and history stay accurate. Clock in and the log opens right up.</p>',
      confirm: 'Clock in now',
      onConfirm: () => { clockIn(); }
    });
    return false;
  }
  function putEvent(ev, isEdit) {
    const sh = S.current; if (!sh) return;
    if (isEdit) {
      const i = sh.events.findIndex(x => x.id === ev.id);
      if (i >= 0) sh.events[i] = ev;
    } else sh.events.push(ev);
    sh.events.sort((a, b) => a.at - b.at);
    save(true); toast(isEdit ? 'Updated' : 'Logged'); render();
  }
  function removeEvent(id) {
    const sh = S.current; if (!sh) return;
    sh.events = sh.events.filter(x => x.id !== id);
    save(true); toast('Deleted'); render();
  }

  /* ---------------- event rendering ---------------- */
  function eventTitle(ev) {
    if (ev.kind === 'check') return 'Check' + (ev.changed ? ' + dressing change' : '');
    if (ev.kind === 'met') return ev.mtype || 'MET / code';
    const t = VW.consult.types.find(x => x.id === ev.ctype);
    const d = VW.opts.devices.find(x => x.id === ev.device);
    let label = t ? t.label : 'Consult';
    if (ev.ctype === 'deaccess' && ev.deaccess) label = ev.deaccess.mode === 'deaccess' ? 'De-access' : 'Access port';
    return label + (d ? ' · ' + d.label : '');
  }

  function eventDetail(ev) {
    const bits = [];
    if (ev.room) bits.push(ev.room);
    if (ev.kind === 'consult') {
      const a = ev.access, t = ev.trouble, c = ev.clearing, d = ev.deaccess, dr = ev.dressing;
      if (a) {
        const seg = [];
        if (a.gauge) seg.push(a.gauge + ' G');
        if (a.length) seg.push(a.length + '"');
        if (a.fr) seg.push(a.fr);
        if (a.lumens) seg.push(a.lumens + ' lumen');
        if (a.side) seg.push(a.side);
        if (a.site) seg.push(a.site);
        if (a.us) seg.push('US');
        if (a.dressing) seg.push(a.dressing);
        if (a.attempts) seg.push(a.attempts + ' attempt' + (a.attempts === '1' ? '' : 's'));
        if (seg.length) bits.push(seg.join(' · '));
        const flags = [];
        if (a.unsuccessful) flags.push('unsuccessful' + (a.area ? ' (' + a.area + ')' : ''));
        if (a.secondRN) flags.push('2nd RN assessment');
        if (a.escalated) flags.push('escalated');
        if (a.notifiedMD) flags.push('MD notified');
        if (a.notifiedRN) flags.push('RN notified');
        if (flags.length) bits.push(flags.join(' · '));
      }
      if (t) {
        const seg = [];
        if (t.problem) seg.push(t.problem);
        if (t.thrombosis) seg.push('thrombosis signs');
        if (t.tpaIn) seg.push('tPA in ' + fmtClock(t.tpaIn));
        if (t.tpaOut) seg.push('out ' + fmtClock(t.tpaOut));
        if (t.dose2) seg.push('2nd dose');
        if (t.xray) seg.push('CXR');
        if (t.outcome) seg.push(t.outcome);
        if (t.removed) seg.push('removed' + (t.tipIntact ? ', tip intact' : ''));
        if (seg.length) bits.push(seg.join(' · '));
      }
      if (c) {
        const seg = [];
        if (c.origin) seg.push(c.origin === 'ours' ? 'ours' : 'not ours');
        if (c.exposure) seg.push('exp ' + c.exposure + ' cm');
        if (c.circ) seg.push('circ ' + c.circ + ' cm');
        if (c.xray) seg.push('CXR');
        if (c.tipLocation) seg.push(c.tipLocation);
        seg.push(c.cleared ? 'cleared' : 'not cleared');
        if (c.end) seg.push('ended ' + fmtClock(c.end));
        bits.push(seg.join(' · '));
      }
      if (d) {
        const seg = [];
        if (d.needle) seg.push(d.needle);
        seg.push(d.bloodReturn ? 'blood return' : 'no blood return');
        if (d.flush) seg.push('flushed');
        if (d.draw) seg.push('blood drawn');
        if (d.removed) seg.push('removed ' + (d.removalInit || '?') + ' → ' + (d.removalLast || '?') + ' cm' + (d.tipIntact ? ', tip intact' : ''));
        bits.push(seg.join(' · '));
      }
      if (dr) {
        const seg = [];
        if (dr.type) seg.push(dr.type);
        if (dr.exposure) seg.push('exp ' + dr.exposure + ' cm');
        if (dr.circ) seg.push('circ ' + dr.circ + ' cm');
        if (dr.chg) seg.push('CHG');
        if (dr.securement) seg.push('securement changed');
        if (dr.phleb !== '' && dr.phleb != null) seg.push('phlebitis ' + dr.phleb);
        if (dr.inf !== '' && dr.inf != null) seg.push('infiltration ' + dr.inf);
        if (seg.length) bits.push(seg.join(' · '));
      }
    }
    if (ev.kind === 'check') {
      const seg = [];
      const d = VW.opts.devices.find(x => x.id === ev.device);
      if (d) seg.push(d.label);
      if (ev.side) seg.push(ev.side);
      if (ev.exposure) seg.push('exp ' + ev.exposure + ' cm');
      if (ev.circ) seg.push('circ ' + ev.circ + ' cm');
      if (ev.bloodReturn) seg.push('blood return');
      if (ev.intact) seg.push('dressing intact');
      if (ev.flushed) seg.push('flushed');
      if (seg.length) bits.push(seg.join(' · '));
    }
    if (ev.kind === 'met' && ev.access) bits.push(ev.access);
    if (ev.note) bits.push(ev.note);
    return bits.join(' — ');
  }

  function eventRow(ev, readonly) {
    return `<div class="entry kind-${ev.kind}${ev.stat ? ' is-stat' : ''}" data-event="${ev.id}" ${readonly ? 'data-readonly="1"' : ''}>

        </div>
        ${eventDetail(ev) ? `<div class="entry-detail">${esc(eventDetail(ev))}</div>` : ''}
      </div>
    </div>`;
  }

  function viewShift() {
    const sh = cur();
    const st = sh ? stats(sh) : null;
    let html = '';

    if (bannerMsg) {
      html += `<div class="banner alert">${I.drop}<div><b>${esc(bannerMsg.title)}</b><br><span class="muted">${esc(bannerMsg.body)}</span></div>
        <button class="btn btn-sm btn-ghost" data-act="dismissBanner">Got it</button></div>`;
    }

    if (!sh) {
      html += `<div class="hero">
        <div class="hero-top"><div>
          <div class="hero-label">Not clocked in</div>
          <div class="hero-time" style="font-size:30px">Off shift</div>
          <div class="hero-meta">${S.profile.name ? esc(S.profile.name) + ' · ' : ''}${fmtDateLong(dateKey())}</div>
        </div></div>
        <div class="hero-actions"><button class="btn btn-gold" data-act="clockIn">${I.shift} Clock in</button></div>
      </div>`;
      const last = S.shifts[0];
      if (last) {
        const lc = counts(last);
        html += `<div class="section-label">Last shift</div>
          <button class="list-row" data-shift="${last.id}"><div class="grow"><b>${fmtDate(last.date)}</b>
            <span>${lc.consults} consults · ${lc.checks} checks · ${fmtDur(workedMs(last))}</span></div>${I.chev}</button>`;
      }
      html += homeCalendar();
      html += `<div class="disclaimer">Veinwise supports decisions, it does not make them. Every recommendation here is checked against Lee Health policy and your own clinical judgment. No patient identifiers — use room or unit only.</div>`;
      return html;
    }

    const breaking = onBreak(sh);
    const b = breaking ? sh.breaks.find(x => !x.end) : null;
    const breakLeft = b ? (S.settings.breakMins * 60000 - (Date.now() - b.start)) : 0;
    const nextIn = sh.nextReminder ? sh.nextReminder - Date.now() : null;

    html += `<div class="hero">
      <div class="hero-top"><div style="flex:1">
        <div class="hero-label">${breaking ? 'On break' : 'On shift'}</div>
        <div class="hero-time" id="liveTimer">${fmtDurLong(workedMs(sh))}</div>
        <div class="hero-meta">In at ${fmtClock(sh.clockIn)} · ${fmtDate(sh.date)}${breakMs(sh) > 60000 ? ' · ' + fmtDur(breakMs(sh)) + ' break' : ''}</div>
      </div></div>
      <div class="hero-actions">
        <button class="btn btn-on-dark" data-act="break">${breaking ? 'End break' + (breakLeft > 0 ? ' (' + fmtDur(breakLeft) + ' left)' : '') : 'Break'}</button>
        <button class="btn btn-on-dark" data-act="clockOut">Clock out</button>
      </div>
    </div>`;

    html += `<div class="shift-cols"><div>`;

    html += bigActions(st.c);

    /* what he is on right now */
    const openNow = sh.events.filter(e => e.kind === 'consult' && e.pending)
      .sort((a, b) => (b.stat ? 1 : 0) - (a.stat ? 1 : 0) || a.started - b.started);
    html += `<div class="section-label">On now${openNow.length ? ' — ' + openNow.length : ''}</div>`;
    if (openNow.length) {
      html += openNow.map(e => openConsultCard(e, true)).join('');
      html += `<div class="btn-row" style="margin-top:2px">
        <button class="btn btn-ghost btn-sm" data-act="goConsults" style="flex:1">All consults</button>
        <button class="btn btn-ghost btn-sm" data-act="newConsult" style="flex:1">${I.plus} Start another</button>
      </div>`;
    } else {
      html += `<button class="assign-empty" data-act="newConsult">
        <span>${I.plus}</span>
        <div><b>Nothing open</b><span>Start a consult with its room and it shows here</span></div>
      </button>`;
    }

    /* the rooms still to check */
    const rs = roundStats();
    const toCheck = (S.rounds || []).filter(x => x.status !== 'done');
    if (rs.total) {
      html += `<div class="section-label">Rooms to check — ${rs.done} of ${rs.total}</div>`;
      if (toCheck.length) {
        const pct = rs.total ? Math.round((rs.done / rs.total) * 100) : 0;
        html += `<div class="meter-track" style="margin-bottom:11px"><div class="meter-fill ${pct === 100 ? 'good' : ''}" style="width:${pct}%"></div></div>`;
        html += `<div class="todo-grid">` + toCheck.slice(0, 8).map(it => {
          const dev = VW.opts.devices.find(d => d.id === it.device);
          return `<div class="todo-room">
            <button class="tr-head" data-act="goRounds">
              <span class="tr-no">${esc(it.room)}</span>
              <span class="tr-dev">${esc(dev ? dev.label : 'tap to set')}</span>
              ${it.due === 'change' ? '<span class="badge badge-gold tr-badge">change due</span>' : ''}
            </button>
            <div class="tr-act">
              <button class="btn btn-sm btn-primary" data-act="doneRound" data-id="${it.id}">Checked</button>
              <button class="btn btn-sm btn-gold" data-act="changedRound" data-id="${it.id}">Changed</button>
            </div>
          </div>`;
        }).join('') + `</div>`;
        if (toCheck.length > 8) {
          html += `<button class="btn btn-ghost btn-block btn-sm" data-act="goRounds" style="margin-top:9px">
            ${toCheck.length - 8} more on the list</button>`;
        }
      } else {
        html += `<div class="empty"><b>List clear</b>All ${rs.total} rooms done${rs.changed ? ', ' + rs.changed + ' dressing' + (rs.changed === 1 ? '' : 's') + ' changed' : ''}.</div>`;
      }
    } else {
      html += `<div class="section-label">Rooms to check</div>
        <button class="assign-empty" data-act="pasteRounds">
          <span>${I.plus}</span>
          <div><b>No list yet</b><span>Paste the rooms you were handed at the start of the shift</span></div>
        </button>`;
    }

    /* productivity */
    const pctOfMax = Math.min(100, (st.c.consults / st.st.consultMax) * 100);
    const bandL = (st.st.consultMin / st.st.consultMax) * 100;
    html += `<div class="card" style="margin-top:12px">
      <div class="card-head"><h3>Productivity</h3><span class="muted">${st.index != null ? st.index + '% of pace' : 'building…'}</span></div>
      <div class="meter">
        <div class="meter-track">
          <div class="meter-band" style="left:${bandL}%;right:0"></div>
          <div class="meter-fill ${st.status === 'good' ? 'good' : st.status === 'bad' ? 'low' : ''}" style="width:${pctOfMax}%"></div>
        </div>
        <div class="meter-scale"><span>0</span><span>${st.st.consultMin} min</span><span>${st.st.consultMax} target</span></div>
      </div>
      <div class="status-line"><span class="dot ${st.status === 'good' ? 'good' : st.status === 'bad' ? 'bad' : 'warn'}"></span>
        <b>${esc(st.label)}</b>
        <span class="muted" style="margin-left:auto">${st.projected != null ? 'projected ' + Math.round(st.projected) : ''}</span>
      </div>
      <div class="grid grid-2" style="margin-top:12px">
        <div class="card-flat" style="padding:11px">
          <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:600">Pace</div>
          <div class="tnum" style="font-size:18px;font-weight:600">${st.pace != null ? st.pace.toFixed(1) : '—'}<span class="muted" style="font-size:12px;font-weight:400"> /hr</span></div>
        </div>
        <div class="card-flat" style="padding:11px">
          <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:600">To hit ${st.st.consultMin}</div>
          <div class="tnum" style="font-size:18px;font-weight:600">${st.needed === 0 ? 'Met' : st.needed + ' more'}${st.needed > 0 && st.neededRate != null ? `<span class="muted" style="font-size:12px;font-weight:400"> · ${st.neededRate.toFixed(1)}/hr</span>` : ''}</div>
        </div>
      </div>
      <div class="help">Checks ${st.c.checks} of ${st.st.checkMin}–${st.st.checkMax} · ${st.c.stats} STAT · ${fmtDur(st.remaining * 3600000)} left of a ${st.st.shiftHours} h shift</div>
    </div>`;

    html += `</div><div>`;

    html += homeCalendar();

    /* hydration */
    html += `<div class="card">
      <div class="card-head"><h3>Hydrate &amp; break</h3><span class="muted">every ${Math.round(S.settings.reminderMins / 60)} h</span></div>
      <div class="split">
        <div class="grow"><div class="tnum" style="font-size:22px;font-weight:600;font-family:var(--font-display)">${nextIn != null && nextIn > 0 ? fmtDur(nextIn) : 'due now'}</div>
        <div class="muted" style="font-size:12.5px">until the next reminder</div></div>
        ${S.settings.notify ? `<span class="badge badge-good">${I.bell} On</span>` : `<button class="btn btn-sm btn-ghost" data-act="enableNotify">Turn on alerts</button>`}
      </div>
    </div>`;

    /* recent */
    const recent = sh.events.filter(x => !x.pending).sort((a, b) => b.at - a.at).slice(0, 5);
    html += `<div class="section-label">Recent</div>`;
    html += recent.length ? recent.map(e => eventRow(e)).join('') :
      `<div class="empty"><b>Nothing logged yet</b>Tap a + above, or use the Log tab.</div>`;
    html += `</div></div>`;
    return html;
  }


  /* the month, on the home page */
  function homeCalendar() {
    const today = dateKey();
    const up = S.schedule.filter(x => x.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    const next = up[0];
    return `<div class="section-label">Calendar</div>
      <div class="card">
        ${calGrid({ compact: true })}
        ${next ? `<div class="cal-next">
          <div class="grow"><b>${esc(next.type || 'Shift')} · ${fmtDate(next.date)}</b>
            <span>${next.start ? next.start + '\u2013' + next.end : ''}${next.facility ? ' · ' + esc(next.facility) : ''}${preShiftLine(next)}</span></div>
        </div>` : `<div class="cal-next"><div class="grow muted" style="font-size:13.5px">Nothing scheduled ahead</div></div>`}
        <div class="btn-row" style="margin-top:11px">
          <button class="btn btn-ghost btn-sm" data-act="goCal" style="flex:1">Open calendar</button>
          <button class="btn btn-ghost btn-sm" data-act="goCalMulti" style="flex:1">Add several days</button>
        </div>
      </div>`;
  }

  /* how long until a scheduled shift, in words */
  function preShiftLine(sch) {
    const ts = schedStart(sch);
    if (!ts) return '';
    const d = ts - Date.now();
    if (d < 0) return '';
    if (d < 3600000) return ' · starts in ' + Math.max(1, Math.round(d / 60000)) + ' min';
    if (d < 86400000) return ' · starts in ' + Math.round(d / 3600000) + ' h';
    return '';
  }

  /* the wall-clock moment a scheduled shift begins */
  function schedStart(sch) {
    if (!sch || !sch.date || !sch.start) return null;
    const ts = timeToTs(sch.date, sch.start);
    return isNaN(ts) ? null : ts;
  }

  function upcomingBlock() {
    const today = dateKey();
    const up = S.schedule.filter(s => s.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
    if (!up.length) return '';
    return `<div class="section-label">Scheduled</div>` + up.map(s =>
      `<button class="list-row" data-act="goCal"><div class="grow"><b>${fmtDate(s.date)}</b>
        <span>${esc(s.type || 'Shift')}${s.start ? ' · ' + s.start + '–' + s.end : ''}${s.facility ? ' · ' + esc(s.facility) : ''}</span></div>${I.chev}</button>`).join('');
  }

  /* ---------------- rounds: the start-of-shift worklist ---------------- */
  /* checks only cover these — no PIV, no IO */
  const CHECK_DEVICES = ['midline', 'picc', 'cvc', 'port', 'apheresis'];
  const CHECK_FIELDS = [
    { k: 'intact',      l: 'Dressing intact' },
    { k: 'bloodReturn', l: 'Blood return' },
    { k: 'flushed',     l: 'Flushed' },
    { k: 'secure',      l: 'Securement intact' },
    { k: 'chg',         l: 'CHG disc / gel in place' },
    { k: 'siteClean',   l: 'Site clean and dry' }
  ];

  const ROUND_DEVICES = [
    { re: /\bpicc\b/i,                         id: 'picc' },
    { re: /\bmidlines?\b|\bml\b/i,             id: 'midline' },
    { re: /\bcvc\b|central|\btlc\b|\bijc?\b/i, id: 'cvc' },
    { re: /\bports?\b|\bivad\b|power ?port/i,  id: 'port' },
    { re: /dialysis|\bhd\b|trialysis|apheresis|crrt|perma/i, id: 'apheresis' }
  ];

  function parseRounds(text) {
    const out = [];
    String(text || '').split(/\r?\n/).forEach(raw => {
      let line = raw.replace(/[,;|\t]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!line) return;
      const m = line.match(/^(\S+)\s*(.*)$/);
      if (!m) return;
      const room = m[1];
      const rest = m[2] || '';
      let device = null, matched = null;
      for (const d of ROUND_DEVICES) { if (d.re.test(line)) { device = d.id; matched = d.re; break; } }
      const dueRe = /\bchange[ds]?\b|\bchg\b|\breplace[ds]?\b|\bdue\b/i;
      const due = dueRe.test(rest) ? 'change' : 'check';
      // the detail line should carry what the device badge and the due badge do not
      let note = rest;
      if (matched) note = note.replace(new RegExp(matched.source, 'gi'), ' ');
      note = note.replace(new RegExp(dueRe.source, 'gi'), ' ').replace(/\s+/g, ' ').trim();
      out.push({
        id: uid(), room: room, device: device, due: due,
        note: note, status: 'pending', changed: false, at: null
      });
    });
    return out;
  }

  function roundStats() {
    const r = S.rounds || [];
    const done = r.filter(x => x.status === 'done').length;
    return { total: r.length, done, left: r.length - done, changed: r.filter(x => x.changed).length };
  }

  function harvestRoundCard(id) {
    const item = (S.rounds || []).find(x => x.id === id);
    if (!item) return;
    const card = $(`.round-card[data-round="${id}"]`);
    if (!card) return;
    const dv = chipValue(card, 'rcDev_' + id);
    if (dv) item.device = dv;
    const exp = $('#rcExp_' + id, card), circ = $('#rcCirc_' + id, card), note = $('#rcNote_' + id, card);
    if (exp) item.exposure = exp.value || '';
    if (circ) item.circ = circ.value || '';
    if (note) item.note = note.value || '';
    item.fields = item.fields || {};
    CHECK_FIELDS.forEach(f => {
      const cb = $('#rcF_' + id + '_' + f.k, card);
      if (cb) item.fields[f.k] = cb.checked;
    });
  }

  function completeRound(id, changed) {
    harvestRoundCard(id);
    const item = (S.rounds || []).find(x => x.id === id);
    if (!item) return;
    item.status = 'done';
    item.changed = !!changed;
    item.at = Date.now();
    /* stay open on the measurement block so exposed / circumference can go in now */
    roundOpen = item.id;
    // file it in the shift so the counters and productivity move with it
    const sh = cur();
    if (sh) {
      const ev = {
        id: uid(), kind: 'check', at: item.at,
        room: item.room, device: item.device || 'other', side: null,
        exposure: item.exposure || '', circ: item.circ || '',
        checked: true, changed: !!changed,
        intact: !!(item.fields || {}).intact,
        bloodReturn: !!(item.fields || {}).bloodReturn,
        flushed: !!(item.fields || {}).flushed,
        note: item.note || '', fromRounds: true
      };
      sh.events.push(ev);
      sh.events.sort((a, b) => a.at - b.at);
      item.eventId = ev.id;
      toast(changed ? 'Changed and logged' : 'Checked and logged');
    } else {
      toast(changed ? 'Marked changed' : 'Marked checked — clock in to log it');
    }
    save(true);
    /* the card that just opened carries the exposed and circumference
       fields, so make sure he is looking at it */
    if (active !== 'checks') go('checks'); else render();
  }

  function undoRound(id) {
    const item = (S.rounds || []).find(x => x.id === id);
    if (!item) return;
    const sh = cur();
    if (sh && item.eventId) sh.events = sh.events.filter(e => e.id !== item.eventId);
    item.status = 'pending'; item.changed = false; item.at = null; item.eventId = null;
    save(true); toast('Moved back to the list'); render();
  }

  function roundRow(it) {
    const dev = VW.opts.devices.find(d => d.id === it.device);
    const open = roundOpen === it.id;
    const f = it.fields || {};
    /* the measurement and assessment block — identical whether the room is
       still to do or already ticked off, so the numbers can always be entered */
    const fieldBlock = done => `<div class="field" style="margin-bottom:10px"><label class="field-label">Device</label>
        ${devChips('rcDev_' + it.id, CHECK_DEVICES, it.device || null)}</div>
      <div class="inline-2">
        <div class="field"><label for="rcExp_${it.id}">Exposed (cm)</label>
          <input type="number" step="0.1" inputmode="decimal" id="rcExp_${it.id}" value="${esc(it.exposure || '')}" placeholder="0.0"></div>
        <div class="field"><label for="rcCirc_${it.id}">Circumf. (cm)</label>
          <input type="number" step="0.1" inputmode="decimal" id="rcCirc_${it.id}" value="${esc(it.circ || '')}" placeholder="0.0"></div>
      </div>
      <div class="rc-checks">
        ${CHECK_FIELDS.map(x => `<label class="check chk-sm" data-on="${!!f[x.k]}">
          <input type="checkbox" id="rcF_${it.id}_${x.k}" ${f[x.k] ? 'checked' : ''}> ${esc(x.l)}</label>`).join('')}
      </div>
      <div class="field" style="margin-top:10px"><label for="rcNote_${it.id}">Note</label>
        <input type="text" id="rcNote_${it.id}" value="${esc(it.note || '')}" placeholder="Optional"></div>
      ${done ? `<div class="help" style="margin-top:8px">A change in exposed length on a PICC means the line is no longer cleared for use without re-confirmation (M03 10 711).</div>
        <div class="rc-actions">
          <button class="btn btn-sm btn-ghost" data-act="undoRound" data-id="${it.id}">Undo</button>
          <button class="btn btn-primary" data-act="saveRound" data-id="${it.id}">Save</button>
        </div>`
      : `<div class="rc-actions">
          <button class="btn btn-sm btn-ghost" data-act="editRound" data-id="${it.id}">Edit room</button>
          <button class="btn btn-primary" data-act="doneRound" data-id="${it.id}">Checked</button>
          <button class="btn btn-gold" data-act="changedRound" data-id="${it.id}">Changed</button>
        </div>`}`;

    if (it.status === 'done') {
      const missing = !it.exposure && !it.circ && (it.device === 'picc' || it.device === 'midline' || it.device === 'cvc');
      return `<div class="round-card is-done${open ? ' is-open' : ''}" data-round="${it.id}">
        <button class="rc-head" data-act="toggleRound" data-id="${it.id}">
          <span class="rc-room">${esc(it.room)}</span>
          <span class="rc-meta">${esc(dev ? dev.label : '')} · ${it.changed ? 'changed' : 'checked'} ${fmtClock(it.at)}${it.exposure ? ' · exp ' + esc(it.exposure) : ''}${it.circ ? ' · circ ' + esc(it.circ) : ''}</span>
          ${missing ? '<span class="badge badge-gold rc-badge">add cm</span>' : ''}
          <span class="rc-tick">${I.ok}</span>
        </button>
        ${open ? `<div class="rc-body">${fieldBlock(true)}</div>` : ''}
      </div>`;
    }
    return `<div class="round-card${open ? ' is-open' : ''}" data-round="${it.id}">
      <button class="rc-head" data-act="toggleRound" data-id="${it.id}">
        <span class="rc-room">${esc(it.room)}</span>
        <span class="rc-meta">${esc(dev ? dev.label : 'tap to set device')}${it.note ? ' · ' + esc(it.note) : ''}</span>
        ${it.due === 'change' ? '<span class="badge badge-gold rc-badge">change due</span>' : ''}
        <span class="rc-caret">${I.chev}</span>
      </button>
      ${open ? `<div class="rc-body">${fieldBlock(false)}</div>`
      : `<div class="rc-quick">
        <button class="btn btn-sm btn-primary" data-act="doneRound" data-id="${it.id}">Checked</button>
        <button class="btn btn-sm btn-gold" data-act="changedRound" data-id="${it.id}">Changed</button>
      </div>`}
    </div>`;
  }



  function openRoundsPaste() {
    openSheet({
      title: 'Paste your list',
      body: `<div class="field"><label for="roundPaste">One room per line</label>
        <textarea id="roundPaste" style="min-height:210px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px"
          placeholder="4W-12 PICC change&#10;3E-07 midline&#10;ICU-3 CVC dressing change&#10;5W-22 port"></textarea></div>
        <div class="help">Room first, then the device and anything else. Veinwise picks up PICC, midline, CVC, port, dialysis, PIV and IO, and flags the line if it says change or due.</div>`,
      confirm: 'Add to list',
      onConfirm: () => {
        const root = $('.sheet', sheetStack[sheetStack.length - 1]);
        const items = parseRounds(($('#roundPaste', root) || {}).value || '');
        if (!items.length) { toast('Nothing to add'); return false; }
        S.rounds = (S.rounds || []).concat(items);
        save(true); toast(items.length + ' room' + (items.length === 1 ? '' : 's') + ' added'); render();
      }
    });
  }

  function openRoundEditor(existing) {
    const it = existing || {};
    openSheet({
      title: existing ? 'Edit room' : 'Add a room',
      body: `<div class="field"><label for="rRoom">Room / unit</label>
          <input type="text" id="rRoom" value="${esc(it.room || '')}" placeholder="4W-12"></div>
        <div class="field"><label class="field-label">Device</label>
          ${devChips('rDevice', CHECK_DEVICES, it.device || null)}</div>
        <div class="field"><label class="field-label">What is due</label>
          ${chipGroup('rDue', [{ v: 'check', l: 'Check' }, { v: 'change', l: 'Change due' }], it.due || 'check', false)}</div>
        <div class="field"><label for="rNote">Note</label>
          <input type="text" id="rNote" value="${esc(it.note || '')}" placeholder="Optional"></div>`,
      confirm: existing ? 'Save' : 'Add',
      danger: existing ? 'Remove' : null,
      onDanger: () => { S.rounds = S.rounds.filter(x => x.id !== existing.id); save(true); toast('Removed'); render(); },
      onConfirm: () => {
        const root = $('.sheet', sheetStack[sheetStack.length - 1]);
        const room = (($('#rRoom', root) || {}).value || '').trim();
        if (!room) { toast('Room is required'); return false; }
        const rec = {
          id: existing ? existing.id : uid(), room: room,
          device: chipValue(root, 'rDevice'), due: chipValue(root, 'rDue') || 'check',
          note: ($('#rNote', root) || {}).value || '',
          status: existing ? existing.status : 'pending',
          changed: existing ? existing.changed : false,
          at: existing ? existing.at : null,
          eventId: existing ? existing.eventId : null
        };
        if (existing) { const i = S.rounds.findIndex(x => x.id === existing.id); if (i >= 0) S.rounds[i] = rec; }
        else S.rounds.push(rec);
        save(true); toast('Saved'); render();
      }
    });
  }


  /* ---------------- Consults tab ---------------- */
  function viewConsults() {
    const sh = cur();
    const all = sh ? sh.events.filter(e => e.kind === 'consult') : [];
    const open = all.filter(e => e.pending)
      .sort((a, b) => (b.stat ? 1 : 0) - (a.stat ? 1 : 0) || a.started - b.started);
    const list = all.filter(e => !e.pending).sort((a, b) => b.at - a.at);
    const c = sh ? counts(sh) : { consults: 0, stats: 0, unsuccessful: 0 };
    let html = `<h1 class="view-title">Consults</h1>
      <div class="view-sub">${sh ? fmtDateLong(sh.date) : 'Not clocked in'}</div>`;

    html += `<button class="btn btn-primary btn-block" data-act="newConsult" style="min-height:66px;font-size:18px">
      ${I.plus} New consult</button>`;

    if (sh) {
      html += `<div class="chips" style="margin-top:14px">
        <span class="chip chip-sm">${c.consults} today</span>
        ${c.stats ? `<span class="chip chip-sm">${c.stats} STAT</span>` : ''}
        ${c.unsuccessful ? `<span class="chip chip-sm">${c.unsuccessful} unsuccessful</span>` : ''}
      </div>`;
    }

    if (open.length) {
      html += `<div class="section-label">Open — tick when you finish</div>`;
      html += open.map(openConsultCard).join('');
    }

    html += `<div class="section-label">Logged this shift</div>`;
    if (!sh) {
      html += `<div class="empty"><b>Not clocked in</b>Clock in and your consults are counted toward the shift.</div>
        <button class="btn btn-ghost btn-block" data-act="clockIn" style="margin-top:11px">Clock in</button>`;
    } else if (!list.length) {
      html += `<div class="empty"><b>Nothing logged yet</b>Tap New consult, pick the type, and it sits above until you tick it off. The details are asked for then, not before.</div>`;
    } else {
      html += list.map(e => eventRow(e)).join('');
    }
    return html;
  }

  /* an open consult: the type is banked, the clock is running, details come after the tick */
  function openConsultCard(ev, compact) {
    const t = VW.consult.types.find(x => x.id === ev.ctype);
    const mins = Math.max(0, Math.round((Date.now() - (ev.started || ev.at)) / 60000));
    const since = `${fmtClock(ev.started || ev.at)}${mins ? ' · ' + mins + ' min' : ' · just now'}`;
    return `<div class="open-consult${ev.stat ? ' is-stat' : ''}${compact ? ' is-compact' : ''}" data-open-consult="${ev.id}">
      <div class="oc-top">
        <span class="oc-ico">${I[(t && t.icon) || 'consult'] || I.consult}</span>
        <div class="grow" style="min-width:0">
          <div class="oc-name">${ev.room ? esc(ev.room) : '<span class="oc-noroom">No room</span>'}${ev.stat ? ' <span class="badge badge-stat">STAT</span>' : ''}</div>
          <div class="oc-since">${esc(t ? t.label : 'Consult')} · ${since}</div>
        </div>
      </div>
      <button class="oc-done" data-act="finishConsult" data-id="${ev.id}">
        <span class="oc-box">${I.ok}</span>
        <span>Done — stamp the time</span>
      </button>
      ${compact
        ? (ev.room ? '' : `<div class="oc-drop"><button data-act="editOpenRoom" data-id="${ev.id}">Add room</button></div>`)
        : `<div class="oc-drop">
        <button data-act="editOpenRoom" data-id="${ev.id}">${ev.room ? 'Change room' : 'Add room'}</button>
        <button data-act="toggleOpenStat" data-id="${ev.id}">${ev.stat ? 'Not STAT' : 'Mark STAT'}</button>
        <button data-act="dropConsult" data-id="${ev.id}">Discard</button>
      </div>`}
    </div>`;
  }

  function editOpenRoom(id) {
    const sh = cur(); if (!sh) return;
    const ev = sh.events.find(x => x.id === id); if (!ev) return;
    openSheet({
      title: 'Room',
      body: `<div class="field"><label for="orRoom">Room / unit</label>
        <input type="text" id="orRoom" value="${esc(ev.room || '')}" placeholder="e.g. 4W-12" autocapitalize="characters"></div>`,
      confirm: 'Save',
      onConfirm: () => {
        const root = $('.sheet', sheetStack[sheetStack.length - 1]);
        ev.room = (($('#orRoom', root) || {}).value || '').trim();
        save(true); render();
      }
    });
  }

  /* ---------------- Terms tab: the medical dictionary ---------------- */
  function viewTerms() {
    const q = termQ.trim();
    let list = VW.termSearch(q);
    if (termCat) list = list.filter(x => x.cat === termCat);

    let html = `<h1 class="view-title">Terms</h1>
      <div class="view-sub">${VW.terms.length} terms from vascular access and infusion practice</div>`;

    html += `<div class="searchbar searchbar-lg">${I.search}
      <input type="search" id="termSearch" placeholder="Search a word, e.g. vesicant or CVR"
        value="${esc(termQ)}" autocomplete="off" autocorrect="off" spellcheck="false">
      ${q ? `<button class="sb-clear" data-act="termClear" aria-label="Clear">${I.close || '&times;'}</button>` : ''}
    </div>`;

    html += `<div class="term-cats swipe-off">
      <button class="chip chip-sm" data-act="termCat" data-v="" aria-pressed="${!termCat}">All</button>
      ${VW.termCats().map(c => `<button class="chip chip-sm" data-act="termCat" data-v="${esc(c)}" aria-pressed="${termCat === c}">${esc(c)}</button>`).join('')}
    </div>`;

    if (!list.length) {
      html += `<div class="empty" style="margin-top:16px"><b>Nothing matches "${esc(q)}"</b>
        Search the word itself, an abbreviation like CVR or CLABSI, or a phrase from a definition.</div>`;
      return html;
    }

    html += `<div class="muted" style="font-size:13px;margin:14px 0 10px">
      ${list.length} ${list.length === 1 ? 'term' : 'terms'}${termCat ? ' in ' + esc(termCat) : ''}${q ? ' matching "' + esc(q) + '"' : ''}</div>`;

    /* alphabetical grouping only when nothing is being searched */
    if (!q) {
      const sorted = list.slice().sort((a, b) => a.t.localeCompare(b.t));
      let letter = '';
      sorted.forEach(x => {
        const L = x.t[0].toUpperCase();
        if (L !== letter) { letter = L; html += `<div class="term-letter">${esc(letter)}</div>`; }
        html += termCard(x);
      });
    } else {
      html += list.map(termCard).join('');
    }
    return html;
  }

  function viewCompat() {

    const res = VW.compatCheck(compatSel);

    html += `<div class="callout warn" style="margin-top:0">${I.warn}<div><b>This never says yes.</b>

    html += `<div class="card">
      <div class="field-label">Selected — ${compatSel.length}</div>`;

      html += `<div class="chips">` + compatSel.map(n =>

    }
    html += `</div>`;

    if (compatSel.length >= 2) {
      const bad = res.pairs.filter(x => x.bad);
      const unknown = res.pairs.filter(x => !x.bad);
      html += `<div class="section-label">Result</div>`;
      if (bad.length) {
        html += bad.map(x => `<div class="compat-row bad">

          <p>${esc(x.why)}</p></div>`).join('');
      }
      if (unknown.length) {
        html += unknown.map(x => `<div class="compat-row unknown">
          <div class="c-head">${I.warn}<b>${esc(x.a)} + ${esc(x.b)}</b><span class="badge">not established</span></div>
          <p>Not in this app's documented list. That is not the same as compatible — confirm with pharmacy or the compatibility chart before running them together.</p></div>`).join('');
      }

        html += `<div class="section-label">Run-alone drugs in your selection</div>`;

    if (v) {
      html += `<div class="vein-card">

    html += `<div class="disclaimer">There is no anatomical diagram here on purpose. The drawings that were here were not accurate enough for clinical use and have been removed. A properly licensed anatomy image can be dropped in — ask for it.</div>`;

  function deviceFigure() { return ''; }

  function refDevices() {

    html += `<div class="searchbar">${I.search}<input type="search" id="devSearch" placeholder="Search devices" value="${esc(search.dev)}"></div>`;

  function vesselChip(kind, val) {
    const map = {
      piv: { yes: ['yes', 'PIV ok'], caution: ['caution', 'PIV caution'], no: ['no', 'PIV not appropriate'] },
      mid: { yes: ['yes', 'Midline ok'], caution: ['caution', 'Midline caution'], no: ['no', 'Midline no'] },
      cvc: { ok: ['yes', 'CVC ok'], preferred: ['caution', 'Central preferred'], required: ['no', 'Central required'], no: ['no', 'Not IV'] }
    };
    const m = map[kind] && map[kind][val]; if (!m) return '';
    return `<span class="vessel ${m[0]}">${esc(m[1])}</span>`;
  }
  function refMeds() {

  function runAlgo(root) {
    const a = {};
    VW.algoQuestions.forEach(q => { a[q.id] = chipValue(root, 'algo_' + q.id); });
    algoAnswers = a;
    const dur = a.duration, inf = a.infusate || [], veins = a.veins, f = a.factors || [], x = a.extras || [];
    const central = ['vesicant', 'pressor', 'tpn', 'ph', 'osm', 'chemo'].filter(k => inf.includes(k));
    const reasons = [];
    let device = '', subline = '', piv = '';
    const srcs = ['Lee Health M03 10 448', 'M03 10 605', 'M03 10 711', 'M03 10 299'];

    if (x.includes('emergent') && veins === 'none') {
      device = 'Intraosseous (IO)';
      subline = 'Emergent bridge while definitive access is arranged';
      reasons.push({ t: 'warn', text: 'No peripheral targets and delay would postpone lifesaving treatment — IO is indicated per M03 10 432.' });
      reasons.push({ t: 'stop', text: 'IO may not be used for radiologic contrast, and no MRI while it is in place. Remove within 24 h in adults, as soon as alternative access is obtained.' });
      reasons.push({ t: 'ok', text: 'Saline flush only — no heparin, no sodium citrate. Pressure bag at 300 mmHg for adults.' });
      algoResult = { device, sub: subline, reasons, piv: '', src: 'Lee Health M03 10 432 Intraosseous Needle Insertion, Care and Removal' };
      return;
    }

    if (central.length) {
      const names = { vesicant: 'continuous vesicant', pressor: 'vasopressor', tpn: 'TPN', ph: 'pH outside 5–9', osm: 'osmolarity over 900 mOsm/L', chemo: 'chemotherapy' };
      reasons.push({ t: 'stop', text: 'Infusate requires central access: ' + central.map(k => names[k]).join(', ') + '. Midlines are excluded for continuous vesicants, parenteral nutrition and extremes of pH or osmolarity (M03 10 605).' });
      if (dur === 'lt5' && inf.includes('pressor')) {
        device = 'CVC (or PICC)';
        subline = 'Short course of central-only therapy';
        reasons.push({ t: 'warn', text: 'Short expected duration with a vasopressor — a non-tunneled CVC is often faster; PICC if the course extends or the patient is stable enough to wait.' });
      } else if (inf.includes('chemo') && (dur === 'gt14' || dur === 'unk')) {
        device = 'Port (IVAD) or PICC';
        subline = 'Episodic or prolonged chemotherapy';
        reasons.push({ t: 'ok', text: 'Episodic chemotherapy is a PICC indication; a port suits repeated cycles over months. PowerPort supports contrast at 5 mL/s with a PowerLoc set.' });
      } else {
        device = 'PICC';
        subline = 'Central access for a therapy peripheral vessels cannot take';
        reasons.push({ t: 'ok', text: 'Continuous TPN, electrolytes or vesicants such as vasopressors are listed PICC inclusion criteria (M03 10 711 Appendix A).' });
      }
    } else if (dur === 'gt14' || dur === 'unk' || x.includes('discharge')) {
      device = 'PICC';
      subline = 'Long-term or discharge-continuing therapy';
      reasons.push({ t: 'ok', text: 'Therapy beyond 14 days, indefinite duration, or a discharge plan that continues IV therapy — PICC inclusion criteria.' });
      if (dur === '5to14') reasons.push({ t: 'warn', text: 'If the discharge plan resolves and therapy stays peripherally compatible, reassess for a midline instead.' });
    } else if (dur === '5to14') {
      device = 'Midline';
      subline = 'Peripherally compatible therapy, roughly 5–30 days of dwell';
      reasons.push({ t: 'ok', text: 'Duration fits midline dwell (typically 5–30 days per IFU) and the infusate is peripherally compatible.' });
      if (inf.includes('contrast')) reasons.push({ t: 'warn', text: 'Power injection requires a power-approved midline per IFU. Non-power midlines are NOT indicated for contrast media.' });
    } else {
      if (veins === 'diva') {
        device = 'Ultrasound-guided PIV';
        subline = 'Short-course therapy with difficult access';
        piv = '20 G for general therapy, 22 G for fragile veins. Long 1.88" catheter for deeper vessels; keep catheter-to-vein ratio at or under 45%.';
        reasons.push({ t: 'ok', text: 'Ultrasound guidance is recommended for difficult access or after failed traditional attempts, by competency-validated staff (M03 10 448).' });
      } else if (veins === 'none') {
        device = 'Midline or PICC';
        subline = 'No peripheral targets even with ultrasound';
        reasons.push({ t: 'warn', text: 'History of failed or difficult peripheral access, once ultrasound guidance has failed, is a PICC inclusion criterion.' });
      } else {
        device = 'Peripheral IV';
        subline = 'Short-course, peripherally compatible therapy';
        piv = '20 G covers most adult therapy and CT contrast. 22 G for fragile or small veins, 24 G for very fragile. 18 G for rapid transfusion or trauma. Standard 1.0–1.1"; 1.88" only for deep US-guided vessels.';
        reasons.push({ t: 'ok', text: 'Under 5 days with compatible infusate — start most distal in the upper extremity and use the smallest catheter that delivers the therapy.' });
        reasons.push({ t: 'warn', text: 'Avoid routine antecubital fossa placement; max dwell 29 days; remove when the plan of care no longer needs it.' });
      }
    }

    if (inf.includes('contrast') && device.indexOf('PIV') >= 0) {
      reasons.push({ t: 'warn', text: 'Power injection of contrast needs a gauge and site rated for the flow rate — commonly 20 G or larger in a forearm or AC vessel.' });
    }
    if (inf.includes('blood')) reasons.push({ t: 'warn', text: 'Blood products: infiltration of any amount grades 4+ on the infiltration scale. Larger gauge supports faster administration.' });
    if (x.includes('draws')) reasons.push({ t: 'warn', text: 'Frequent blood draws favor a central device. Dialysis, apheresis and CRRT catheters may not be used for routine draws (M03 10 357).' });
    if (x.includes('hemo')) reasons.push({ t: 'ok', text: 'Invasive hemodynamic monitoring is a listed central access indication.' });
    if (x.includes('unstable')) reasons.push({ t: 'ok', text: 'Clinical instability or a complex infusion regimen supports CVAD placement (M03 10 711 Appendix A #2).' });

    const exMap = {
      ckd: 'CKD or AKI-on-CKD requiring vein preservation — nephrology clearance is required before a midline or PICC. Consider a small-gauge distal PIV or a tunneled dialysis-compatible plan.',
      fistula: 'Ipsilateral fistula, graft or vascular implant — use the contralateral arm.',
      mastect: 'Mastectomy with axillary node dissection — excluded on that side; use the contralateral arm.',
      lymph: 'Lymphedema — excluded for midline and PICC on that side.',
      dvt: 'Documented unresolved DVT — excluded for midline and PICC.',
      cva: 'Paralysis, hemiparesis, traumatic injury or CVA-affected limb — avoid that extremity when possible.',
      pacer: 'Pacemaker under 6 months, or ipsilateral pacemaker over 6 months — refer to Interventional Radiology.',
      svc: 'SVC filter in place — refer to Interventional Radiology for fluoroscopy.',
      bact: 'Current bacteremia — a physician order is required before PICC placement.',
      skin: 'Upper-arm skin breakdown, edema, infection, cellulitis or thrombophlebitis — excluded on that arm.',
      sedation: 'Patient requires sedation for the procedure — refer to Interventional Radiology.'
    };
    f.filter(k => k !== 'none').forEach(k => { if (exMap[k]) reasons.push({ t: 'stop', text: exMap[k] }); });
    if (veins === 'diva' || f.includes('ckd')) {
      reasons.push({ t: 'warn', text: 'Ultrasound assessment: if the catheter-to-vein ratio exceeds 45%, the vessel is too small — pick another target.' });
    }
    if (device.indexOf('PICC') >= 0 || device.indexOf('Midline') >= 0) {
      reasons.push({ t: 'ok', text: 'Place the limb alert armband clasp, and for a PICC confirm the tip by ECG-based TCS or chest x-ray before therapy starts.' });
    }

    algoResult = {
      device, sub: subline, reasons, piv,
      src: 'Decision support built from ' + srcs.join(' · ') + '. Confirm against the current policy and your assessment.'
    };
  }

  /* ---------------- policy PDFs ---------------- */
  /* metadata only, so a render never waits on IndexedDB */
  let pdfOverrides = {};
  function loadPdfIndex() {
    if (!VW.pdfs.available()) return;
    VW.pdfs.list().then(rows => {
      const map = {};
      rows.forEach(r => { map[r.id] = r; });
      pdfOverrides = map;
      if (active === 'more' && sub.ref === 'policies') render();
    }).catch(() => { });
  }

  function openPdf(id) {
    const pol = VW.policies.find(p => p.id === id);
    if (!pol) return;
    const shipped = pol.pdf;
    const showBlob = blob => {
      const url = URL.createObjectURL(blob);
      const w = window.open(url, '_blank');
      if (!w) { const a = document.createElement('a'); a.href = url; a.download = (pol.num || id) + '.pdf'; a.click(); }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    };
    const attached = pdfOverrides[id];
    const step = attached
      ? VW.pdfs.get(id).then(rec => { if (rec && rec.blob) { showBlob(rec.blob); return true; } return false; })
      : Promise.resolve(false);

    step.then(done => {
      if (done || !shipped) { if (!done && !shipped) toast('No document on file'); return; }
      /* shipped copy: a plain link so Chrome uses its own PDF viewer */
      return fetch(shipped, { method: 'GET' }).then(r => {
        if (!r.ok) throw new Error('missing');
        return r.blob();
      }).then(showBlob);
    }).catch(() => {
      openSheet({
        title: 'Policy document not here',
        body: `<p>The summary above is in the app, but the PDF itself lives in the <b>policies</b> folder next to <b>index.html</b>.</p>
          <p>Two ways to read it:</p>
          <ul><li>Install Veinwise from GitHub Pages — the folder ships with it and the service worker caches it for offline.</li>
          <li>Or attach your own copy now, straight from the phone. It is stored on this device only.</li></ul>`,
        confirm: 'Attach a PDF',
        onConfirm: () => setTimeout(() => attachPdf(id), 80)
      });
    });
  }

  function attachPdf(id) {
    if (!VW.pdfs.available()) { toast('This browser cannot store documents'); return; }
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/pdf,.pdf';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      if (f.size > 25 * 1024 * 1024) { toast('That file is over 25 MB'); return; }
      VW.pdfs.put(id, f).then(() => { toast('Attached'); loadPdfIndex(); render(); })
        .catch(() => toast('Could not save that file'));
    });
    inp.click();
  }

  function dropPdf(id) {
    VW.pdfs.del(id).then(() => { delete pdfOverrides[id]; toast('Removed'); render(); }).catch(() => { });
  }

  function shiftText(sh) {
    const c = counts(sh);
    const lines = [
      'VEINWISE SHIFT — ' + fmtDateLong(sh.date),
      fmtClock(sh.clockIn) + ' – ' + (sh.clockOut ? fmtClock(sh.clockOut) : 'open') + '  (' + fmtDur(workedMs(sh)) + ' worked)',
      c.consults + ' consults · ' + c.checks + ' checks · ' + c.mets + ' MET/code · ' + c.stats + ' STAT',
      ''
    ];
    sh.events.filter(x => !x.pending).sort((a, b) => a.at - b.at).forEach(e => {
      lines.push(fmtClock(e.at) + '  ' + eventTitle(e) + (eventDetail(e) ? ' — ' + eventDetail(e) : ''));
    });
    if ((sh.notes || []).length) { lines.push('', 'NOTES'); sh.notes.forEach(n => lines.push(fmtClock(n.at) + '  ' + n.text)); }
    if (sh.summary) { lines.push('', 'HAND-OFF', sh.summary); }
    return lines.join('\n');
  }
