<script>
/* ============================================================
   Veinwise — policy document store
   Two places a policy PDF can come from:
     1. the app folder (policies/*.pdf, shipped with the build,
        cached by the service worker so it opens offline)
     2. IndexedDB, when Miguel attaches a newer revision himself
   An attached copy always wins, because policies get revised and
   the portal is the controlled document.
   ============================================================ */
VW.pdfs = (function () {
  const DB = 'veinwise-docs', STORE = 'pdf', VER = 1;
  let dbp = null;

  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no indexedDB'));
      const rq = indexedDB.open(DB, VER);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    return dbp;
  }

  function tx(mode, fn) {
    return db().then(d => new Promise((res, rej) => {
      const t = d.transaction(STORE, mode);
      const rq = fn(t.objectStore(STORE));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }

  return {
    /* save an attached file against a policy id */
    put(id, file) {
      return tx('readwrite', st => st.put({
        id: id,
        name: file.name || (id + '.pdf'),
        type: file.type || 'application/pdf',
        size: file.size || 0,
        at: Date.now(),
        blob: file
      }));
    },
    get(id) { return tx('readonly', st => st.get(id)).catch(() => null); },
    del(id) { return tx('readwrite', st => st.delete(id)); },
    /* metadata for every attached document, blob left behind */
    list() {
      return tx('readonly', st => st.getAll())
        .then(rows => (rows || []).map(r => ({ id: r.id, name: r.name, size: r.size, at: r.at })))
        .catch(() => []);
    },
    available() { return 'indexedDB' in window; }
  };
})();

</script>
<script>
/* ============================================================
   Veinwise — medical dictionary
   Terms a vascular access nurse meets on a shift: devices,
   anatomy, complications, infusion science, the measurements,
   the infection-prevention vocabulary and the abbreviations that
   turn up in orders and notes.

   Definitions are written for bedside use, not for a textbook.
   Where a term carries a number that comes from the Lee Health
   policies supplied for this project, the number is included and
   the policy is named. Everything else is standard infusion
   practice as described in INS Standards of Practice 9th ed.
   (2024), CDC/HICPAC intravascular catheter guidance, and device
   manufacturer IFUs.

   Fields
     t    term
     abbr abbreviation or alternate spelling, searchable
     cat  category, used for the filter chips
     d    definition
     n    the practical note: what it changes at the bedside
     see  related terms, rendered as taps
   ============================================================ */
VW.terms = [

  /* ---------------- Devices ---------------- */
  { t: 'Vascular access device', abbr: 'VAD', cat: 'Device',
    d: 'Any catheter placed into a blood vessel to give fluids, medication or blood, or to draw samples.',
    n: 'The umbrella term. Every PIV, midline, PICC, CVC, port and dialysis catheter is a VAD.',
    see: ['Peripheral IV', 'Central venous access device'] },

  { t: 'Peripheral IV', abbr: 'PIV, peripheral intravenous catheter, short peripheral catheter, SPC', cat: 'Device',
    d: 'A short catheter, usually 1 to 1.88 inches, sitting in a peripheral vein of the hand, forearm or upper arm. It does not reach the central circulation.',
    n: 'Maximum dwell at Lee Health is 29 days, changed when clinically indicated rather than on a schedule (M03 10 448). Every PIV needs an extension set.',
    see: ['Midline catheter', 'Ultrasound-guided PIV', 'Gauge'] },

  { t: 'Ultrasound-guided PIV', abbr: 'USGPIV, USPIV, US-guided peripheral IV', cat: 'Device',
    d: 'A peripheral IV placed with real-time ultrasound, usually into a deeper forearm or upper-arm vein that cannot be seen or felt.',
    n: 'Needs a longer catheter, generally 1.88 inch, so that enough of it sits inside the vein. Only staff who have met the competency standard may place one (M03 10 448).',
    see: ['Peripheral IV', 'Catheter-to-vein ratio', 'Ultrasound'] },

  { t: 'Midline catheter', abbr: 'midline, ML', cat: 'Device',
    d: 'A peripheral catheter 3 to 8 inches long placed in the basilic, cephalic or brachial vein of the upper arm, with the tip at or near the level of the axilla and distal to the shoulder.',
    n: 'Peripheral, not central. No continuous vesicants, no parenteral nutrition, no extremes of pH or osmolarity. A clotted midline is removed, never declotted (M03 10 605).',
    see: ['PICC', 'Vesicant', 'Osmolarity'] },

  { t: 'PICC', abbr: 'peripherally inserted central catheter', cat: 'Device',
    d: 'A central catheter inserted through a vein in the upper arm, usually the basilic, with the tip advanced to the lower superior vena cava or the cavo-atrial junction.',
    n: 'Central, so it takes vesicants, TPN and extremes of pH and osmolarity. Requires an LIP order, informed consent and the adult PICC order set before insertion (M03 10 711).',
    see: ['Cavo-atrial junction', 'Superior vena cava', 'Tip confirmation'] },

  { t: 'Central venous access device', abbr: 'CVAD, central line, CVC, central venous catheter', cat: 'Device',
    d: 'Any catheter whose tip sits in a central vein, meaning the lower superior vena cava, the cavo-atrial junction or the right atrium under fluoroscopy.',
    n: 'What makes a line central is where the tip lands, not where it went in. A PICC is central; a midline placed in the same vein is not.',
    see: ['PICC', 'Superior vena cava', 'Tunneled catheter'] },

  { t: 'Non-tunneled central catheter', abbr: 'percutaneous CVC, acute CVC', cat: 'Device',
    d: 'A central catheter that enters the skin directly over the target vein, usually internal jugular, subclavian or femoral, with no subcutaneous tunnel.',
    n: 'Short-term by design and the highest infection risk of the central devices. Femoral placement carries the highest risk of all and is avoided in adults where possible.',
    see: ['Tunneled catheter', 'CLABSI'] },

  { t: 'Tunneled catheter', abbr: 'Hickman, Broviac, Groshong, tunneled CVC', cat: 'Device',
    d: 'A central catheter threaded under the skin for several centimeters between the exit site and the point where it enters the vein, anchored by a cuff.',
    n: 'The tunnel and the cuff are both barriers to infection, which is why these are the long-term choice. The cuff takes about two weeks to grow in, so an early tunneled line still needs securement.',
    see: ['Dacron cuff', 'Implanted port', 'Non-tunneled central catheter'] },

  { t: 'Dacron cuff', abbr: 'cuff, tissue ingrowth cuff', cat: 'Device',
    d: 'A fabric collar on a tunneled catheter that sits in the subcutaneous tunnel and encourages tissue to grow into it.',
    n: 'Once ingrown it anchors the line and blocks organisms tracking up the tunnel. A cuff visible at the exit site means the catheter has migrated out.',
    see: ['Tunneled catheter', 'Migration'] },

  { t: 'Implanted port', abbr: 'port, IVAD, implanted venous access device, Port-a-Cath, PowerPort', cat: 'Device',
    d: 'A reservoir implanted in a subcutaneous pocket, usually on the upper chest, with a silicone septum on top and a catheter running from it into a central vein.',
    n: 'Nothing crosses the skin when it is not in use, which is why ports have the lowest infection risk of the central devices. Access only with a non-coring needle.',
    see: ['Non-coring needle', 'Septum', 'Power injectable'] },

  { t: 'Non-coring needle', abbr: 'Huber needle, Huber, port needle', cat: 'Device',
    d: 'A needle with a deflected tip that parts the port septum rather than punching a core out of it.',
    n: 'A standard hypodermic needle destroys the septum and shortens the life of the port. Match the needle length to the depth of the port and the thickness of the tissue over it.',
    see: ['Implanted port', 'Septum'] },

  { t: 'Septum', abbr: 'port septum', cat: 'Device',
    d: 'The compressed silicone disc on the face of an implanted port that the needle passes through and that reseals behind it.',
    n: 'Rated for a set number of punctures, typically 1000 to 2000 with a non-coring needle. Rotating the access point spreads the wear.',
    see: ['Non-coring needle', 'Implanted port'] },

  { t: 'Power injectable', abbr: 'power injection, power-rated, PowerPICC, PowerPort, PowerGlide', cat: 'Device',
    d: 'A device rated by its manufacturer to withstand the pressure of a contrast power injector, usually up to 300 psi and a stated flow rate.',
    n: 'Power rating is per device and is printed on the catheter, the hub or the port body and felt as palpable markings on a port. If you cannot confirm it, it is not power injectable.',
    see: ['Contrast media', 'Implanted port'] },

  { t: 'PowerFlow', abbr: 'PowerFlow IV port, PowerFlow midline', cat: 'Device',
    d: 'A BD implanted peripheral port accessed over the needle at roughly 30 degrees, rather than through a septum at 90 degrees.',
    n: 'The access angle and technique are not the same as a chest PowerPort. Check the BD comparison sheet before accessing one for the first time.',
    see: ['Implanted port', 'Non-coring needle'] },

  { t: 'Hemodialysis catheter', abbr: 'HD catheter, dialysis catheter, Permcath, Quinton, Vas-Cath', cat: 'Device',
    d: 'A large-bore central catheter with two or three lumens designed for the very high flow rates that dialysis, apheresis and CRRT require.',
    n: 'Reserved for the renal or apheresis team. Not used for routine infusion or blood draws unless a physician has ordered it and policy allows it (M03 10 357).',
    see: ['Apheresis', 'CRRT', 'Locking solution'] },

  { t: 'Apheresis', abbr: 'pheresis, plasmapheresis, plasma exchange, TPE', cat: 'Procedure',
    d: 'A procedure that removes whole blood, separates out one component, and returns the rest to the patient.',
    n: 'Needs a device that tolerates both the withdrawal rate and the return rate. A standard PICC usually will not; an apheresis-rated catheter or a power port with an apheresis order will.',
    see: ['Hemodialysis catheter', 'CRRT'] },

  { t: 'CRRT', abbr: 'continuous renal replacement therapy', cat: 'Procedure',
    d: 'Slow continuous dialysis run over 24 hours in the critically ill, rather than intermittent sessions.',
    n: 'Same catheter requirements as dialysis. Interrupting a CRRT circuit to borrow a lumen is a decision for the renal team, not a bedside one.',
    see: ['Hemodialysis catheter'] },

  { t: 'Intraosseous', abbr: 'IO, intraosseous access, EZ-IO', cat: 'Device',
    d: 'A needle driven through the cortex of a bone into the marrow cavity, which drains into the central circulation.',
    n: 'For emergencies when IV access cannot be obtained quickly. Everything given IV can go IO. Dwell is short, generally up to 24 hours (M03 10 432).',
    see: ['Proximal tibia', 'Humeral head'] },

  { t: 'Proximal tibia', abbr: 'tibial IO site', cat: 'Anatomy',
    d: 'The flat plateau of bone roughly two finger-widths below and one finger-width medial to the tibial tuberosity.',
    n: 'The default adult IO site: easy to find, away from the airway and the chest during a code.',
    see: ['Intraosseous', 'Humeral head'] },

  { t: 'Humeral head', abbr: 'proximal humerus, humeral IO site', cat: 'Anatomy',
    d: 'The greater tubercle of the humerus, found with the arm adducted and the hand on the abdomen.',
    n: 'Higher flow rates and less infusion pain than the tibia, but it moves. The arm has to be secured or the needle dislodges.',
    see: ['Intraosseous', 'Proximal tibia'] },

  { t: 'Lumen', abbr: 'single lumen, double lumen, triple lumen', cat: 'Device',
    d: 'A single continuous channel through a catheter. One catheter may hold one, two or three of them, each with its own hub.',
    n: 'Every extra lumen is another entry point for organisms. Use the fewest lumens the therapy actually needs, and label which one runs what.',
    see: ['Hub', 'CLABSI'] },

  { t: 'Hub', abbr: 'catheter hub', cat: 'Device',
    d: 'The connector at the external end of a catheter or lumen where tubing, syringes and needleless connectors attach.',
    n: 'The hub is the single most handled part of the system and the main route for organisms into a central line. Scrub it every time.',
    see: ['Scrub the hub', 'Needleless connector'] },

  { t: 'Needleless connector', abbr: 'NC, cap, claves, end cap, positive pressure cap', cat: 'Device',
    d: 'The valve screwed onto a catheter hub that lets a syringe or tubing connect without a needle.',
    n: 'Comes in negative, positive and neutral displacement designs, and the clamping sequence differs between them. Using the wrong sequence draws blood back into the tip.',
    see: ['Scrub the hub', 'Positive pressure'] },

  { t: 'Extension set', abbr: 'J-loop, T-connector, pigtail', cat: 'Device',
    d: 'A short length of tubing between the catheter hub and everything else.',
    n: 'Required on every PIV at Lee Health (M03 10 448). It moves the handling away from the insertion site so tugging on tubing does not move the catheter in the vein.',
    see: ['Peripheral IV', 'Securement'] },

  { t: 'Stylet', abbr: 'guidewire, introducer needle', cat: 'Device',
    d: 'The rigid inner wire or needle that gives a catheter enough stiffness to be advanced, then is withdrawn.',
    n: 'Never re-advance a stylet into a catheter that has already been pulled back. It can shear the catheter and embolize the fragment.',
    see: ['Catheter embolism', 'Seldinger technique'] },

  { t: 'Seldinger technique', abbr: 'modified Seldinger, MST', cat: 'Procedure',
    d: 'Puncture the vein with a needle, pass a guidewire through it, remove the needle, then thread the catheter over the wire.',
    n: 'The modified version adds a dilator and peel-away sheath and is how most PICCs go in. Never let go of the wire.',
    see: ['PICC', 'Stylet'] },

  /* ---------------- Anatomy ---------------- */
  { t: 'Cephalic vein', abbr: 'cephalic', cat: 'Anatomy',
    d: 'Runs up the lateral, thumb side of the forearm and upper arm, joining the axillary vein at a sharp angle below the clavicle.',
    n: 'Easy to see and cannulate, but smaller and more valved than the basilic, and that sharp final angle is where PICCs stall. Second choice for a PICC.',
    see: ['Basilic vein', 'Accessory cephalic vein'] },

  { t: 'Basilic vein', abbr: 'basilic', cat: 'Anatomy',
    d: 'Runs up the medial, little-finger side of the forearm and upper arm and becomes the axillary vein.',
    n: 'The largest and straightest route to the SVC, which is why it is the first choice for a PICC. It sits close to the brachial artery and median nerve in the upper arm, so use ultrasound.',
    see: ['Cephalic vein', 'Brachial artery', 'Median nerve'] },

  { t: 'Accessory cephalic vein', abbr: 'accessory cephalic', cat: 'Anatomy',
    d: 'A branch on the dorsal forearm that joins the cephalic vein below the elbow.',
    n: 'A good forearm PIV target: well away from joint flexion and usually straight enough for a 1.1 inch catheter.',
    see: ['Cephalic vein'] },

  { t: 'Median cubital vein', abbr: 'median cubital, AC vein', cat: 'Anatomy',
    d: 'The connecting vein crossing the antecubital fossa between the cephalic and basilic veins.',
    n: 'The phlebotomy vein. Avoid it for indwelling catheters: it lies over a joint, so flexion kinks the line and raises the phlebitis rate (M03 10 448).',
    see: ['Antecubital fossa'] },

  { t: 'Antecubital fossa', abbr: 'AC, AC fossa, antecubital', cat: 'Anatomy',
    d: 'The triangular hollow on the front of the elbow.',
    n: 'Routine indwelling use is discouraged by policy. Acceptable in an emergency or when nothing else is available, and then flagged for replacement.',
    see: ['Median cubital vein'] },

  { t: 'Median antebrachial vein', abbr: 'median antebrachial, median forearm vein', cat: 'Anatomy',
    d: 'Runs up the middle of the volar forearm into the antecubital fossa.',
    n: 'Variable, often small, and it sits over nerve-rich tissue, so cannulation here hurts more than most. Not a first choice.',
    see: ['Basilic vein'] },

  { t: 'Dorsal metacarpal veins', abbr: 'dorsal veins, hand veins, metacarpal', cat: 'Anatomy',
    d: 'The network on the back of the hand between the knuckles.',
    n: 'The most distal starting point, which is why policy sends you here first in an adult. Fragile in the elderly and uncomfortable with any irritant.',
    see: ['Peripheral IV'] },

  { t: 'Brachial vein', abbr: 'brachial veins', cat: 'Anatomy',
    d: 'Paired deep veins running either side of the brachial artery in the upper arm.',
    n: 'Usable for a midline or PICC under ultrasound, but the artery and the median nerve are right there. Third choice behind basilic and cephalic.',
    see: ['Brachial artery', 'Median nerve', 'Basilic vein'] },

  { t: 'Brachial artery', abbr: 'brachial', cat: 'Anatomy',
    d: 'The main artery of the upper arm, running medially alongside the brachial veins.',
    n: 'Pulsatile, thick-walled and non-compressible on ultrasound. Confirm which structure you are in before you advance anything.',
    see: ['Brachial vein', 'Arterial puncture'] },

  { t: 'Median nerve', abbr: 'median', cat: 'Anatomy',
    d: 'Runs with the brachial vessels through the upper arm and antecubital fossa into the forearm.',
    n: 'A honeycomb bundle on ultrasound, not a black lumen. Electric shooting pain or paresthesia during insertion means stop and withdraw.',
    see: ['Paresthesia', 'Brachial vein'] },

  { t: 'Superior vena cava', abbr: 'SVC', cat: 'Anatomy',
    d: 'The large vein returning blood from the head, neck and arms to the right atrium.',
    n: 'The target zone for a central tip. High flow here dilutes irritants and vesicants almost immediately, which is the whole point of a central line.',
    see: ['Cavo-atrial junction', 'Hemodilution'] },

  { t: 'Cavo-atrial junction', abbr: 'CAJ', cat: 'Anatomy',
    d: 'The point where the superior vena cava meets the right atrium.',
    n: 'The preferred tip position: enough flow to dilute anything, without sitting in the atrium where it can provoke arrhythmias.',
    see: ['Superior vena cava', 'Tip confirmation'] },

  { t: 'Axillary vein', abbr: 'axillary', cat: 'Anatomy',
    d: 'The continuation of the basilic vein above the lower border of the teres major, becoming the subclavian at the first rib.',
    n: 'The internal landmark for a midline tip: at or near the level of the axilla, and stopping short of the shoulder.',
    see: ['Midline catheter', 'Basilic vein'] },

  { t: 'External jugular vein', abbr: 'EJ', cat: 'Anatomy',
    d: 'A superficial vein crossing the sternocleidomastoid on the side of the neck.',
    n: 'Emergent peripheral access only. Replace within 24 to 96 hours or as soon as the patient is stable, assess every 4 hours, and VAN reviews it daily for ongoing need (M03 10 448).',
    see: ['Peripheral IV'] },

  { t: 'Tunica intima', abbr: 'intima, endothelium', cat: 'Anatomy',
    d: 'The single-cell-thick inner lining of a vein.',
    n: 'This is what a catheter rubs against, what an irritant inflames and what a clot forms on. Nearly every complication in this list starts here.',
    see: ['Phlebitis', 'Thrombosis'] },

  { t: 'Valve', abbr: 'venous valve', cat: 'Anatomy',
    d: 'A paired flap inside a vein that stops backflow.',
    n: 'A catheter stopping short with no obvious kink has often met a valve. Releasing the tourniquet, a gentle flush while advancing, or repositioning the arm usually clears it.',
    see: ['Cephalic vein'] },

  /* ---------------- Complications ---------------- */
  { t: 'Phlebitis', abbr: 'vein inflammation', cat: 'Complication',
    d: 'Inflammation of the vein wall, seen as pain, redness, warmth, swelling and sometimes a palpable cord along the vein.',
    n: 'Graded 0 to 4+ on the scale in the policies. Mechanical, chemical and infectious causes look alike, so grade it, remove the line and document the grade.',
    see: ['Post-infusion phlebitis', 'Irritant', 'Thrombophlebitis'] },

  { t: 'Post-infusion phlebitis', cat: 'Complication',
    d: 'Phlebitis appearing within 48 hours after a catheter has already been removed.',
    n: 'The reason policy asks for the smallest catheter that will do the job: a large catheter in a small vein leaves inflammation behind after it comes out.',
    see: ['Phlebitis', 'Catheter-to-vein ratio'] },

  { t: 'Thrombophlebitis', cat: 'Complication',
    d: 'Inflammation of a vein with a clot in it.',
    n: 'A palpable cord along the vein track is the classic finding. An upper-arm cord is an exclusion for placing a midline or PICC on that side.',
    see: ['Phlebitis', 'Thrombosis'] },

  { t: 'Infiltration', cat: 'Complication',
    d: 'A non-vesicant solution leaking out of the vein into the surrounding tissue.',
    n: 'Graded 0 to 5+. Cool, taut, blanched skin and a sluggish or absent blood return. Stop the infusion, remove the catheter, elevate, and document the grade and the volume.',
    see: ['Extravasation', 'Vesicant'] },

  { t: 'Extravasation', cat: 'Complication',
    d: 'A vesicant leaking out of the vein into the surrounding tissue.',
    n: 'The emergency version of infiltration. Stop, leave the catheter in and aspirate, notify the provider, and check the antidote and heat-or-cold table before you remove anything (M03 10 299).',
    see: ['Vesicant', 'Antidote', 'Infiltration'] },

  { t: 'Vesicant', cat: 'Pharmacology',
    d: 'A drug that causes blistering, tissue necrosis or sloughing if it escapes the vein.',
    n: 'Continuous vesicants need a central line. Vasopressors, anthracyclines, vinca alkaloids and concentrated electrolytes are the ones seen most often.',
    see: ['Extravasation', 'Irritant', 'Antidote'] },

  { t: 'Irritant', cat: 'Pharmacology',
    d: 'A drug that inflames the vein wall and causes pain or phlebitis along the vein without necessarily destroying tissue.',
    n: 'Peripherally tolerable in short courses, but the line will not last. A few days of an irritant is often the trigger for the consult.',
    see: ['Vesicant', 'Phlebitis'] },

  { t: 'Antidote', cat: 'Pharmacology',
    d: 'A drug given into or around the extravasation site to neutralize or disperse the agent that escaped.',
    n: 'Hyaluronidase disperses, phentolamine reverses vasoconstriction, dexrazoxane and sodium thiosulfate are agent-specific. Attachment 1 of M03 10 299 has the full table.',
    see: ['Extravasation', 'Vesicant'] },

  { t: 'Thrombosis', abbr: 'DVT, deep vein thrombosis, CRT, catheter-related thrombosis', cat: 'Complication',
    d: 'A clot forming on or around the catheter, in the vein it occupies, or both.',
    n: 'Arm swelling, a heavy aching limb, shoulder or neck discomfort, or new collateral veins on the chest wall. This is not an occlusion to be declotted, it is an imaging and provider call.',
    see: ['Fibrin sheath', 'Occlusion', 'Alteplase'] },

  { t: 'Fibrin sheath', abbr: 'fibrin tail, fibrin flap', cat: 'Complication',
    d: 'A sleeve of fibrin that forms along the outside of a catheter and can extend past the tip.',
    n: 'The classic withdrawal occlusion: flushes in fine, will not aspirate, because the sheath acts as a one-way valve over the tip.',
    see: ['Withdrawal occlusion', 'Alteplase', 'Thrombosis'] },

  { t: 'Occlusion', abbr: 'occluded, blocked line', cat: 'Complication',
    d: 'Partial or complete loss of flow through a catheter.',
    n: 'Work the causes in order: mechanical first (clamps, kinks, tight sutures, the connector), then drug precipitate or lipid residue, then thrombotic. The cause decides the fix.',
    see: ['Withdrawal occlusion', 'Precipitate', 'Alteplase'] },

  { t: 'Withdrawal occlusion', abbr: 'WOO, withdrawal occlusion of catheter', cat: 'Complication',
    d: 'The catheter infuses normally but blood cannot be aspirated.',
    n: 'Usually a fibrin sheath or the tip resting against a vein wall. Try repositioning the arm, shoulder and head first, because the free fix is often the right one.',
    see: ['Fibrin sheath', 'Blood return'] },

  { t: 'Alteplase', abbr: 'tPA, Cathflo, tissue plasminogen activator', cat: 'Pharmacology',
    d: 'A thrombolytic instilled into an occluded catheter to dissolve the clot from inside.',
    n: 'Dwells, then is withdrawn, and a second dose may be ordered if the first fails. Both the instill and the withdrawal times are documented. Midlines are not declotted.',
    see: ['Occlusion', 'Fibrin sheath', 'Midline catheter'] },

  { t: 'Precipitate', abbr: 'drug precipitate, crystallization', cat: 'Complication',
    d: 'A solid formed when two incompatible drugs meet inside a lumen, or when a drug comes out of solution.',
    n: 'Alteplase does nothing for this. The clearing agent depends on the chemistry, and the real fix is flushing properly between drugs.',
    see: ['Compatibility', 'Occlusion', 'SASH'] },

  { t: 'Air embolism', cat: 'Complication',
    d: 'Air entering the venous circulation through the catheter or a disconnected hub.',
    n: 'Sudden breathlessness, chest pain, a churning murmur, altered consciousness. Clamp the line, lay the patient left side down and head low, give oxygen, call for help.',
    see: ['Hub', 'Needleless connector'] },

  { t: 'Catheter embolism', abbr: 'catheter fracture, catheter embolus', cat: 'Complication',
    d: 'A fragment of catheter breaking off and travelling downstream.',
    n: 'The reason a stylet is never re-advanced and a catheter is never withdrawn back over a needle. If a removed catheter is short, measure it, keep it, and escalate immediately.',
    see: ['Stylet', 'Catheter measurement'] },

  { t: 'Pinch-off syndrome', cat: 'Complication',
    d: 'Compression of a subclavian catheter between the clavicle and the first rib.',
    n: 'Flow that changes when the patient raises the arm or shrugs. Left alone it abrades the catheter until it fractures, so it gets imaged, not ignored.',
    see: ['Catheter embolism', 'Occlusion'] },

  { t: 'Migration', abbr: 'catheter migration, malposition', cat: 'Complication',
    d: 'The catheter tip moving out of its intended position after placement.',
    n: 'A change in external length is the cheapest early warning there is, which is why exposed length is measured at every check. A PICC whose external length has changed is no longer cleared for use without re-confirmation (M03 10 711).',
    see: ['Catheter measurement', 'Tip confirmation'] },

  { t: 'Arterial puncture', cat: 'Complication',
    d: 'Entering an artery instead of the intended vein.',
    n: 'Bright red pulsatile flow, and the catheter pressurizes the tubing. Withdraw and hold firm pressure for at least 5 to 10 minutes, longer if anticoagulated, then document and reassess distal perfusion.',
    see: ['Brachial artery'] },

  { t: 'Paresthesia', cat: 'Complication',
    d: 'Tingling, burning or an electric shooting sensation caused by nerve contact.',
    n: 'Stop and withdraw at once. Continuing through it is how a transient symptom becomes a permanent injury.',
    see: ['Median nerve'] },

  { t: 'Hematoma', cat: 'Complication',
    d: 'A collection of blood in the tissue from a vessel that was punctured and leaked.',
    n: 'Pressure straight away, elevate, and do not try the same vein again above the site. A large or expanding one on the arm is an exclusion for a line on that side.',
    see: ['Arterial puncture'] },

  { t: 'Medical adhesive-related skin injury', abbr: 'MARSI', cat: 'Complication',
    d: 'Skin damage lasting more than 30 minutes after an adhesive is removed: stripping, tearing, blistering or contact irritation.',
    n: 'Low-and-slow removal parallel to the skin, a barrier film under the dressing on fragile skin, and never stretching a transparent dressing to make it fit.',
    see: ['Transparent semipermeable membrane', 'Skin barrier film'] },

  /* ---------------- Infusion science ---------------- */
  { t: 'Osmolarity', abbr: 'mOsm/L, osmolality', cat: 'Infusion',
    d: 'The concentration of dissolved particles in a solution, in milliosmoles per liter. Plasma sits around 285.',
    n: 'Over roughly 900 mOsm/L a solution needs a central line. TPN and concentrated dextrose are the usual offenders.',
    see: ['pH', 'Hemodilution', 'Parenteral nutrition'] },

  { t: 'pH', cat: 'Infusion',
    d: 'How acidic or alkaline a solution is. Blood holds close to 7.35 to 7.45.',
    n: 'Roughly pH 5 to 9 is peripherally tolerable. Outside that the solution damages the intima directly, whatever the drug is.',
    see: ['Osmolarity', 'Irritant'] },

  { t: 'Hemodilution', cat: 'Infusion',
    d: 'The rapid dilution of an infusate by the blood flowing past the catheter tip.',
    n: 'The mechanism behind every central-line indication. The SVC moves about 2000 mL a minute; a hand vein moves about 10. That difference is the entire argument.',
    see: ['Superior vena cava', 'Osmolarity'] },

  { t: 'Parenteral nutrition', abbr: 'TPN, PN, PPN, total parenteral nutrition', cat: 'Infusion',
    d: 'Nutrition delivered intravenously: amino acids, dextrose, lipids, electrolytes, vitamins and trace elements.',
    n: 'Standard TPN is hypertonic and needs a central line. Peripheral PN is dilute, short-term only, and still hard on a vein.',
    see: ['Osmolarity', 'Central venous access device'] },

  { t: 'Compatibility', abbr: 'Y-site compatibility, drug compatibility', cat: 'Pharmacology',
    d: 'Whether two drugs can share a lumen or a Y-site without reacting.',
    n: 'Absence of evidence is not compatibility. If a pair is not documented as compatible, flush between them or run them in separate lumens.',
    see: ['Precipitate', 'SASH', 'Y-site'] },

  { t: 'Y-site', cat: 'Device',
    d: 'The injection port on an administration set where a second line joins the primary infusion.',
    n: 'The two drugs meet here, in the tubing, seconds before they reach the patient. Compatibility at the Y-site is not the same as compatibility in a bag.',
    see: ['Compatibility', 'Precipitate'] },

  { t: 'SASH', abbr: 'SAS, saline-administer-saline-heparin', cat: 'Procedure',
    d: 'Saline, administer the drug, saline, heparin lock. The flushing sequence around an intermittent medication.',
    n: 'Most Lee Health devices are saline-only, making it SAS. The point stands either way: the flush before and after is what keeps drugs from meeting each other in the lumen.',
    see: ['Flush', 'Locking solution', 'Compatibility'] },

  { t: 'Flush', abbr: 'flushing, push-pause, pulsatile flush', cat: 'Procedure',
    d: 'Injecting saline through a catheter to clear it, confirm patency and separate incompatible drugs.',
    n: 'Push-pause creates turbulence that sweeps the lumen wall. Ten mL of 0.9% sodium chloride at least every 12 hours, and before and after every medication (M03 10 448).',
    see: ['SASH', 'Patency', 'Syringe barrel size'] },

  { t: 'Syringe barrel size', abbr: '10 mL rule, 10 mL syringe', cat: 'Procedure',
    d: 'The diameter of the syringe barrel, which sets how much pressure a given push generates.',
    n: 'A small barrel generates high pressure for the same thumb force and can rupture a catheter. Use 10 mL or larger to check patency and blood return.',
    see: ['Flush', 'Occlusion'] },

  { t: 'Patency', cat: 'Procedure',
    d: 'That a catheter is open and usable: it flushes without resistance and, where expected, gives a blood return.',
    n: 'Never force a flush to establish it. Resistance means stop and assess, because the next push is what ruptures the catheter or pushes a clot off the tip.',
    see: ['Blood return', 'Flush', 'Occlusion'] },

  { t: 'Blood return', abbr: 'BR, positive blood return, aspiration', cat: 'Procedure',
    d: 'Blood drawn back into the syringe or tubing when gentle negative pressure is applied.',
    n: 'Brisk, dark, free-flowing blood is the expectation. Absent on a central line means assess before use, not push harder.',
    see: ['Withdrawal occlusion', 'Patency'] },

  { t: 'Locking solution', abbr: 'lock, heparin lock, saline lock, citrate lock', cat: 'Procedure',
    d: 'The solution left sitting in a lumen between uses to keep it open.',
    n: 'Most devices lock with saline. Dialysis catheters carry a concentrated heparin or citrate lock that is withdrawn, never flushed in, before use (M03 10 357).',
    see: ['Hemodialysis catheter', 'Flush'] },

  { t: 'Positive pressure', abbr: 'positive pressure technique', cat: 'Procedure',
    d: 'Keeping forward pressure on the syringe plunger while clamping, so blood does not get drawn back into the tip.',
    n: 'The clamp sequence depends on the connector: clamp before disconnecting on a negative-displacement valve, after on a positive-displacement one.',
    see: ['Needleless connector', 'Flush'] },

  { t: 'Contrast media', abbr: 'contrast, CT contrast, iodinated contrast', cat: 'Pharmacology',
    d: 'The iodinated agent injected for a contrast-enhanced CT, usually delivered under high pressure by a power injector.',
    n: 'Needs an adequate gauge in an adequate vein, or a power-rated device. A non-power midline is not indicated for contrast (M03 10 605).',
    see: ['Power injectable', 'Gauge'] },

  /* ---------------- Measurement ---------------- */
  { t: 'Gauge', abbr: 'G, catheter gauge', cat: 'Measurement',
    d: 'Catheter outer diameter on an inverse scale: the higher the number, the thinner the catheter.',
    n: '18 G for rapid transfusion and trauma, 20 G for most adult therapy and CT contrast, 22 G for fragile or small veins, 24 G for very fragile. Smallest that delivers the therapy.',
    see: ['French', 'Catheter-to-vein ratio', 'Peripheral IV'] },

  { t: 'French', abbr: 'Fr, French size', cat: 'Measurement',
    d: 'Outer circumference measure used for larger catheters. One French is one third of a millimeter of diameter.',
    n: 'Runs the opposite way to gauge: a bigger French number is a bigger catheter. PICCs are typically 4 to 6 Fr, dialysis catheters 11 to 16 Fr.',
    see: ['Gauge'] },

  { t: 'Catheter-to-vein ratio', abbr: '45% rule, CVR', cat: 'Measurement',
    d: 'The catheter outer diameter as a percentage of the internal diameter of the vein it sits in.',
    n: 'Keep it at or under 45%. Above that, blood cannot flow freely around the catheter and the thrombosis rate climbs. Over 45% is an exclusion for a midline (M03 10 605).',
    see: ['Thrombosis', 'Ultrasound', 'Gauge'] },

  { t: 'Catheter measurement', abbr: 'exposed length, external length, exposure', cat: 'Measurement',
    d: 'The length of catheter outside the skin, measured from the exit site to a fixed reference point on the hub.',
    n: 'Measured at insertion and at every dressing change. A change means the tip has moved. Same reference point every time or the number means nothing.',
    see: ['Migration', 'Arm circumference'] },

  { t: 'Arm circumference', abbr: 'circ, mid-upper arm circumference, MUAC', cat: 'Measurement',
    d: 'The circumference of the upper arm, measured at a marked point, usually 10 cm above the antecubital fossa.',
    n: 'The baseline at insertion is what makes later swelling measurable. An increase of 3 cm or more with arm symptoms suggests thrombosis.',
    see: ['Thrombosis', 'Catheter measurement'] },

  { t: 'Dwell time', abbr: 'dwell, indwelling time', cat: 'Measurement',
    d: 'How long a catheter has been in place.',
    n: 'PIV maximum 29 days at Lee Health, EMS sites changed within 48 hours, EJ within 24 to 96 hours, IO within 24 hours. Dwell alone rarely justifies a change on a central line.',
    see: ['Peripheral IV', 'Intraosseous'] },

  /* ---------------- Dressings and securement ---------------- */
  { t: 'Transparent semipermeable membrane', abbr: 'TSM, transparent dressing, Tegaderm, IV3000', cat: 'Dressing',
    d: 'A clear adhesive film that lets moisture vapor out while keeping fluid and organisms out.',
    n: 'Lets you see the site without taking anything off. Changed every 7 days, or immediately if it is loose, damp, soiled or lifting at an edge.',
    see: ['Gauze dressing', 'Medical adhesive-related skin injury'] },

  { t: 'Gauze dressing', cat: 'Dressing',
    d: 'A sterile gauze pad secured with tape, used when a site is bleeding or oozing or the patient cannot tolerate the film.',
    n: 'Changed every 48 hours rather than every 7 days, because you cannot see through it. Switch back to a transparent dressing once the oozing stops.',
    see: ['Transparent semipermeable membrane'] },

  { t: 'CHG', abbr: 'chlorhexidine gluconate, chlorhexidine', cat: 'Infection',
    d: 'A broad-spectrum antiseptic that binds to skin and keeps killing for hours after it dries.',
    n: 'Used as a 2% CHG in 70% alcohol prep and as an impregnated disc or gel dressing at central line exit sites. Let it dry fully, do not fan or blot.',
    see: ['CHG disc', 'Scrub the hub', 'CLABSI'] },

  { t: 'CHG disc', abbr: 'Biopatch, chlorhexidine disc, CHG gel dressing', cat: 'Infection',
    d: 'A chlorhexidine-impregnated sponge or gel pad placed around the exit site under the dressing.',
    n: 'The sponge goes grid side down with the slit closed around the catheter. Replace at every dressing change, and inspect for skin reaction underneath.',
    see: ['CHG', 'CLABSI'] },

  { t: 'Securement', abbr: 'engineered stabilization device, ESD, StatLock, SecurAcath', cat: 'Dressing',
    d: 'A purpose-built device holding a catheter in place, replacing tape and sutures.',
    n: 'Reduces migration, dislodgement, phlebitis and infection. Sutures are the fallback, not the standard: they injure skin and harbor organisms.',
    see: ['Migration', 'Suture'] },

  { t: 'Suture', abbr: 'sutured catheter', cat: 'Dressing',
    d: 'A stitch anchoring a catheter to the skin.',
    n: 'Needed on some devices, but a tight suture can occlude a lumen and a loose one lets the line move. Check the skin under and around it at every dressing change.',
    see: ['Securement', 'Occlusion'] },

  { t: 'Skin barrier film', abbr: 'barrier film, Cavilon, No Sting', cat: 'Dressing',
    d: 'A liquid film applied to the skin that dries into a protective layer under an adhesive.',
    n: 'Goes on the skin around the site, never over the insertion point itself. Worth using on anyone elderly, edematous, on steroids or with paper-thin skin.',
    see: ['Medical adhesive-related skin injury', 'Transparent semipermeable membrane'] },

  /* ---------------- Infection prevention ---------------- */
  { t: 'CLABSI', abbr: 'central line-associated bloodstream infection, central line associated', cat: 'Infection',
    d: 'A laboratory-confirmed bloodstream infection in a patient with a central line in place for more than two consecutive days, with no other source.',
    n: 'A surveillance definition, not a clinical one, and the metric everything in central line care is built to move. Fewest lumens, shortest dwell, cleanest hub.',
    see: ['CRBSI', 'Central line bundle', 'Scrub the hub'] },

  { t: 'CRBSI', abbr: 'catheter-related bloodstream infection', cat: 'Infection',
    d: 'A bloodstream infection proven to come from the catheter, by matched cultures from the line and a peripheral stick.',
    n: 'Stricter than CLABSI and used clinically rather than for reporting. Differential time to positivity is what usually makes the call.',
    see: ['CLABSI'] },

  { t: 'Central line bundle', abbr: 'CLABSI bundle, insertion bundle', cat: 'Infection',
    d: 'The grouped practices used together at insertion and in maintenance: hand hygiene, maximal barriers, chlorhexidine prep, optimal site, and daily review of necessity.',
    n: 'The bundle works as a set. Daily review of whether the line is still needed is the element most often skipped and the one that removes the most risk.',
    see: ['Maximal sterile barrier', 'CLABSI', 'Idle line'] },

  { t: 'Maximal sterile barrier', abbr: 'MSB, maximal barrier precautions', cat: 'Infection',
    d: 'Cap, mask, sterile gown, sterile gloves and a full-body sterile drape for central line insertion.',
    n: 'Full body drape, not a fenestrated square. Anyone at the bedside during insertion wears cap and mask.',
    see: ['Central line bundle', 'Aseptic non-touch technique'] },

  { t: 'Aseptic non-touch technique', abbr: 'ANTT', cat: 'Infection',
    d: 'A framework built on identifying the key parts and key sites that must not be touched, and protecting only those.',
    n: 'The hub, the syringe tip, the needle and the insertion site are the key parts. Sterile gloves do not help if the hub was contaminated first.',
    see: ['Scrub the hub', 'Maximal sterile barrier'] },

  { t: 'Scrub the hub', abbr: 'hub disinfection, disinfect the hub', cat: 'Infection',
    d: 'Mechanically cleaning the needleless connector with an antiseptic before every access.',
    n: 'At least 15 seconds of friction with alcohol at Lee Health, then let it dry. The friction does the work, not the wetness.',
    see: ['Hub', 'Needleless connector', 'CLABSI'] },

  { t: 'Disinfecting cap', abbr: 'alcohol cap, port protector, Curos', cat: 'Infection',
    d: 'A cap containing an alcohol sponge that screws onto a needleless connector between uses.',
    n: 'Passive protection, and it also tells you at a glance that the hub was covered. A new one after every access, never re-applied.',
    see: ['Scrub the hub', 'Needleless connector'] },

  { t: 'Idle line', abbr: 'idle catheter, just in case IV', cat: 'Infection',
    d: 'A catheter still in place that is no longer being used for anything.',
    n: 'Pure risk with no benefit. Finding and removing these is a large part of what daily VAN rounds are for (M03 10 448).',
    see: ['Central line bundle', 'CLABSI'] },

  /* ---------------- Process and documentation ---------------- */
  { t: 'Vascular access nurse', abbr: 'VAN, vascular access team, VAT', cat: 'Process',
    d: 'The nurse or team specializing in placing, assessing and salvaging vascular access devices across a facility.',
    n: 'The consult exists so device selection is made once, correctly, by someone who sees hundreds of them, rather than repeatedly by whoever is free.',
    see: ['Consult', 'Vessel health and preservation'] },

  { t: 'Vessel health and preservation', abbr: 'VHP', cat: 'Process',
    d: 'The principle that a patient has a finite amount of usable vein and every cannulation spends some of it.',
    n: 'The reason you start distal, use the smallest device that works, and protect the forearm in anyone with kidney disease. Today is not the only admission.',
    see: ['Catheter-to-vein ratio', 'Limb alert'] },

  { t: 'Limb alert', abbr: 'limb restriction, limb precaution, limb alert band', cat: 'Process',
    d: 'A flag that a given limb must not be used for venipuncture, blood pressure or a catheter.',
    n: 'Mastectomy with node dissection, an existing fistula or graft, lymphedema, a vein-preservation order in kidney disease, paralysis or trauma. Check both the chart and the wrist.',
    see: ['Vessel health and preservation', 'Arteriovenous fistula'] },

  { t: 'Arteriovenous fistula', abbr: 'AVF, fistula, AV graft, AVG', cat: 'Anatomy',
    d: 'A surgically made connection between an artery and a vein, or a graft between them, created for dialysis access.',
    n: 'Never cannulate, tourniquet or take a pressure on that arm. Check for thrill and bruit if you are assessing it, and protect the other arm for future access too.',
    see: ['Limb alert', 'Vessel health and preservation'] },

  { t: 'Consult', cat: 'Process',
    d: 'A request for the vascular access service to assess a patient and place, troubleshoot or remove a device.',
    n: 'Stat and routine are different work. A stat consult interrupts the round; a routine one gets sequenced with the rest of the list.',
    see: ['Vascular access nurse', 'Tip confirmation'] },

  { t: 'Licensed independent practitioner', abbr: 'LIP, provider, ordering provider', cat: 'Process',
    d: 'A clinician licensed to order tests and treatments independently: physician, NP or PA.',
    n: 'PICC and trimmable midline placement need an LIP order and informed consent. A non-trimmable midline does not (M03 10 605, M03 10 711).',
    see: ['Informed consent', 'Order set'] },

  { t: 'Informed consent', cat: 'Process',
    d: 'The patient’s documented agreement to a procedure after the risks, benefits and alternatives have been explained.',
    n: 'Form 5829 for PICC and trimmable midline at Lee Health. The conversation belongs to the provider; confirming the form exists before you start belongs to you.',
    see: ['Licensed independent practitioner'] },

  { t: 'Order set', abbr: 'adult PICC order set', cat: 'Process',
    d: 'A grouped set of orders covering a procedure and the care that follows it.',
    n: 'The adult PICC insertion, flushing and maintenance order set must be in place before insertion, not after (M03 10 711).',
    see: ['PICC', 'Licensed independent practitioner'] },

  { t: 'Tip confirmation', abbr: 'tip location, tip verification, ECG tip confirmation, chest x-ray', cat: 'Procedure',
    d: 'Confirming where a central catheter tip has landed, by intracavitary ECG, tip-locating technology or chest radiograph.',
    n: 'A central line is not cleared for use until the tip is confirmed. An outside-placed line, or one whose external length has changed, needs confirmation before you use it.',
    see: ['Cavo-atrial junction', 'Migration', 'PICC'] },

  { t: 'Ultrasound', abbr: 'US, sonography, vessel ultrasound', cat: 'Procedure',
    d: 'Imaging used to find a vein, judge its size and depth, tell it from an artery and watch the needle enter it.',
    n: 'Veins compress and arteries do not. Measure the vein before you choose the catheter, because the 45% ratio decides the gauge.',
    see: ['Catheter-to-vein ratio', 'Ultrasound-guided PIV'] },

  { t: 'Trendelenburg', cat: 'Procedure',
    d: 'Head-down tilt, used to distend the neck and upper chest veins and to reduce air embolism risk during central access.',
    n: 'Also the position for a suspected air embolism, combined with left lateral decubitus.',
    see: ['Air embolism'] },

  { t: 'Valsalva maneuver', cat: 'Procedure',
    d: 'Bearing down against a closed airway, which raises intrathoracic pressure.',
    n: 'Asked for at the moment of catheter removal or hub disconnection so air is not drawn in. If the patient cannot cooperate, time it to expiration instead.',
    see: ['Air embolism'] },

  { t: 'Declotting', abbr: 'clearing a line, catheter clearance, salvage', cat: 'Procedure',
    d: 'Restoring flow through an occluded catheter, usually by instilling a thrombolytic and letting it dwell.',
    n: 'Distinct from clearing a line for use, which is confirming an existing device is safe to use. Midlines are not declotted, they are removed (M03 10 605).',
    see: ['Alteplase', 'Occlusion', 'Midline catheter'] },

  { t: 'Blood culture', abbr: 'BC, blood cultures, peripheral culture', cat: 'Infection',
    d: 'Blood drawn into culture bottles to detect organisms in the bloodstream.',
    n: 'Drawing through the line and peripherally at once is what distinguishes a line infection from one elsewhere. Sequence, volume and site are all recorded.',
    see: ['CRBSI', 'CLABSI'] },

  /* ---------------- Assessment vocabulary ---------------- */
  { t: 'Blanching', cat: 'Assessment',
    d: 'Skin turning pale or white, either on pressure or on its own.',
    n: 'Spontaneous blanching around a site is an infiltration sign and appears in the grading scale from 1+ up.',
    see: ['Infiltration'] },

  { t: 'Induration', cat: 'Assessment',
    d: 'Hardening of the tissue under the skin.',
    n: 'Firmer and deeper than the soft puffiness of edema. Around an exit site it suggests inflammation or infection rather than simple leakage.',
    see: ['Phlebitis', 'Infiltration'] },

  { t: 'Erythema', cat: 'Assessment',
    d: 'Redness of the skin.',
    n: 'Track the extent and whether it follows the vein. Redness along the vein track suggests phlebitis; redness spreading around the site suggests infection.',
    see: ['Phlebitis', 'Cellulitis'] },

  { t: 'Cellulitis', cat: 'Complication',
    d: 'Spreading bacterial infection of the skin and the tissue just beneath it.',
    n: 'Hot, red, tender, with a poorly defined edge. Existing cellulitis of the upper arm is an exclusion for a midline or PICC on that side.',
    see: ['Erythema', 'Midline catheter'] },

  { t: 'Palpable cord', abbr: 'venous cord', cat: 'Assessment',
    d: 'A firm, tender, rope-like vein felt along its course.',
    n: 'The line between phlebitis grades. A cord over one inch with purulent drainage is 4+ on the scale.',
    see: ['Phlebitis', 'Thrombophlebitis'] },

  { t: 'Purulent drainage', abbr: 'pus, purulence', cat: 'Assessment',
    d: 'Thick, opaque, yellow or green discharge from a site.',
    n: 'Not ambiguous. Culture it, notify the provider, and expect the line to come out.',
    see: ['Phlebitis', 'CLABSI'] },

  { t: 'Collateral circulation', abbr: 'collaterals, collateral veins', cat: 'Assessment',
    d: 'Enlarged surface veins that develop when a deeper vein is obstructed and blood has to find another way back.',
    n: 'New visible veins across the shoulder, chest wall or neck on the catheter side point to central vein occlusion. Easy to miss unless you look at the chest.',
    see: ['Thrombosis'] },

  { t: 'Edema', abbr: 'swelling, pitting edema', cat: 'Assessment',
    d: 'Fluid collecting in the tissue.',
    n: 'Compare arm to arm and measure. New unilateral arm swelling on a line side is thrombosis until proven otherwise; generalized edema is a different problem.',
    see: ['Arm circumference', 'Thrombosis', 'Infiltration'] },

  /* ---------------- Common abbreviations ---------------- */
  { t: 'NS', abbr: '0.9% NaCl, normal saline, sodium chloride 0.9%', cat: 'Infusion',
    d: 'Isotonic 0.9% sodium chloride, the standard flush and carrier solution.',
    n: 'Ten mL is the routine flush volume; more after a blood draw or blood product.',
    see: ['Flush'] },

  { t: 'KVO', abbr: 'TKO, keep vein open, to keep open', cat: 'Infusion',
    d: 'A slow continuous infusion rate whose only purpose is keeping the catheter patent.',
    n: 'Often the reason a line is still in. If KVO is the only thing running, the line may not be needed at all.',
    see: ['Idle line', 'Patency'] },

  { t: 'PRN', abbr: 'pro re nata, as needed', cat: 'Process',
    d: 'Given or done as needed rather than on a schedule.',
    n: 'A PRN dressing change means as soon as the dressing fails, not at the next scheduled round.',
    see: ['Transparent semipermeable membrane'] },

  { t: 'IFU', abbr: 'instructions for use, manufacturer IFU', cat: 'Process',
    d: 'The manufacturer’s document specifying how a device may be used: dwell, pressure limits, power rating, flush volumes, removal.',
    n: 'Where policy is silent, the IFU governs. It is also what you fall back on for any device you do not place often.',
    see: ['Power injectable'] },

  { t: 'INS', abbr: 'Infusion Nurses Society, Standards of Practice', cat: 'Process',
    d: 'The professional body whose Infusion Therapy Standards of Practice, now in its 9th edition, underpins most infusion policy.',
    n: 'Cited throughout the Lee Health policies. When a policy seems to have a gap, the standard usually explains what the policy assumed.',
    see: ['Vessel health and preservation'] },

  { t: 'MET', abbr: 'medical emergency team, rapid response, RRT', cat: 'Process',
    d: 'The team called for a patient deteriorating outside a critical care unit.',
    n: 'Vascular access is often called with them, because the access that existed is usually the problem.',
    see: ['Intraosseous'] },

  { t: 'DIVA', abbr: 'difficult intravenous access, difficult venous access', cat: 'Process',
    d: 'A patient in whom peripheral access has failed or is predicted to fail by traditional means.',
    n: 'Predictable: IV drug history, obesity, dialysis, sickle cell, oncology, frailty. Recognizing it early is what stops the fourth failed attempt.',
    see: ['Ultrasound-guided PIV', 'Vessel health and preservation'] }
];

/* search: match on the term, its abbreviations, and the definition text */
VW.termSearch = function (q) {
  const s = (q || '').trim().toLowerCase();
  if (!s) return VW.terms.slice();
  const hit = [];
  VW.terms.forEach(x => {
    const name = x.t.toLowerCase();
    const abbr = (x.abbr || '').toLowerCase();
    const body = (x.d + ' ' + (x.n || '')).toLowerCase();
    let rank = -1;
    if (name === s || abbr.split(',').some(a => a.trim() === s)) rank = 0;
    else if (name.startsWith(s)) rank = 1;
    else if (abbr.includes(s)) rank = 2;
    else if (name.includes(s)) rank = 3;
    else if (body.includes(s)) rank = 4;
    if (rank >= 0) hit.push({ x: x, r: rank });
  });
  hit.sort((a, b) => a.r - b.r || a.x.t.localeCompare(b.x.t));
  return hit.map(h => h.x);
};

VW.termCats = function () {
  const seen = [];
  VW.terms.forEach(x => { if (seen.indexOf(x.cat) < 0) seen.push(x.cat); });
  return seen.sort();
};

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');

  const fmtClock = ts => { const d = new Date(ts); let h = d.getHours(); const m = pad(d.getMinutes()); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m + ' ' + ap; };

  const fmtDur = ms => { if (ms < 0) ms = 0; const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60); return h + 'h ' + pad(m) + 'm'; };
  const fmtDurLong = ms => { if (ms < 0) ms = 0; const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return h + ':' + pad(m) + ':' + pad(s); };
  const dateKey = d => { const x = d ? new Date(d) : new Date(); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };

  /* Miguel's own mark and wordmark, inlined by build.py as data URIs */
  const LOGO = '<span class="brand-mark" role="img" aria-label="Veinwise"></span>';

  /* ---------------- state ---------------- */
  const KEY = 'veinwise.state.v1';
  const DEFAULTS = {
    v: 1,
    profile: { name: '', facility: '' },
    settings: {
      shiftHours: 12, consultMin: 17, consultMax: 22, checkMin: 5, checkMax: 10,

    schedule: [],

    flags: [],
    rounds: []
  };

  let S = load();
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(DEFAULTS);
      const p = JSON.parse(raw);
      const s = Object.assign(structuredClone(DEFAULTS), p);
      s.settings = Object.assign(structuredClone(DEFAULTS.settings), p.settings || {});
      s.profile = Object.assign({}, DEFAULTS.profile, p.profile || {});
      s.lib = Object.assign(structuredClone(DEFAULTS.lib), p.lib || {});
      if (!Array.isArray(s.rounds)) s.rounds = [];
      return s;
    } catch (e) { console.warn('load failed', e); return structuredClone(DEFAULTS); }
  }
  let saveTimer = null;
  function save(now) {
    const write = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Storage full or blocked — export a backup'); } };
    if (now) { clearTimeout(saveTimer); write(); return; }
    clearTimeout(saveTimer); saveTimer = setTimeout(write, 250);
  }

  /* video + resource libraries: seeded once, then user-owned */
  const SEED_VERSION = 2;
  function seedInto(listName, seed) {
    if (!S.lib[listName]) { S.lib[listName] = seed.map(v => Object.assign({}, v)); return S.lib[listName]; }
    // an existing install: add seed entries it has never seen, leave the user's own edits alone
    if ((S.lib.seedVersion || 1) < SEED_VERSION) {
      const have = new Set(S.lib[listName].map(x => x.id));
      seed.forEach(v => { if (!have.has(v.id)) S.lib[listName].push(Object.assign({}, v)); });
    }
    return S.lib[listName];
  }
  function videos() { const r = seedInto('videos', VW.videosSeed); bumpSeed(); return r; }
  function resources() { const r = seedInto('resources', VW.resourcesSeed); bumpSeed(); return r; }
  let seedBumped = false;
  function bumpSeed() {
    if (seedBumped) return;
    if ((S.lib.seedVersion || 1) < SEED_VERSION) { S.lib.seedVersion = SEED_VERSION; seedBumped = true; save(); }
  }
  function allMeds() { return VW.meds.concat(S.lib.meds.map(m => Object.assign({ custom: true }, m))); }
  function allDevices() { return VW.devices.concat(S.lib.devices.map(d => Object.assign({ custom: true }, d))); }

  /* ---------------- toast ---------------- */
  let toastTimer;
  function toast(msg) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;

  }

  /* ---------------- shift engine ---------------- */
  function newShift() {
    const now = Date.now();
    return { id: uid(), date: dateKey(now), clockIn: now, clockOut: null, breaks: [], events: [], notes: [], summary: '', nextReminder: now + S.settings.reminderMins * 60000 };
  }
  function cur() { return S.current; }
  function breakMs(sh) {
    return (sh.breaks || []).reduce((a, b) => a + ((b.end || Date.now()) - b.start), 0);
  }
  function onBreak(sh) { return (sh.breaks || []).some(b => !b.end); }
  function workedMs(sh) {
    if (!sh) return 0;
    const end = sh.clockOut || Date.now();
    return Math.max(0, end - sh.clockIn - breakMs(sh));
  }
  function counts(sh) {
    const e = (sh && sh.events) || [];
    return {
      consults: e.filter(x => x.kind === 'consult' && !x.pending).length,
      openConsults: e.filter(x => x.kind === 'consult' && x.pending).length,
      checks: e.filter(x => x.kind === 'check').length,
      mets: e.filter(x => x.kind === 'met').length,
      stats: e.filter(x => x.kind === 'consult' && x.stat && !x.pending).length,
      unsuccessful: e.filter(x => x.kind === 'consult' && x.piv && x.piv.unsuccessful).length
    };
  }
  function stats(sh) {
    const st = S.settings, c = counts(sh);
    const hours = workedMs(sh) / 3600000;
    const total = st.shiftHours;
    const remaining = Math.max(0, total - hours);
    const pace = hours >= 0.4 ? c.consults / hours : null;
    const projected = pace == null ? null : c.consults + pace * remaining;
    const consultMid = (st.consultMin + st.consultMax) / 2;
    const checkMid = (st.checkMin + st.checkMax) / 2;
    const expConsults = consultMid * Math.min(1, hours / total);
    const expChecks = checkMid * Math.min(1, hours / total);
    let index = null;
    if (hours >= 0.4) {
      const cPart = expConsults > 0 ? c.consults / expConsults : 0;
      const kPart = expChecks > 0 ? c.checks / expChecks : 0;
      index = Math.round((cPart * 0.75 + kPart * 0.25) * 100);
    }
    const needed = Math.max(0, st.consultMin - c.consults);
    const neededRate = remaining > 0.1 ? needed / remaining : null;
    let status = 'warming', label = 'Getting started';
    if (hours >= 0.4) {
      const proj = projected == null ? c.consults : projected;
      if (proj >= st.consultMax) { status = 'good'; label = 'Ahead of target'; }
      else if (proj >= st.consultMin) { status = 'good'; label = 'On target'; }
      else if (proj >= st.consultMin - 3) { status = 'warn'; label = 'Slightly behind'; }
      else { status = 'bad'; label = 'Behind target'; }
    }
    return { c, hours, remaining, pace, projected, index, needed, neededRate, status, label, st };
  }

  function clockIn() {
    if (S.current) return;
    S.current = newShift();
    save(true); toast('Clocked in — shift started'); render();
  }
  function clockOut() {
    const sh = S.current; if (!sh) return;
    openSheet({
      title: 'End shift',
      body: `<p class="muted" style="font-size:13.5px">Saving closes this shift and files it in History. You can reopen it any time to review.</p>

      sh.breaks.push({ start: Date.now() });

      toast(S.settings.breakMins + '-minute break started');
    }
    save(true); render();
  }

  /* ---------------- notifications + reminders ---------------- */
  let swReg = null;
  function notifySupported() { return typeof Notification !== 'undefined'; }
  async function enableNotifications() {
    if (!notifySupported()) { toast('This browser cannot show notifications'); return; }
    try {
      const p = await Notification.requestPermission();
      S.settings.notify = (p === 'granted'); save(true);
      toast(p === 'granted' ? 'Reminders will reach your phone' : 'Notification permission declined');
      render();

  }
  function fireNotification(title, body) {
    try {
      if (navigator.vibrate) navigator.vibrate([140, 70, 140]);
      if (notifySupported() && Notification.permission === 'granted') {
        if (swReg && swReg.showNotification) {
          swReg.showNotification(title, { body, tag: 'vw-reminder', renotify: true, badge: 'icon-192.png', icon: 'icon-192.png', vibrate: [140, 70, 140] });

    showReminderBanner(title, body);
  }

  function showReminderBanner(title, body) { bannerMsg = { title, body }; if (active === 'shift') render(); }
  /* fires whether or not he is clocked in: the whole point is the
     heads-up before the shift starts */
  function checkPreShift() {
    const lead = Number(S.settings.preShiftMins || 0);
    if (!lead) return;
    const now = Date.now();
    let dirty = false;
    S.schedule.forEach(sch => {
      if (sch.notified) return;
      if (/pto|off/i.test(sch.type || '')) return;
      const start = schedStart(sch);
      if (!start) return;
      const fireAt = start - lead * 60000;
      /* a 10-minute catch-up window covers the app being closed for a while */
      if (now >= fireAt && now < fireAt + 600000) {
        sch.notified = true; dirty = true;
        const mins = Math.max(1, Math.round((start - now) / 60000));
        fireNotification(
          (sch.type || 'Shift') + ' in ' + (mins >= 60 ? Math.round(mins / 60) + ' h' : mins + ' min'),
          (sch.start ? sch.start + (sch.end ? ' to ' + sch.end : '') : '') +
          (sch.facility ? ' · ' + sch.facility : '') + '. ' + fmtDate(sch.date) + '.'
        );
        bannerMsg = {
          title: (sch.type || 'Shift') + ' starts at ' + (sch.start || 'soon'),
          body: fmtDate(sch.date) + (sch.facility ? ' · ' + sch.facility : '')
        };
      } else if (now >= fireAt + 600000 && now < start) {
        sch.notified = true; dirty = true;   /* missed the window, do not fire late */
      }
    });
    if (dirty) save();
  }

  function checkReminders() {
    checkPreShift();
    const sh = S.current; if (!sh) return;
    if (onBreak(sh)) {
      const b = sh.breaks.find(x => !x.end);
      if (b && Date.now() - b.start >= S.settings.breakMins * 60000 && !b.notified) {

      }

    if (!sh.nextReminder) { sh.nextReminder = Date.now() + S.settings.reminderMins * 60000; save(); return; }

      sh.nextReminder = Date.now() + S.settings.reminderMins * 60000;
      save(true);
      fireNotification('Hydrate and take 15', 'You are ' + fmtDur(workedMs(sh)) + ' into this shift. Water, then a 15-minute break.');
    }

  /* ---------------- sheets ---------------- */
