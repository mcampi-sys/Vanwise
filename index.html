/* ============================================================
   Veinwise — clinical decision support for vascular access
   Design tokens: light blue / gold (day and night)
   ============================================================ */

:root{
  /* brand: light blue + gold */
  --blue-950:#0B3550;   /* deep anchor: primary text, buttons, hero */
  --blue-900:#0E3E5C;
  --blue-800:#155A82;
  --blue-600:#2E86B8;
  --blue-400:#6FB6DC;   /* the light blue */
  --blue-200:#C2DFF1;
  --blue-50:#EDF5FB;
  --gold-600:#A98B3C;
  --gold-500:#C6AA58;
  --gold-300:#E0CB92;
  --gold-100:#F4EBD2;
  --mist-100:#EEF4F9;   /* app background */
  --mist-50:#F8FBFD;
  --cream-100:#F3EFE7;  /* kept: matches the opening sequence's paper */
  --clay-600:#A8452C;   /* semantic: stat / urgent / critical */
  --clay-100:#F6E3DC;
  --moss-600:#2F7D63;   /* semantic: good */
  --moss-100:#DDEFE7;

  /* surfaces + text (light) */
  --bg:var(--mist-100);
  --surface:#FFFFFF;
  --surface-2:var(--mist-50);
  --surface-3:#E3EDF4;
  --ink:#11242F;
  --ink-2:#44606F;
  --ink-3:#74909F;
  --line:#D3E1EA;
  --line-2:#E4EDF3;
  --accent:var(--gold-600);
  --accent-soft:var(--gold-100);
  --primary:var(--blue-950);
  --primary-ink:#FFFFFF;
  --danger:var(--clay-600);
  --danger-soft:var(--clay-100);
  --good:var(--moss-600);
  --good-soft:var(--moss-100);
  --shadow:0 1px 2px rgba(11,53,80,.07), 0 4px 16px rgba(11,53,80,.06);
  --shadow-lg:0 10px 40px rgba(11,53,80,.18);
  --r:14px;
  --r-sm:9px;
  --r-lg:20px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-ui:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --tap:56px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061821;
    --surface:#0C2531;
    --surface-2:#09202B;
    --surface-3:#123040;
    --ink:#E9F2F7;
    --ink-2:#A9C4D2;
    --ink-3:#7896A7;
    --line:#1A3E51;
    --line-2:#153546;
    --accent:var(--gold-500);
    --accent-soft:#2C2A1C;
    --primary:var(--gold-500);
    --primary-ink:#04161F;
    --danger:#E28468;
    --danger-soft:#33201A;
    --good:#67C7A8;
    --good-soft:#0E3226;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#061821;
  --surface:#0C2531;
  --surface-2:#09202B;
  --surface-3:#123040;
  --ink:#E9F2F7;
  --ink-2:#A9C4D2;
  --ink-3:#7896A7;
  --line:#1A3E51;
  --line-2:#153546;
  --accent:var(--gold-500);
  --accent-soft:#2C2A1C;
  --primary:var(--gold-500);
  --primary-ink:#04161F;
  --danger:#E28468;
  --danger-soft:#33201A;
  --good:#67C7A8;
  --good-soft:#0E3226;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;line-height:1.2;text-wrap:balance;}
p{margin:0 0 .7em;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
a{color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
[hidden]{display:none !important;}

/* ---------- App frame ---------- */
#app{
  display:flex;
  flex-direction:column;
  height:100%;
  max-height:100%;
}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:8px;min-width:0;}

}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.topbar-title{display:none;font-family:var(--font-display);font-size:17px;font-weight:600;}
.pill-clock{
  font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;
  background:var(--good-soft);color:var(--good);
  padding:5px 10px;border-radius:99px;white-space:nowrap;
}
.pill-clock.off{background:var(--surface-3);color:var(--ink-3);}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-2);flex:none;
}
.icon-btn:hover{background:var(--surface-3);}
.icon-btn svg{width:20px;height:20px;}

.app-main{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.tabbar{flex:none;}
.view{padding:16px 16px 26px;max-width:1180px;margin:0 auto;}
.view[hidden]{display:none;}

/* ---------- Bottom nav (phone / Fold closed) ---------- */
.tabbar{
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:40;
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 2px 11px;color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:.01em;
  border-top:2px solid transparent;margin-top:-1px;
}
.tabbar button svg{width:25px;height:25px;}
@media (max-width:430px){
  .tabbar button{font-size:10.5px;padding:10px 0 9px;gap:4px;letter-spacing:-.01em;}
  .tabbar button svg{width:22px;height:22px;}
}
@media (max-width:340px){
  .tabbar button{font-size:9.5px;}
  .tabbar button svg{width:20px;height:20px;}
}
.tabbar button[aria-selected="true"]{color:var(--primary);border-top-color:var(--accent);background:var(--accent-soft);}

/* ---------- Wide layout: Fold open / tablet / laptop ----------
   The bar stays at the bottom on every screen — thumbs are at the
   bottom of the phone and at the bottom of the unfolded Fold too. */
@media (min-width:820px){
  .topbar-title{display:block;}
  .view{padding:22px 26px 40px;}
  .tabbar{
    grid-template-columns:none;
    display:flex;justify-content:center;gap:4px;
    padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 6px);
  }
  .tabbar button{
    flex:0 1 168px;flex-direction:row;gap:9px;justify-content:center;
    padding:13px 14px;border-radius:13px;border-top:none;margin-top:0;
    font-size:15px;
  }
  .tabbar button svg{width:21px;height:21px;}
  .tabbar button:hover{background:var(--surface-3);}
  .tabbar button[aria-selected="true"]{border-top:none;background:var(--accent-soft);}
}

/* two-column shift board on wide screens (Fold open, laptop) */
@media (min-width:1000px){
  .shift-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:12px;}
  .shift-cols > div > .card:first-child,
  .shift-cols > div > .counters{margin-top:0;}
  .shift-cols .section-label:first-child{margin-top:0;}
}

/* ---------- Typography helpers ---------- */
.view-title{font-size:29px;margin-bottom:3px;}
.view-sub{color:var(--ink-3);font-size:14px;margin-bottom:18px;}
.section-label{
  font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);margin:26px 0 11px;
}
.section-label:first-child{margin-top:0;}
.muted{color:var(--ink-3);}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:15px;box-shadow:var(--shadow);
}
.card + .card{margin-top:11px;}
.card-flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;}
.card-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
.card-head h3{font-size:18.5px;}
.card-head .muted{font-size:12px;margin-left:auto;}
.grid{display:grid;gap:11px;}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
@media (min-width:700px){
  .grid-2\@wide{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* ---------- Shift hero ---------- */
.hero{
  background:linear-gradient(155deg,var(--blue-950) 0%,var(--blue-800) 100%);
  color:#EDF5FB;border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(198,170,88,.34),transparent 68%);pointer-events:none;
}
.hero-top{display:flex;align-items:flex-start;gap:12px;position:relative;}
.hero-label{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-300);font-weight:600;}
.hero-time{font-family:var(--font-display);font-size:46px;font-weight:600;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums;}
.hero-meta{font-size:14px;color:#B9D3E2;margin-top:8px;}
.hero-actions{display:flex;gap:8px;margin-top:15px;position:relative;flex-wrap:wrap;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 20px;border-radius:13px;
  font-weight:600;font-size:16.5px;background:var(--surface-3);color:var(--ink);
  border:1px solid transparent;transition:transform .06s ease, filter .15s ease;
}
.btn:active{transform:scale(.985);}
.btn svg{width:20px;height:20px;}
.btn-primary{background:var(--primary);color:var(--primary-ink);}
.btn-gold{background:var(--gold-500);color:#25200C;}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-2);}
.btn-on-dark{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(4px);}
.btn-on-dark.btn-gold{background:var(--gold-500);color:#25200C;}
.btn-sm{min-height:42px;padding:0 14px;font-size:14.5px;border-radius:10px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;}

/* ---------- Stats / counters ---------- */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px;}
.counter{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 10px 13px;text-align:center;position:relative;
}
.counter b{display:block;font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.counter span{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;font-weight:600;}
.counter .plus{
  position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:10px;
  background:var(--accent-soft);color:var(--accent);font-size:22px;font-weight:600;
  display:grid;place-items:center;line-height:1;
}

/* ---------- Meter ---------- */
.meter{margin-top:4px;}
.meter-track{
  position:relative;height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;
}
.meter-band{position:absolute;top:0;bottom:0;background:var(--good-soft);}
.meter-fill{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:var(--accent);transition:width .4s ease;}
.meter-fill.good{background:var(--good);}
.meter-fill.low{background:var(--danger);}
.meter-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums;}
.status-line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3);}
.dot.good{background:var(--good);}
.dot.warn{background:var(--gold-500);}
.dot.bad{background:var(--danger);}

/* ---------- Badges / chips ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;
}
.badge-stat{background:var(--danger);color:#fff;}
.badge-gold{background:var(--accent-soft);color:var(--accent);}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-line{background:transparent;border:1px solid var(--line);color:var(--ink-3);}

.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  min-height:50px;padding:0 17px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  font-size:15.5px;font-weight:600;
}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600;}
.chip.danger[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff;}
.chip-sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:9px;}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field > label,.field-label{
  display:block;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:8px;
}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{
  width:100%;min-height:var(--tap);padding:13px 15px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  color:var(--ink);font-size:16.5px;appearance:none;
}
textarea{min-height:82px;resize:vertical;line-height:1.5;}
input::placeholder,textarea::placeholder{color:var(--ink-3);}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface);}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) calc(50% + 1px),calc(100% - 12px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}
.inline-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.inline-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.check{
  display:flex;align-items:center;gap:10px;min-height:var(--tap);
  padding:12px 15px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  font-size:16px;font-weight:600;cursor:pointer;
}
.check input{width:24px;height:24px;accent-color:var(--blue-800);flex:none;margin:0;}
.check[data-on="true"]{background:var(--accent-soft);border-color:var(--gold-300);}
.help{font-size:13.5px;color:var(--ink-3);margin-top:8px;line-height:1.5;}
fieldset{border:none;padding:0;margin:0 0 14px;}
legend{padding:0;}

/* stat toggle */
.stat-toggle{display:flex;gap:8px;}
.stat-toggle button{
  flex:1;min-height:60px;border-radius:13px;font-weight:700;font-size:17px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);letter-spacing:.04em;
}
.stat-toggle button[aria-pressed="true"]{background:var(--danger);color:#fff;border-color:var(--danger);}
.stat-toggle button.calm[aria-pressed="true"]{background:var(--blue-800);color:#fff;border-color:var(--blue-800);}

/* ---------- Sheet / modal ---------- */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(6,26,38,.52);backdrop-filter:blur(2px);
  z-index:90;display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--bg);width:100%;max-width:640px;max-height:92vh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);animation:sheetUp .22s cubic-bezier(.22,.7,.3,1);
}
@keyframes sheetUp{from{transform:translateY(22px);opacity:.4;}to{transform:none;opacity:1;}}
@media (min-width:820px){
  .sheet-backdrop{align-items:center;}
  .sheet{border-radius:var(--r-lg);max-height:88vh;}
  @keyframes sheetUp{from{transform:scale(.98);opacity:.4;}to{transform:none;opacity:1;}}
}
.sheet-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--line);background:var(--surface);
  border-radius:20px 20px 0 0;
}
.sheet-head h2{font-size:17px;}
.sheet-head .btn{margin-left:auto;}
.sheet-body{padding:16px;overflow-y:auto;flex:1;}
.sheet-foot{
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  border-top:1px solid var(--line);background:var(--surface);display:flex;gap:9px;
}
.sheet-foot .btn{flex:1;}

/* ---------- Lists / timeline ---------- */
.entry{
  display:flex;gap:11px;padding:12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);margin-bottom:9px;cursor:pointer;
  border-left:3px solid var(--line);
}
.entry:active{background:var(--surface-2);}
.entry.kind-consult{border-left-color:var(--blue-600);}
.entry.kind-check{border-left-color:var(--gold-500);}
.entry.kind-met{border-left-color:var(--danger);}
.entry.is-stat{background:linear-gradient(90deg,var(--danger-soft),transparent 40%);}
.entry-time{
  font-size:13.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;
  width:60px;flex:none;padding-top:2px;
}
.entry-body{flex:1;min-width:0;}
.entry-title{font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.entry-detail{font-size:13.5px;color:var(--ink-3);margin-top:3px;line-height:1.45;word-break:break-word;}
.empty{
  text-align:center;padding:34px 18px;color:var(--ink-3);font-size:13.5px;
  border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2);
}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px;font-family:var(--font-display);}

/* ---------- Reference ---------- */
.subtabs{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.subtabs::-webkit-scrollbar{display:none;}
.subtabs button{
  flex:none;padding:12px 18px;border-radius:99px;font-size:15px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;
}
.subtabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}
.searchbar{position:relative;margin-bottom:12px;}
.searchbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3);}
.searchbar input{padding-left:38px;}

.ref-item{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  margin-bottom:9px;overflow:hidden;
}
.ref-head{
  width:100%;display:flex;align-items:center;gap:12px;padding:17px 16px;text-align:left;
}
.ref-head b{font-size:16.5px;font-weight:600;}
.ref-head .badge{margin-left:auto;}
.ref-head .caret{width:15px;height:15px;color:var(--ink-3);transition:transform .18s ease;flex:none;}
.ref-item[data-open="true"] .caret{transform:rotate(90deg);}
.ref-sub{font-size:13px;color:var(--ink-3);}
.ref-body{padding:0 16px 16px;border-top:1px solid var(--line-2);padding-top:14px;font-size:15px;line-height:1.6;}
.ref-body h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 5px;}
.ref-body h4:first-child{margin-top:0;}
.ref-body ul{margin:0 0 4px;padding-left:18px;}
.ref-body li{margin-bottom:4px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;}
.kv dt{color:var(--ink-3);font-weight:600;}
.kv dd{margin:0;}
.source{
  font-size:11.5px;color:var(--ink-3);border-top:1px dashed var(--line);
  margin-top:12px;padding-top:8px;font-style:italic;
}

/* vessel suitability row */
.vessel-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;}
.vessel{
  display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:4px 9px;border-radius:8px;background:var(--surface-3);color:var(--ink-2);
}
.vessel.yes{background:var(--good-soft);color:var(--good);}
.vessel.no{background:var(--danger-soft);color:var(--danger);}
.vessel.caution{background:var(--accent-soft);color:var(--accent);}

/* ---------- Algorithm ---------- */
.algo-step{margin-bottom:18px;}
.algo-result{
  border:1px solid var(--gold-300);background:var(--accent-soft);
  border-radius:var(--r);padding:16px;margin-top:6px;
}
:root[data-theme="dark"] .algo-result,
:root:not([data-theme="light"]) .algo-result{border-color:var(--gold-600);}
.algo-result .rec{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--ink);}
.algo-result .rec-sub{font-size:13px;color:var(--ink-2);margin-top:2px;}
.rule-list{list-style:none;padding:0;margin:12px 0 0;}
.rule-list li{
  display:flex;gap:9px;font-size:13.5px;line-height:1.5;padding:7px 0;
  border-top:1px solid rgba(0,0,0,.07);
}
:root[data-theme="dark"] .rule-list li{border-top-color:rgba(255,255,255,.08);}
.rule-list li:first-child{border-top:none;}
.rule-list .ico{flex:none;width:17px;height:17px;margin-top:2px;}
.rule-list .ico.stop{color:var(--danger);}
.rule-list .ico.warn{color:var(--accent);}
.rule-list .ico.ok{color:var(--good);}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.cal-head h3{font-size:17px;flex:1;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;padding-bottom:4px;}
.cal-day{
  aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:5px 2px 3px;font-size:12.5px;position:relative;gap:2px;
}
.cal-day.pad{background:transparent;border-color:transparent;pointer-events:none;}
.cal-day.today{border-color:var(--accent);border-width:2px;font-weight:700;}
.cal-day .marks{display:flex;gap:2px;}
.cal-day .mk{width:5px;height:5px;border-radius:50%;}
.mk.sched{background:var(--accent);}
.mk.night{background:var(--blue-600);}
.mk.off{background:var(--ink-3);}
.mk.worked{background:var(--good);}
.cal-legend{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--ink-3);}
.cal-legend span{display:flex;align-items:center;gap:5px;}
.cal-legend .lg{width:7px;height:7px;border-radius:50%;display:inline-block;}
.cal-legend .lg.sched{background:var(--accent);}
.cal-legend .lg.night{background:var(--blue-600);}
.cal-legend .lg.off{background:var(--ink-3);}
.cal-legend .lg.worked{background:var(--good);}

/* ---------- Notes ---------- */
.note-entry{
  border-left:2px solid var(--gold-300);padding:2px 0 2px 11px;margin-bottom:12px;
}
.note-entry time{font-size:11.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.note-entry p{margin:2px 0 0;font-size:14px;white-space:pre-wrap;}

/* ---------- Toast + banner ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  background:var(--blue-950);color:#EDF5FB;padding:11px 17px;border-radius:12px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:120;
  max-width:88%;text-align:center;
}
@media (min-width:820px){#toast{bottom:26px;}}
.banner{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid var(--gold-300);margin-bottom:12px;font-size:13.5px;
}
.banner svg{width:19px;height:19px;color:var(--accent);flex:none;}
.banner .btn{margin-left:auto;}
.banner.alert{background:var(--danger-soft);border-color:var(--danger);}
.banner.alert svg{color:var(--danger);}

/* ---------- Misc ---------- */
.disclaimer{
  font-size:11.5px;color:var(--ink-3);line-height:1.5;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2);
  margin-top:16px;
}
.wordmark-foot{
  text-align:center;padding:22px 0 8px;color:var(--ink-3);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
}
.split{display:flex;align-items:center;gap:10px;}
.split .grow{flex:1;min-width:0;}
hr{border:none;border-top:1px solid var(--line);margin:16px 0;}
.list-row{
  display:flex;align-items:center;gap:13px;padding:18px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;text-align:left;width:100%;
}
.list-row .grow b{display:block;font-size:16.5px;font-weight:600;}
.list-row .grow span{font-size:13.5px;color:var(--ink-3);}
.list-row svg{width:17px;height:17px;color:var(--ink-3);flex:none;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ============================================================
   Illustrations
   ============================================================ */
:root{
  --vessel-vein:#1E5C46;
  --vessel-vein-soft:#4E8C74;
  --vessel-artery:#A8452C;
  --vessel-nerve:#B8912F;
  --skin-a:#EDE6DA;
  --skin-b:#E2D9CB;
  --bone-fill:#E8E2D4;
  --marrow-fill:#F3E7D8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --vessel-vein:#6FC3A0;
    --vessel-vein-soft:#3E7D63;
    --vessel-artery:#E28468;
    --vessel-nerve:#D9B75E;
    --skin-a:#1A2C21;
    --skin-b:#14241B;
    --bone-fill:#1E3226;
    --marrow-fill:#26402F;
  }
}
:root[data-theme="dark"]{
  --vessel-vein:#6FC3A0;
  --vessel-vein-soft:#3E7D63;
  --vessel-artery:#E28468;
  --vessel-nerve:#D9B75E;
  --skin-a:#1A2C21;
  --skin-b:#14241B;
  --bone-fill:#1E3226;
  --marrow-fill:#26402F;
}

.vw-svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible;}
.vw-svg .skin-a{stop-color:var(--skin-a);}
.vw-svg .skin-b{stop-color:var(--skin-b);}
.vw-svg .skin{fill:var(--skin-a);stroke:var(--line);stroke-width:1.5;}
.vw-svg .crease{fill:none;stroke:var(--line);stroke-width:1.5;opacity:.75;}
.vw-svg .vessel{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.vw-svg .vein{stroke:var(--vessel-vein);stroke-width:7;}
.vw-svg .vein.thin{stroke-width:4.5;}
.vw-svg .vein-major{stroke:var(--vessel-vein);stroke-width:9;}
.vw-svg .deep{stroke:var(--vessel-vein-soft);stroke-width:5.5;stroke-dasharray:9 7;}
.vw-svg .artery{stroke:var(--vessel-artery);stroke-width:6;}
.vw-svg .nerve{stroke:var(--vessel-nerve);stroke-width:5;stroke-dasharray:2 6;}
.vw-svg .is-active{stroke-width:12;filter:drop-shadow(0 0 7px var(--vessel-vein));}
.vw-svg .artery.is-active{filter:drop-shadow(0 0 7px var(--vessel-artery));}
.vw-svg .nerve.is-active{filter:drop-shadow(0 0 7px var(--vessel-nerve));}
.vw-svg .hit{fill:none;stroke:transparent;stroke-width:28;cursor:pointer;pointer-events:stroke;}
.vw-svg .hit-narrow{stroke-width:13;}
.vw-svg .leader{stroke:var(--ink-3);stroke-width:1;opacity:.6;}
.vw-svg .dive-dot{fill:var(--vessel-vein);}
.vw-svg text{font-family:var(--font-ui);fill:var(--ink-2);}
.vw-svg .lbl{font-size:13px;font-weight:600;fill:var(--ink);}
.vw-svg .lbl-tiny{font-size:11.5px;fill:var(--ink-3);}
.vw-svg .lbl-deep{font-size:11.5px;font-weight:600;fill:var(--vessel-artery);}
.vw-svg .lbl-side{font-size:10px;font-weight:700;letter-spacing:.14em;fill:var(--ink-3);}
.vw-svg .lbl-head{font-size:13px;font-weight:700;fill:var(--ink);}
.vw-svg .lbl-route{font-size:12.5px;font-weight:700;fill:var(--ink);}
.vw-svg .lbl-gauge{font-size:15px;font-weight:700;fill:var(--ink);}
.vw-svg .deep-group.hidden{display:none;}

/* tip-location map */
.tip-map .atrium{fill:var(--danger-soft);stroke:var(--vessel-artery);stroke-width:1.2;opacity:.85;}
.tip-map .target{fill:none;stroke:var(--gold-500);stroke-width:1.6;stroke-dasharray:5 4;opacity:.9;}
.tip-map .vein-major{stroke-width:6;}
.tip-map .route{transition:opacity .2s ease;}
.tip-map .route.is-ghost{opacity:.18;}
.tip-map .cath{fill:none;stroke:var(--gold-500);stroke-width:4.5;stroke-linecap:round;}
.tip-map .route.is-active .cath{stroke-width:6;filter:drop-shadow(0 0 6px var(--gold-500));}
.tip-map .tip{fill:var(--gold-500);stroke:var(--blue-950);stroke-width:1.5;}
.tip-map .reservoir{fill:var(--gold-500);stroke:var(--blue-950);stroke-width:1.5;}

/* cross-sections */
.vw-svg .tissue{fill:var(--skin-b);stroke:var(--line);stroke-width:1.2;}
.vw-svg .port-body{fill:var(--surface-3);stroke:var(--ink-3);stroke-width:1.5;}
.vw-svg .septum{fill:var(--gold-300);stroke:var(--gold-600);stroke-width:1.2;}
.vw-svg .funnel{fill:var(--gold-300);stroke:var(--gold-600);stroke-width:1.2;}
.vw-svg .needle{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;fill:none;}
.vw-svg .needle-hub{fill:var(--gold-500);stroke:var(--ink-2);stroke-width:1;}
.vw-svg .bone{fill:var(--bone-fill);stroke:var(--ink-3);stroke-width:1.5;}
.vw-svg .marrow{fill:var(--marrow-fill);stroke:var(--ink-3);stroke-width:1;}
.vw-svg .tip{fill:var(--gold-500);stroke:var(--blue-950);stroke-width:1.2;}
.vw-svg .cath-body,.vw-svg .cath-tip{stroke:var(--ink-3);stroke-width:1;}

.fig{margin:0 0 14px;}
.fig figcaption{font-size:13px;color:var(--ink-3);margin-top:9px;line-height:1.5;}
.fig-frame{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 12px;box-shadow:var(--shadow);
}

/* vessel legend */
.vlegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--ink-3);}
.vlegend span{display:flex;align-items:center;gap:6px;}
.vlegend i{width:18px;height:4px;border-radius:2px;display:inline-block;}
.vlegend i.vein{background:var(--vessel-vein);}
.vlegend i.deep{background:repeating-linear-gradient(90deg,var(--vessel-vein-soft) 0 5px,transparent 5px 9px);}
.vlegend i.artery{background:var(--vessel-artery);}
.vlegend i.nerve{background:repeating-linear-gradient(90deg,var(--vessel-nerve) 0 2px,transparent 2px 5px);}

/* ============================================================
   Big-target layout pieces
   ============================================================ */
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
@media (min-width:700px){.hub{grid-template-columns:repeat(3,minmax(0,1fr));}}
.hub-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 16px;min-height:148px;text-align:left;box-shadow:var(--shadow);
  transition:transform .08s ease;
}
.hub-card:active{transform:scale(.98);}
.hub-card .hub-ico{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);margin-bottom:8px;
}
.hub-card .hub-ico svg{width:28px;height:28px;}
.hub-card.tone-green .hub-ico{background:var(--good-soft);color:var(--good);}
.hub-card.tone-clay .hub-ico{background:var(--danger-soft);color:var(--danger);}
.hub-card b{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.15;}
.hub-card span{font-size:13.5px;color:var(--ink-3);line-height:1.4;}

.backbar{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.backbar button{
  display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:0 16px 0 12px;
  border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:15.5px;font-weight:600;color:var(--ink-2);
}
.backbar button svg{width:19px;height:19px;}
.backbar h1{font-size:23px;margin-left:2px;}

/* huge log tiles */
.big-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;}
.big-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:122px;border-radius:var(--r-lg);padding:14px 8px;
  font-weight:700;box-shadow:var(--shadow);position:relative;
  transition:transform .08s ease;border:1px solid transparent;
}
.big-tile:active{transform:scale(.97);}
.big-tile .t-ico{width:34px;height:34px;}
.big-tile .t-ico svg{width:34px;height:34px;}
.big-tile .t-count{
  font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;
}
.big-tile .t-label{font-size:13.5px;font-weight:700;letter-spacing:.02em;}
.big-tile.t-consult{background:var(--primary);color:var(--primary-ink);}
.big-tile.t-check{background:var(--gold-500);color:#25200C;}
.big-tile.t-met{background:var(--surface);color:var(--ink);border-color:var(--line);}
.big-tile .t-plus{
  position:absolute;top:9px;right:10px;font-size:20px;font-weight:700;opacity:.55;line-height:1;
}

/* vein detail card */
.vein-card{
  border:1px solid var(--gold-300);background:var(--accent-soft);
  border-radius:var(--r-lg);padding:18px;margin-top:14px;
}
:root[data-theme="dark"] .vein-card,
:root:not([data-theme="light"]) .vein-card{border-color:var(--gold-600);}
.vein-card h3{font-size:22px;margin-bottom:3px;}
.vein-card .vk{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
.vein-card dl{display:grid;gap:10px;margin:14px 0 0;}
.vein-card dt{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px;}
.vein-card dd{margin:0;font-size:15px;line-height:1.55;}
.vein-card .warn-dd{color:var(--danger);font-weight:500;}

/* device thumb in list */
.dev-thumb{
  width:74px;height:74px;flex:none;border-radius:13px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:5px;
}
.dev-thumb svg{width:100%;height:100%;}

.vw-svg .ac-band{fill:var(--accent-soft);stroke:var(--gold-300);stroke-width:1.5;}
.vw-svg .lbl-zone{font-size:10px;font-weight:700;letter-spacing:.1em;fill:var(--accent);}

.vw-svg .dressing{fill:var(--accent-soft);stroke:var(--gold-300);stroke-width:1.4;opacity:.85;}
.vw-svg .exit{fill:var(--ink-2);stroke:var(--surface);stroke-width:1.5;}
.vw-svg .ac-crease{stroke:var(--ink-3);stroke-width:2;opacity:.9;}
.vw-svg .cath-ext{fill:none;stroke:var(--gold-500);stroke-width:5;stroke-linecap:round;}
.vw-svg .hub{fill:var(--gold-500);stroke:var(--blue-950);stroke-width:1.2;}
.vw-svg .measure{fill:none;stroke:var(--ink-2);stroke-width:1.4;color:var(--ink-2);}
.vw-svg .band{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:5 4;}

/* topic blocks */
.topic-body h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 7px;}
.topic-body h4:first-child{margin-top:0;}
.topic-body p{font-size:15px;line-height:1.6;margin:0 0 10px;}
.topic-body ul,.topic-body ol{margin:0 0 10px;padding-left:20px;}
.topic-body li{font-size:15px;line-height:1.6;margin-bottom:7px;}
.callout{
  display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);margin:12px 0;
  font-size:14.5px;line-height:1.55;
}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px;}
.callout.warn{background:var(--danger-soft);color:var(--danger);}
.callout.warn b{color:var(--danger);}
.callout.tip{background:var(--accent-soft);color:var(--ink);}
.callout.tip svg{color:var(--accent);}
.tbl-wrap{overflow-x:auto;margin:12px 0;}
table.vw-tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;}
table.vw-tbl th{
  text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  padding:8px 10px;border-bottom:1.5px solid var(--line);font-weight:700;
}
table.vw-tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.5;}
table.vw-tbl tr td:first-child{font-weight:600;}
.factor-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:11px;box-shadow:var(--shadow);
}
.factor-card .fhead{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;}
.factor-card h3{font-size:19px;}
.factor-card .fblock{margin-bottom:11px;}
.factor-card .fblock:last-child{margin-bottom:0;}
.factor-card dt{
  font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px;
}
.factor-card dd{margin:0;font-size:15px;line-height:1.6;}
.factor-card .why dd{color:var(--ink);}
.factor-card .changes{
  border-left:3px solid var(--accent);padding-left:12px;
}

/* ---------- Rounds worklist ---------- */
.round-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--r);padding:14px 15px;margin-bottom:9px;box-shadow:var(--shadow);
}
.round-row .r-main{flex:1 1 130px;min-width:0;}
.round-row .r-main b{display:block;font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.1;}
.round-row .r-main span{display:block;font-size:13.5px;color:var(--ink-3);margin-top:3px;}
.round-row .r-actions{display:flex;gap:7px;align-items:center;margin-left:auto;}
.round-row .r-actions .btn{min-height:46px;}
.round-row .r-edit{min-width:40px;padding:0 10px;font-size:19px;line-height:1;color:var(--ink-3);}
.round-row.is-done{
  border-left-color:var(--good);background:var(--surface-2);box-shadow:none;padding:11px 15px;
}
.round-row.is-done .r-main b{font-size:16px;font-weight:600;color:var(--ink-3);}
.round-row.is-done .r-main span{color:var(--ink-3);}
.round-row .badge{flex:none;}
pre.sample{
  margin:0;padding:12px 14px;background:var(--surface-3);border-radius:var(--r-sm);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.7;
  color:var(--ink-2);white-space:pre-wrap;
}
@media (max-width:420px){
  .round-row .r-actions{width:100%;margin-left:0;}
  .round-row .r-actions .btn-primary,.round-row .r-actions .btn-gold{flex:1;}
}

/* ---------- compatibility checker ---------- */
.compat-row{
  border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;
  background:var(--surface);box-shadow:var(--shadow);border-left:4px solid var(--line);
}
.compat-row .c-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px;}
.compat-row .c-head svg{width:20px;height:20px;flex:none;}
.compat-row .c-head b{font-size:16px;font-weight:600;flex:1;min-width:0;}
.compat-row p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2);}
.compat-row.bad{border-left-color:var(--danger);background:var(--danger-soft);}
.compat-row.bad .c-head svg{color:var(--danger);}
.compat-row.bad .c-head b{color:var(--danger);}
.compat-row.bad p{color:var(--ink);}
.compat-row.unknown{border-left-color:var(--ink-3);}
.compat-row.unknown .c-head svg{color:var(--ink-3);}
.compat-row.solo{border-left-color:var(--accent);background:var(--accent-soft);}
.compat-row.solo .c-head svg{color:var(--accent);}

/* ---------- Checks: expandable card grid ---------- */
.round-grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media (min-width:640px){.round-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;}}
@media (min-width:1100px){.round-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
.round-card{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
}
.round-card.is-open{border-left-color:var(--primary);box-shadow:var(--shadow-lg);}
.round-card.is-done{border-left-color:var(--good);background:var(--surface-2);box-shadow:none;}
.rc-head{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;
  width:100%;text-align:left;padding:14px 15px;
}
.rc-room{
  grid-column:1;font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;
}
.rc-meta{grid-column:1;font-size:13px;color:var(--ink-3);line-height:1.35;}
.rc-badge{grid-column:2;grid-row:1;}
.rc-caret{grid-column:2;grid-row:2;justify-self:end;color:var(--ink-3);display:flex;}
.rc-caret svg{width:18px;height:18px;transition:transform .18s ease;}
.round-card.is-open .rc-caret svg{transform:rotate(90deg);}
.rc-tick{grid-column:2;grid-row:1/3;align-self:center;color:var(--good);display:flex;}
.rc-tick svg{width:22px;height:22px;}
.round-card.is-done .rc-room{font-size:17px;color:var(--ink-3);}
.rc-quick{display:flex;gap:8px;padding:0 15px 14px;}
.rc-quick .btn{flex:1;}
.rc-body{padding:2px 15px 15px;border-top:1px solid var(--line-2);margin-top:2px;padding-top:13px;}
.rc-checks{display:grid;grid-template-columns:1fr;gap:7px;margin-top:4px;}
@media (min-width:420px){.rc-checks{grid-template-columns:1fr 1fr;}}
.check.chk-sm{min-height:44px;padding:8px 11px;font-size:14px;margin-bottom:0;}
.check.chk-sm input{width:20px;height:20px;}
.rc-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;}
.rc-actions .btn-primary,.rc-actions .btn-gold{flex:1;min-height:50px;}
.rc-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3);}
.rc-nums b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;}

/* ---------- Segmented bar (Guides tab) ---------- */
.segbar{
  display:flex;gap:6px;background:var(--surface-3);border:1px solid var(--line);
  border-radius:14px;padding:5px;margin:12px 0 4px;
}
.segbar button{
  flex:1;min-height:48px;border-radius:10px;font-size:14.5px;font-weight:600;
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;
  padding:0 8px;line-height:1.2;text-align:center;
}
.segbar button svg{width:19px;height:19px;flex:none;}
.segbar button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.09);}
@media (max-width:380px){.segbar button svg{display:none;}}

/* ---------- Open consult (type logged, details pending) ---------- */
.open-consult{
  background:var(--surface);border:2px solid var(--accent);border-radius:16px;
  padding:14px 15px;margin-bottom:10px;
}
.open-consult.is-stat{border-color:var(--danger);}
.oc-top{display:flex;align-items:flex-start;gap:11px;}
.oc-ico{
  width:42px;height:42px;flex:none;border-radius:12px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;color:var(--primary);
}
.oc-ico svg{width:23px;height:23px;}
.oc-name{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.15;}
.oc-since{font-size:13px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums;}
.oc-done{
  display:flex;align-items:center;gap:13px;width:100%;margin-top:13px;
  min-height:64px;padding:0 15px;border-radius:13px;
  background:var(--primary);color:var(--primary-ink);
  font-size:17px;font-weight:600;text-align:left;
}
.oc-box{
  width:30px;height:30px;flex:none;border-radius:8px;
  border:2.5px solid currentColor;display:flex;align-items:center;justify-content:center;
}
.oc-box svg{width:20px;height:20px;opacity:0;}
.oc-drop{
  display:flex;justify-content:center;gap:8px;margin-top:9px;
}
.oc-drop button{font-size:13px;color:var(--ink-3);min-height:40px;padding:0 12px;border-radius:10px;}
.oc-drop button:hover{background:var(--surface-3);}

/* ---------- Tab change: slide in the direction of travel ---------- */
@keyframes vwInL{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes vwInR{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.view.slide-l{animation:vwInL .19s cubic-bezier(.2,.7,.3,1);}
.view.slide-r{animation:vwInR .19s cubic-bezier(.2,.7,.3,1);}
@media (prefers-reduced-motion:reduce){.view.slide-l,.view.slide-r{animation:none;}}

/* ---------- Terms: the medical dictionary ---------- */
.searchbar-lg input{min-height:62px;font-size:17.5px;padding-left:44px;padding-right:50px;}
.searchbar-lg svg{left:15px;width:19px;height:19px;}
.sb-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--ink-3);
}
.sb-clear svg{width:18px;height:18px;}
.sb-clear:hover{background:var(--surface-3);}

.term-letter{
  font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--accent);
  letter-spacing:.12em;margin:18px 0 8px;padding-left:3px;
}
.term-letter:first-of-type{margin-top:4px;}
.term{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:8px;overflow:hidden;
}
.term.is-open{border-color:var(--gold-300);box-shadow:var(--shadow);}
.term-cats{
  display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.term-cats::-webkit-scrollbar{display:none;}
.term-cats .chip{flex:none;}
.term-head{
  display:flex;align-items:center;gap:11px;
  width:100%;text-align:left;padding:14px 15px;min-height:var(--tap);
}
.term-main{flex:1;min-width:0;}
.term-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.term-name{font-size:17px;font-weight:600;line-height:1.3;}
.term-abbr{
  display:block;font-size:13px;color:var(--ink-3);line-height:1.35;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.term-cat{
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);background:var(--surface-3);padding:3px 8px;border-radius:99px;white-space:nowrap;
}
.term-caret{flex:none;color:var(--ink-3);display:flex;}
.term-caret svg{width:16px;height:16px;transition:transform .18s ease;}
.term.is-open .term-caret svg{transform:rotate(90deg);}
.term-body{padding:0 15px 15px;border-top:1px solid var(--line-2);padding-top:13px;}
.term-def{font-size:16px;line-height:1.6;margin:0;}
.term-note{
  margin-top:12px;border-left:3px solid var(--accent);padding:2px 0 2px 12px;
}
.term-note b{
  display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:3px;
}
.term-note p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2);}
.term-also{margin-top:12px;font-size:13.5px;color:var(--ink-3);line-height:1.5;}
.term-also span,.term-see span{
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin-right:6px;
}
.term-see{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.term-see span{width:100%;margin-bottom:1px;}

/* ---------- Opening sequence ---------- */
.intro{
  position:fixed;inset:0;z-index:200;
  background:var(--cream-100);
  display:grid;place-items:center;overflow:hidden;
  transition:opacity .26s ease;
}
.intro.is-out{opacity:0;pointer-events:none;}
/* contain, not cover: the whole frame matters and the letterbox is
   the same cream as the video's own paper, so the seam does not show */
.intro-vid{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;opacity:0;transition:opacity .3s ease;
}
.intro.is-live .intro-vid{opacity:1;}
/* what shows while the video is still decoding, so the screen is never blank */
.intro-mark{
  display:flex;flex-direction:column;align-items:center;gap:13px;
  color:var(--blue-950);transition:opacity .3s ease;
}
.intro.is-live .intro-mark{opacity:0;}
.intro-mark{flex-direction:column;}
.intro-mark .brand-mark{width:76px;height:79px;}
.intro-mark .brand-word{width:184px;height:37px;background-position:center;}
.intro-skip{
  position:absolute;right:16px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  min-height:46px;padding:0 20px;border-radius:99px;
  background:rgba(11,53,80,.10);color:var(--blue-950);
  font-size:14.5px;font-weight:600;letter-spacing:.02em;
  opacity:0;animation:introSkipIn .4s ease 1.1s forwards;
}
@keyframes introSkipIn{to{opacity:1;}}
@media (prefers-reduced-motion:reduce){
  .intro-skip{opacity:1;animation:none;}
  .intro-vid{transition:none;}
}

/* ---------- Shift page: what is open and what is left ---------- */
.oc-noroom{color:var(--ink-3);font-weight:400;font-size:17px;font-family:var(--font-ui);}
.open-consult.is-compact{padding:12px 13px;}
.open-consult.is-compact .oc-done{min-height:54px;font-size:16px;margin-top:10px;}

.assign-empty{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);
  padding:16px 15px;min-height:74px;
}
.assign-empty > span{
  width:40px;height:40px;flex:none;border-radius:11px;background:var(--surface-3);
  display:grid;place-items:center;color:var(--ink-3);
}
.assign-empty > span svg{width:21px;height:21px;}
.assign-empty b{display:block;font-size:15.5px;font-weight:600;}
.assign-empty span span,.assign-empty div span{
  display:block;font-size:13px;color:var(--ink-3);line-height:1.4;margin-top:1px;
}

.todo-grid{display:grid;grid-template-columns:1fr;gap:9px;}
@media (min-width:560px){.todo-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (min-width:1000px){.todo-grid{grid-template-columns:1fr;}}
.todo-room{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
}
.tr-head{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 9px;
  width:100%;text-align:left;padding:12px 14px 9px;
}
.tr-no{
  grid-column:1;font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;
}
.tr-dev{grid-column:1;font-size:12.5px;color:var(--ink-3);}
.tr-badge{grid-column:2;grid-row:1/3;align-self:center;}
.tr-act{display:flex;gap:8px;padding:0 14px 12px;}
.tr-act .btn{flex:1;min-height:46px;}

/* ---------- Calendar: multi-select and the compact home grid ---------- */
.cal-day.picked{
  background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700;
}
.cal-day.picked .mk{outline:1px solid var(--surface);}
.cal-grid.cal-sm .cal-day{font-size:11.5px;padding:3px 1px 2px;border-radius:7px;}
.cal-grid.cal-sm .cal-dow{font-size:9px;}
.cal-grid.cal-sm .mk{width:4px;height:4px;}
.cal-next{
  display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line-2);
}
.cal-next b{display:block;font-size:14.5px;font-weight:600;}
.cal-next span{display:block;font-size:12.5px;color:var(--ink-3);}
.sel-bar{
  display:flex;align-items:center;gap:11px;margin-top:11px;padding:13px 14px;
  background:var(--accent-soft);border:1px solid var(--gold-300);border-radius:var(--r);
}
.sel-bar b{display:block;font-size:15px;font-weight:600;}
.sel-bar span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.4;}
.sel-bar .btn{flex:none;}
.sel-bar .btn[disabled]{opacity:.45;pointer-events:none;}

/* ---------- Aeterna Atelier, at the foot of every tab ---------- */
.aa-foot{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  margin-top:34px;padding-top:20px;border-top:1px solid var(--line-2);
}

    id:'m10448', pdf:'policies/M03-10-448-iv-therapy-general.pdf', num:'M03 10 448', name:'IV Therapy – General Guidelines', rev:'Revised 12/2025 · Next review 12/27',
    tag:'PIV',
    points:[
      'PIV placement requires a physician order; a saline lock may be inserted for sudden deterioration or when ordered treatments/tests require IV access.',
      'Nurses may not start IVs in the legs or feet of adults — LIP only, emergent, replaced within 24 h.',

      'Site selection starts most distal in the upper extremity and works up. Check limb alerts (M03 05 404).',
      'Avoid routine use of antecubital fossa veins — higher complication rates at areas of joint flexion.',
      'Choose the smallest catheter that delivers the therapy to reduce post-infusion phlebitis.',
      'EMS sites changed within 48 h and labeled "EMS site" with insertion date in the EHR.',
      'Maximum PIV dwell time is 29 days.',
      'One catheter per venipuncture attempt. One person attempts no more than two insertions; maximum four attempts total, then notify the physician. All attempts documented.',
      'All IVs require an extension set. Ultrasound guidance recommended for difficult access or after failed traditional attempts, by competency-validated staff only.',
      'Avoid idle "just in case" PIVs — remove promptly when the plan of care does not require them (CABSI reduction).',
      'Assess sites q4h; flush 10 mL NS at least q12h and before/after medications with push-pause; scrub the hub 15 seconds before every entry.',
      'TSM dressing, J-loop and securement changed at least every 7 days or immediately if integrity is compromised; gauze at least every 2 days.'

    tag:'Complication',
    points:[
      'Infiltration = inadvertent administration of a NON-vesicant into surrounding tissue. Extravasation = inadvertent administration of a VESICANT into surrounding tissue.',

        'Centre the exit site in the window. The catheter should not disappear under the adhesive border where you cannot assess it.',
        'No tension and no stretch. Lay the film down and smooth from the centre outward. Stretching it creates tension blisters and medical adhesive-related skin injury.',

VW.compatCheck = function (names) {
  const hits = [];
  for (let i = 0; i < names.length; i++) {
    for (let j = i + 1; j < names.length; j++) {
      const A = names[i], B = names[j];
      const p = VW.compat.pairs.find(x =>
        (x.a === A && x.b === B) || (x.a === B && x.b === A));
      hits.push({ a: A, b: B, bad: !!p, why: p ? p.why : null });
    }
  }
  const solos = VW.compat.solo.filter(s => names.indexOf(s.n) >= 0);
  return { pairs: hits, solos: solos };
};
