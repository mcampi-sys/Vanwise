  /* ---------------- data io ---------------- */
  function exportBlob() {
    const payload = JSON.stringify(Object.assign({ exported: new Date().toISOString(), app: 'Veinwise' }, S), null, 2);
    try {
      const blob = new Blob([payload], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'veinwise-backup-' + dateKey() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('Backup downloaded');
      // Previews and some in-app browsers block page-initiated downloads silently.
      setTimeout(() => toast('Nothing downloaded? Use Copy JSON instead'), 2800);
    } catch (e) { copyText(payload); }
  }
  function importPayload(text) {
    try {
      const p = JSON.parse(text);
      if (!p || typeof p !== 'object' || (!p.shifts && !p.settings)) { toast('That file is not a Veinwise backup'); return; }
      S = Object.assign(structuredClone(DEFAULTS), p);
      S.settings = Object.assign(structuredClone(DEFAULTS.settings), p.settings || {});
      S.lib = Object.assign(structuredClone(DEFAULTS.lib), p.lib || {});
      save(true); applyTheme(); toast('Backup restored'); render();
    } catch (e) { toast('Could not read that backup'); }
  }

  /* ---------------- theme: day and night ---------------- */
  function isNight() {
    const t = S.settings.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyTheme() {
    const t = S.settings.theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    const btn = $('#dayNight');
    if (btn) {
      const night = isNight();
      btn.innerHTML = night ? I.sun : I.moon;
      btn.setAttribute('aria-label', night ? 'Switch to day mode' : 'Switch to night mode');
      btn.title = night ? 'Day mode' : 'Night mode';
    }
  }
  /* the topbar button flips it outright; auto still lives in Settings */
  function toggleDayNight() {
    S.settings.theme = isNight() ? 'light' : 'dark';
    save(true); applyTheme(); render();
    toast(S.settings.theme === 'dark' ? 'Night mode' : 'Day mode');
  }

  /* the parent company sits at the foot of every tab */
  function aaFooter() {
    return `<div class="aa-foot">
      <span class="aa-mark" role="img" aria-label="Aeterna Atelier"></span>
      <span class="aa-line">Veinwise is a product of Aeterna Atelier</span>
    </div>`;
  }

  /* ---------------- calendar grid, shared by the Shift page and the Calendar ---------------- */
  function calGrid(opts) {
    const o = opts || {};
    const first = new Date(calYear, calMonth, 1);
    const startDow = first.getDay();
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    const todayK = dateKey();
    const worked = {}; S.shifts.forEach(s => { worked[s.date] = true; });
    if (S.current) worked[S.current.date] = true;
    const sched = {}; S.schedule.forEach(s => { (sched[s.date] = sched[s.date] || []).push(s); });

    let cells = '';
    for (let i = 0; i < startDow; i++) cells += `<div class="cal-day pad"></div>`;
    for (let d = 1; d <= days; d++) {
      const k = calYear + '-' + pad(calMonth + 1) + '-' + pad(d);
      const on = calSel.indexOf(k) >= 0;
      const kinds = (sched[k] || []).map(s => s.type || '');
      const night = kinds.some(t => /night/i.test(t));
      const day = kinds.some(t => /day/i.test(t));
      const off = kinds.some(t => /pto|off/i.test(t));
      cells += `<button class="cal-day${k === todayK ? ' today' : ''}${on ? ' picked' : ''}" data-day="${k}">
        <span>${d}</span><span class="marks">${day ? '<span class="mk sched"></span>' : ''}${night ? '<span class="mk night"></span>' : ''}${off ? '<span class="mk off"></span>' : ''}${worked[k] ? '<span class="mk worked"></span>' : ''}</span></button>`;
    }
    const monthName = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    return `<div class="cal-head">
        <button class="icon-btn" data-cal="-1" aria-label="Previous month">${I.back}</button>
        <h3>${esc(monthName)}</h3>
        <button class="icon-btn" data-cal="1" aria-label="Next month">${I.chev}</button>
      </div>
      <div class="cal-grid${o.compact ? ' cal-sm' : ''}">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
      ${o.legend === false ? '' : `<div class="cal-legend">
        <span><i class="lg sched"></i> Day</span><span><i class="lg night"></i> Night</span>
        <span><i class="lg off"></i> PTO</span><span><i class="lg worked"></i> Worked</span></div>`}`;
  }

  /* ---------------- render ---------------- */
  function render() {
    const main = $('#main');
    let html = '';
    if (active === 'shift') html = viewShift();
    else if (active === 'consults') html = viewConsults();
    else if (active === 'checks') html = viewChecks();
    else if (active === 'guides') html = viewGuides();
    else if (active === 'terms') html = viewTerms();
    else if (active === 'meds') html = viewMeds();
    else html = viewMore();
    main.innerHTML = `<div class="view">${html}${aaFooter()}</div>`;
    $$('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === active)));
    const tt = $('#topTitle');
    if (tt) { const t = TABS.find(x => x.id === active); tt.textContent = t ? t.label : 'Veinwise'; }
    const sh = cur();
    const pill = $('#shiftPill');
    if (pill) {
      pill.textContent = sh ? fmtDur(workedMs(sh)) : 'Off';
      pill.className = 'pill-clock' + (sh ? '' : ' off');
    }
    main.scrollTop = scrollMemory[active] || 0;
  }
  const scrollMemory = {};
  function go(tab, dir) {
    const main = $('#main');
    if (main) scrollMemory[active] = main.scrollTop;
    active = tab; render();
    if (main) {
      main.scrollTop = 0;
      const v = $('.view', main);
      if (v && dir) { v.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); }
    }
  }

  /* ---------- swipe left and right to change tab ---------- */
  function setupSwipe() {
    const main = $('#main');
    if (!main) return;
    let x0 = null, y0 = null, t0 = 0;
    main.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
    }, { passive: true });
    main.addEventListener('touchmove', e => {
      if (x0 == null) return;
      const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 14) x0 = null;   /* scrolling wins */
    }, { passive: true });
    main.addEventListener('touchend', e => {
      if (x0 == null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
      x0 = null;
      if (dt > 700 || Math.abs(dx) < 64 || Math.abs(dy) > 60) return;
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (el && el.closest('input, textarea, select, .tbl-wrap, .swipe-off')) return;
      shiftTab(dx < 0 ? 1 : -1);
    }, { passive: true });
  }

  function shiftTab(step) {
    const i = TABS.findIndex(x => x.id === active);
    const n = i + step;
    if (n < 0 || n >= TABS.length) return;
    go(TABS[n].id, step);
  }

  /* ---------- hardware / browser back steps out instead of closing the app ---------- */
  function armBack() { try { history.pushState({ vw: 1 }, ''); } catch (e) { } }
  function subIsDeep() {
    return sub.more !== 'home' || sub.ref !== 'hub' || sub.meds !== 'home' || sub.checks !== 'home';
  }
  function resetSub() { sub.more = 'home'; sub.ref = 'hub'; sub.meds = 'home'; sub.checks = 'home'; }
  function setupBack() {
    armBack();
    window.addEventListener('popstate', () => {
      if (sheetStack.length) { closeSheet(); armBack(); return; }
      if (subIsDeep()) { resetSub(); render(); armBack(); return; }
      if (active !== 'shift') { go('shift'); armBack(); return; }
      /* on Shift with nothing open: let the second back leave the app */
    });
  }

  /* ---------------- global click handling ---------------- */
  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { go(tab.dataset.tab); return; }

    const st = e.target.closest('[data-subtab]');
    if (st) {
      const [k, v] = st.dataset.subtab.split(':');
      sub[k] = v;
      const main = $('#main'); if (main) main.scrollTop = 0;
      render(); return;
    }

    const sm = e.target.closest('[data-submore]');
    if (sm) {
      sub.more = sm.dataset.submore;
      if (sub.more === 'reference') sub.ref = 'hub';
      render(); return;
    }

    const tg = e.target.closest('[data-toggle]');
    if (tg) {
      const item = tg.closest('.ref-item');
      const open = item.dataset.open === 'true';
      item.dataset.open = String(!open);
      $('.ref-body', item).hidden = open;
      return;
    }

    const cal = e.target.closest('[data-cal]');
    if (cal) {
      calMonth += Number(cal.dataset.cal);
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      render(); return;
    }

    const day = e.target.closest('[data-day]');
    if (day) {
      const k = day.dataset.day;
      if (calMulti) {
        const i = calSel.indexOf(k);
        if (i >= 0) calSel.splice(i, 1); else calSel.push(k);
        render();
      } else openDay(k);
      return;
    }

    const shiftBtn = e.target.closest('[data-shift]');
    if (shiftBtn) { openShiftReview(shiftBtn.dataset.shift); return; }

    const evRow = e.target.closest('[data-event]');
    if (evRow && !evRow.dataset.readonly) {
      const sh = cur(); if (!sh) return;
      const ev = sh.events.find(x => x.id === evRow.dataset.event); if (!ev) return;
      if (ev.kind === 'consult') openConsult(ev);
      else if (ev.kind === 'check') openCheck(ev);
      else openMet(ev);
      return;
    }

    const vhit = e.target.closest('[data-vein]');
    if (vhit) {
      veinSel = (veinSel === vhit.dataset.vein) ? null : vhit.dataset.vein;
      render();
      setTimeout(() => { const c = $('.vein-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 60);
      return;
    }

    const act = e.target.closest('[data-act]');
    if (!act) return;
    const id = act.dataset.id;
    switch (act.dataset.act) {
      case 'clockIn': clockIn(); break;
      case 'compatAdd': {
        const nm = act.dataset.name;
        if (compatSel.indexOf(nm) < 0) compatSel.push(nm);
        compatSearch = ''; render(); break;
      }
      case 'compatRemove': compatSel = compatSel.filter(x => x !== act.dataset.name); render(); break;
      case 'compatClear': compatSel = []; render(); break;
      case 'pasteRounds': openRoundsPaste(); break;
      case 'addRound': openRoundEditor(); break;
      case 'editRound': openRoundEditor((S.rounds || []).find(x => x.id === id)); break;
      case 'doneRound': completeRound(id, false); break;
      case 'saveRound': {
        harvestRoundCard(id);
        const item = (S.rounds || []).find(x => x.id === id);
        const sh = cur();
        if (item && sh && item.eventId) {
          const ev = sh.events.find(x => x.id === item.eventId);
          if (ev) {
            ev.device = item.device || 'other';
            ev.exposure = item.exposure || '';
            ev.circ = item.circ || '';
            ev.note = item.note || '';
            const fl = item.fields || {};
            ev.intact = !!fl.intact; ev.bloodReturn = !!fl.bloodReturn; ev.flushed = !!fl.flushed;
          }
        }
        roundOpen = null; save(true); toast('Saved'); render(); break;
      }
      case 'changedRound': completeRound(id, true); break;
      case 'undoRound': undoRound(id); break;
      case 'toggleRound': {
        if (roundOpen && roundOpen !== id) harvestRoundCard(roundOpen);
        roundOpen = (roundOpen === id) ? null : id;
        save(); render();
        break;
      }
      case 'clearRounds':
        openSheet({
          title: 'Clear the list?',
          body: '<p>This removes every room from the Rounds list. Checks you already logged into the shift stay in the log — only the list is cleared.</p>',
          confirm: 'Keep it', danger: 'Clear list',
          onDanger: () => { S.rounds = []; save(true); toast('List cleared'); render(); }
        });
        break;
      case 'clockOut': clockOut(); break;
      case 'break': toggleBreak(); break;
      case 'newConsult': if (requireShift()) openConsult(); break;
      case 'finishConsult': finishConsult(id); break;
      case 'editOpenRoom': editOpenRoom(id); break;
      case 'dropConsult': dropConsult(id); break;
      case 'toggleOpenStat': {
        const sh = cur(); if (!sh) break;
        const ev = sh.events.find(x => x.id === id); if (!ev) break;
        ev.stat = !ev.stat; save(true); render(); break;
      }
      case 'newCheck': if (requireShift()) openCheck(); break;
      case 'newMet': if (requireShift()) openMet(); break;
      case 'enableNotify': enableNotifications(); break;
      case 'testNotify': fireNotification('Veinwise test', 'If you can see this, your reminders will come through.'); break;
      case 'dismissBanner': bannerMsg = null; render(); break;
      case 'goCal': sub.more = 'calendar'; go('more'); break;
      case 'goRounds': go('checks'); break;
      case 'goConsults': go('consults'); break;
      case 'goChecks': go('checks'); break;
      case 'goGuidesDressings': sub.checks = 'home'; sub.guides = 'dressings'; go('guides'); break;
      case 'dayNight': toggleDayNight(); break;
      case 'calMulti': calMulti = !calMulti; if (!calMulti) calSel = []; render(); break;
      case 'calSelClear': calSel = []; render(); break;
      case 'calSelApply': applySelectedDays(); break;
      case 'goCalMulti': sub.more = 'calendar'; calMulti = true; calSel = []; go('more'); break;
      case 'playIntro': playIntro(() => { }, true); break;
      case 'termClear': termQ = ''; termOpen = null; render(); break;
      case 'termCat': termCat = act.dataset.v || ''; render(); break;
      case 'termOpen': termOpen = (termOpen === act.dataset.v) ? null : act.dataset.v; render(); break;
      case 'termGo': {
        /* jump to a cross-referenced term and open it */
        const name = act.dataset.v;
        const found = VW.terms.find(x => x.t === name)
          || VW.terms.find(x => x.t.toLowerCase() === String(name).toLowerCase());
        if (!found) { termQ = name; termOpen = null; }
        else { termQ = ''; termCat = ''; termOpen = found.t; }
        if (active !== 'terms') go('terms'); else render();
        setTimeout(() => {
          const el = $(`[data-term-card="${CSS.escape(termOpen || '')}"]`);
          if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 70);
        break;
      }
      case 'openPdf': openPdf(id); break;
      case 'attachPdf': attachPdf(id); break;
      case 'dropPdf': dropPdf(id); break;
      case 'addNote': {
        const sh = cur(); const t = ($('#noteInput') || {}).value.trim();
        if (!sh || !t) { toast('Type a note first'); break; }
        sh.notes = sh.notes || []; sh.notes.push({ id: uid(), at: Date.now(), text: t });
        save(true); toast('Note added'); render(); break;
      }
      case 'delNote': {
        const sh = cur(); if (!sh) break;
        sh.notes = (sh.notes || []).filter(n => n.id !== id); save(true); render(); break;
      }
      case 'runAlgo': runAlgo(document); render(); setTimeout(() => { const r = $('.algo-result'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); break;
      case 'resetAlgo': algoAnswers = {}; algoResult = null; render(); break;
      case 'scale': openScale(act.dataset.kind); break;
      case 'toggleDeep': veinDeep = !veinDeep; render(); break;
      case 'addMed': openMedEditor(); break;
      case 'editMed': openMedEditor(S.lib.meds.find(m => m.id === id)); break;
      case 'delMed': S.lib.meds = S.lib.meds.filter(m => m.id !== id); save(true); toast('Removed'); render(); break;
      case 'addVideo': openLinkEditor('video'); break;
      case 'delVideo': S.lib.videos = videos().filter(v => v.id !== id); save(true); render(); break;
      case 'addResource': openLinkEditor('resource'); break;
      case 'delResource': S.lib.resources = resources().filter(r => r.id !== id); save(true); render(); break;
      case 'delFlag': S.flags = S.flags.filter(f => f.id !== id); save(true); render(); break;
      case 'export': exportBlob(); break;
      case 'copyExport': copyText(JSON.stringify(S, null, 2)); break;
      case 'pasteImport':
        openSheet({
          title: 'Paste backup JSON', body: `<textarea id="pasteBox" style="min-height:220px" placeholder="Paste the contents of your backup file"></textarea>`,
          confirm: 'Restore', onConfirm: () => { importPayload(($('#pasteBox') || {}).value || ''); }
        });
        break;
      case 'wipe':
        openSheet({
          title: 'Erase everything?', body: '<p>This removes every shift, note, schedule entry and custom record from this device. If you have not exported a backup, it is gone.</p>',
          confirm: 'Keep my data', danger: 'Erase everything',
          onDanger: () => { try { localStorage.removeItem(KEY); } catch (e) { } S = structuredClone(DEFAULTS); save(true); applyTheme(); toast('All data erased'); render(); }
        });
        break;
      case 'delSched': S.schedule = S.schedule.filter(s => s.id !== id); save(true); toast('Removed'); render(); break;
    }
  });

  /* calendar day sheet */

        <div class="inline-2">

        });

  /* live inputs */
  document.addEventListener('input', e => {
    const t = e.target;

  /* theme chips live in settings */

  /* ---------------- opening sequence ----------------
     Aeterna Atelier into Veinwise. Plays on the first launch of the
     day and never gets in the way: one tap anywhere skips it, it
     dismisses itself when it ends, and anything that goes wrong
     (file missing, autoplay blocked, codec refused) drops straight
     through to the app rather than holding it up. */
  /* two encodes: VP9 where it is supported, H.264 everywhere else.
     Chromium builds without proprietary codecs cannot play the mp4 at all. */
  const INTRO_SRC = [
    { src: 'intro.webm', type: 'video/webm; codecs="vp9"' },
    { src: 'intro.mp4', type: 'video/mp4; codecs="avc1.42E01E"' }
  ];
  const INTRO_MAX = 9000;   /* hard ceiling, whatever the video does */

  function introDue() {
    const s = S.settings;
    if (s.intro === 'off') return false;
    if (s.intro === 'always') return true;
    if (s.intro === 'once') return !s.introSeen;
    return s.introSeen !== dateKey();        /* 'daily' */
  }

  function playIntro(done, force) {
    if (!force && !introDue()) return done();

    const back = document.createElement('div');
    back.className = 'intro';
    back.innerHTML = `
      <video class="intro-vid" playsinline muted autoplay preload="auto" disablepictureinpicture></video>
      <div class="intro-mark">${BRAND}</div>
      <button class="intro-skip" type="button">Skip</button>`;

    let finished = false, played = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timer); clearTimeout(stall);
      back.classList.add('is-out');
      setTimeout(() => { if (back.parentNode) back.parentNode.removeChild(back); }, 260);
      /* only count it as shown if it actually ran — a codec or network
         failure should not quietly burn today's play */
      if (played) { S.settings.introSeen = dateKey(); save(true); }
      done();
    };
    const timer = setTimeout(finish, INTRO_MAX);

    back.addEventListener('click', finish);
    document.body.appendChild(back);

    const v = $('.intro-vid', back);
    v.addEventListener('ended', finish);
    v.addEventListener('error', finish);
    /* not actually playing within 2.5s means it is not going to.
       Covers a slow load and a video that loaded but was left paused. */
    const stall = setTimeout(() => { if (!played) finish(); }, 2500);
    v.addEventListener('playing', () => { played = true; back.classList.add('is-live'); });

    INTRO_SRC.forEach(s => {
      if (v.canPlayType(s.type) === '') return;      /* skip what this browser refuses */
      const el = document.createElement('source');
      el.src = s.src; el.type = s.type.split(';')[0];
      v.appendChild(el);
    });
    if (!v.querySelector('source')) return finish();
    v.load();
    const go = v.play();
    if (go && go.catch) go.catch(finish);
  }

  /* ---------------- boot ---------------- */
  function buildFrame() {
    const app = $('#app');
    app.innerHTML = `
      <div class="app-main">
        <header class="topbar">
          <div class="brand">${BRAND}</div>
          <div class="topbar-title" id="topTitle">Shift</div>
          <div class="topbar-right">
            <button class="icon-btn" id="dayNight" data-act="dayNight" aria-label="Day or night mode"></button>
            <span class="pill-clock off" id="shiftPill">Off</span>
          </div>
        </header>
        <main id="main"></main>
      </div>
      <nav class="tabbar" aria-label="Main">
        ${TABS.map(t => `<button data-tab="${t.id}" aria-selected="${t.id === active}">${t.icon}<span>${t.label}</span></button>`).join('')}
      </nav>`;
  }

  function tick() {
    const sh = cur();
    if (sh) {
      const lt = $('#liveTimer');
      if (lt) lt.textContent = fmtDurLong(workedMs(sh));
      const pill = $('#shiftPill');
      if (pill) pill.textContent = fmtDur(workedMs(sh));
    }
    checkReminders();
  }

  function start() {
    applyTheme();
    playIntro(() => { });          /* runs over the app, never blocks it */
    buildFrame();
    applyTheme();                  /* again: the topbar button exists now */
    render();
    setupSwipe();
    setupBack();
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const onFlip = () => { if (S.settings.theme === 'auto') applyTheme(); };
      if (mq.addEventListener) mq.addEventListener('change', onFlip);
      else if (mq.addListener) mq.addListener(onFlip);
    }
    loadPdfIndex();
    document.addEventListener('keydown', e => {
      if (sheetStack.length) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      if (e.key === 'ArrowRight') shiftTab(1);
      else if (e.key === 'ArrowLeft') shiftTab(-1);
    });
    setInterval(tick, 1000);
    setInterval(() => { if (active === 'shift' && cur()) render(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkReminders(); render(); } });
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => { });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  window.VWApp = { state: () => S, render, go };
})();

</script>
</body>
</html>
